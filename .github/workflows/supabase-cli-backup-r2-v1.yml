name: Supabase CLI Backup to Cloudflare R2 - BlueGreen v2 orphan cleanup

on:
  schedule:
    # 05:00 UTC (12:00 VN) and 18:00 UTC (01:00 VN next day)
    - cron: '0 5,18 * * *'
  workflow_dispatch:
    inputs:
      truong_slug:
        description: 'Slug truong can sao luu; de trong de sao luu toan bo'
        required: false
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: supabase-db-bluegreen-${{ github.repository }}
  cancel-in-progress: false

env:
  BACKUP_FORMAT: supabase-cli-r2-v1
  BACKUP_PREFIX: database_backups_cli
  SAFETY_PREFIX: database_backups_cli_safety
  RETENTION_DAYS: '30'
  MIN_BACKUPS_PER_SCHOOL: '3'
  SUPABASE_CLI_VERSION: '2.117.0'

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Install PostgreSQL client and rclone
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client curl ca-certificates
          curl -fsSL https://rclone.org/install.sh | sudo bash
          docker info >/dev/null
          supabase --version
          psql --version
          rclone version | head -n 1

      - name: Configure Cloudflare R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${CF_ACCOUNT_ID:?Missing CF_ACCOUNT_ID}"
          : "${R2_ACCESS_KEY_ID:?Missing R2_ACCESS_KEY_ID}"
          : "${R2_SECRET_ACCESS_KEY:?Missing R2_SECRET_ACCESS_KEY}"
          mkdir -p ~/.config/rclone
          chmod 700 ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          region = auto
          endpoint = https://$CF_ACCOUNT_ID.r2.cloudflarestorage.com
          no_check_bucket = true
          EOF
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Create Supabase CLI backups
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DB_ID: ${{ secrets.CF_D1_DB_ID }}
          INPUT_SLUG: ${{ github.event.inputs.truong_slug }}
        run: |
          set -euo pipefail
          cat > backup_cli.js <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const { spawn } = require('child_process');

          const cfAccountId = process.env.CF_ACCOUNT_ID || '';
          const cfApiToken = process.env.CF_API_TOKEN || '';
          const cfDbId = process.env.CF_D1_DB_ID || '';
          const inputSlug = (process.env.INPUT_SLUG || '').trim();
          const backupFormat = process.env.BACKUP_FORMAT || 'supabase-cli-r2-v1';

          if (!cfAccountId || !cfApiToken || !cfDbId) {
            console.error('ERROR: Missing Cloudflare D1 secrets.');
            process.exit(1);
          }
          if (inputSlug && !/^[A-Za-z0-9_-]+$/.test(inputSlug)) {
            console.error('ERROR: truong_slug contains unsupported characters.');
            process.exit(1);
          }

          const managedSchemas = new Set([
            'auth', 'storage', 'realtime', 'graphql', 'graphql_public',
            'extensions', 'pgbouncer', 'pgsodium', 'pgsodium_masks',
            'vault', 'cron', 'supabase_functions', 'supabase_migrations',
            'net', '_realtime', '_analytics'
          ]);

          function safeError(err) {
            const text = String(err && (err.stderr || err.message || err) || 'Unknown error');
            return text.replace(/postgres(?:ql)?:\/\/[^\s"']+/gi, '[DATABASE_URL_REDACTED]').slice(0, 8000);
          }

          function run(command, args, options = {}) {
            return new Promise((resolve, reject) => {
              const child = spawn(command, args, {
                cwd: options.cwd,
                env: options.env || process.env,
                stdio: ['ignore', 'pipe', 'pipe']
              });
              let stdout = '';
              let stderr = '';
              child.stdout.on('data', d => {
                const s = d.toString();
                stdout += s;
                if (options.echoStdout) process.stdout.write(s);
                if (stdout.length > 8 * 1024 * 1024) stdout = stdout.slice(-8 * 1024 * 1024);
              });
              child.stderr.on('data', d => {
                const s = d.toString();
                stderr += s;
                if (options.echoStderr !== false) process.stderr.write(s);
                if (stderr.length > 8 * 1024 * 1024) stderr = stderr.slice(-8 * 1024 * 1024);
              });
              child.on('error', reject);
              child.on('close', code => {
                if (code === 0) return resolve({ stdout, stderr });
                const e = new Error(`${command} exited with code ${code}`);
                e.code = code;
                e.stdout = stdout;
                e.stderr = stderr;
                reject(e);
              });
            });
          }

          async function d1Query(sql, params = []) {
            const url = `https://api.cloudflare.com/client/v4/accounts/${cfAccountId}/d1/database/${cfDbId}/query`;
            const resp = await fetch(url, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${cfApiToken}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ sql, params })
            });
            const body = await resp.json().catch(() => ({}));
            if (!resp.ok || body.success === false) {
              throw new Error(`D1 query failed: HTTP ${resp.status}; ${JSON.stringify(body.errors || body)}`);
            }
            const block = body.result?.[0];
            if (!block || block.success === false) {
              throw new Error(`D1 query result failed: ${JSON.stringify(block || body)}`);
            }
            return block.results || [];
          }

          function pgEnvFromUrl(dbUrl) {
            const u = new URL(dbUrl);
            if (!['postgres:', 'postgresql:'].includes(u.protocol)) throw new Error('Invalid PostgreSQL URL protocol.');
            const dbName = decodeURIComponent((u.pathname || '/postgres').replace(/^\//, '')) || 'postgres';
            return {
              ...process.env,
              PGHOST: u.hostname,
              PGPORT: u.port || '5432',
              PGUSER: decodeURIComponent(u.username),
              PGPASSWORD: decodeURIComponent(u.password),
              PGDATABASE: dbName,
              PGSSLMODE: u.searchParams.get('sslmode') || 'require',
              PGCONNECT_TIMEOUT: '20'
            };
          }

          async function psql(dbUrl, sql, fieldSep = '\t') {
            const { stdout } = await run('psql', [
              '-X', '-v', 'ON_ERROR_STOP=1', '-A', '-t', '-F', fieldSep, '-c', sql
            ], { env: pgEnvFromUrl(dbUrl), echoStderr: false });
            return stdout.trim();
          }

          async function relationExists(dbUrl, regclass) {
            const escaped = regclass.replace(/'/g, "''");
            return (await psql(dbUrl, `SELECT CASE WHEN to_regclass('${escaped}') IS NULL THEN '0' ELSE '1' END;`)) === '1';
          }

          async function safeCount(dbUrl, qualified) {
            if (!(await relationExists(dbUrl, qualified))) return 0;
            const parts = qualified.split('.');
            const q = parts.map(x => '"' + x.replace(/"/g, '""') + '"').join('.');
            const out = await psql(dbUrl, `SELECT count(*)::bigint FROM ${q};`);
            return Number(out || 0);
          }

          function sha256File(file) {
            const h = crypto.createHash('sha256');
            h.update(fs.readFileSync(file));
            return h.digest('hex');
          }

          function parseQualifiedName(raw) {
            const quoted = raw.match(/^"((?:[^"]|"")+)"\."((?:[^"]|"")+)"$/);
            if (quoted) return [quoted[1].replace(/""/g, '"'), quoted[2].replace(/""/g, '"')];
            const idx = raw.indexOf('.');
            if (idx > 0) return [raw.slice(0, idx).replace(/^"|"$/g, ''), raw.slice(idx + 1).replace(/^"|"$/g, '')];
            return ['public', raw.replace(/^"|"$/g, '')];
          }

          function parseCopyCounts(dataFile) {
            const text = fs.readFileSync(dataFile, 'utf8');
            const lines = text.split(/\r?\n/);
            const counts = {};
            let current = null;
            let count = 0;
            for (const line of lines) {
              if (!current) {
                const m = line.match(/^COPY\s+(.+?)\s+\(.+\)\s+FROM stdin;$/);
                if (m) {
                  current = m[1];
                  count = 0;
                }
              } else if (line === '\\.') {
                const [schema, table] = parseQualifiedName(current);
                const key = `${schema}.${table}`;
                const isApp = !managedSchemas.has(schema) && !schema.startsWith('pg_') && schema !== 'information_schema';
                const isKeyManaged = ['auth.users', 'auth.identities', 'storage.buckets', 'storage.objects'].includes(key);
                if (isApp || isKeyManaged) counts[key] = count;
                current = null;
                count = 0;
              } else {
                count++;
              }
            }
            if (current) throw new Error('data.sql ended inside a COPY block.');
            return Object.fromEntries(Object.entries(counts).sort(([a], [b]) => a.localeCompare(b)));
          }

          async function collectManagedSignatures(dbUrl) {
            const triggersSql = `
              SELECT event_object_schema || '.' || event_object_table || '|' || trigger_name || '|' || event_manipulation || '|' || action_timing || '|' || action_orientation || '|' || coalesce(action_statement,'')
              FROM information_schema.triggers
              WHERE event_object_schema IN ('auth','storage','realtime')
              ORDER BY 1;`;
            const policiesSql = `
              SELECT schemaname || '.' || tablename || '|' || policyname || '|' || cmd || '|' || permissive || '|' || coalesce(array_to_string(roles,','),'') || '|' || coalesce(qual,'') || '|' || coalesce(with_check,'')
              FROM pg_policies
              WHERE schemaname IN ('auth','storage','realtime')
              ORDER BY 1;`;
            const tr = await psql(dbUrl, triggersSql, '\x1f');
            const po = await psql(dbUrl, policiesSql, '\x1f');
            return {
              triggers: tr ? tr.split(/\r?\n/).filter(Boolean) : [],
              policies: po ? po.split(/\r?\n/).filter(Boolean) : []
            };
          }

          async function collectExtensions(dbUrl) {
            const out = await psql(dbUrl, `SELECT extname || '|' || extversion FROM pg_extension ORDER BY extname;`, '\x1f');
            return out ? out.split(/\r?\n/).filter(Boolean).map(line => {
              const i = line.indexOf('|');
              return { name: line.slice(0, i), version: line.slice(i + 1) };
            }) : [];
          }

          async function collectRealtimeTables(dbUrl) {
            const exists = (await psql(dbUrl, `SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_publication WHERE pubname='supabase_realtime') THEN '1' ELSE '0' END;`)) === '1';
            if (!exists) return [];
            const out = await psql(dbUrl, `SELECT schemaname || '.' || tablename FROM pg_publication_tables WHERE pubname='supabase_realtime' ORDER BY schemaname, tablename;`, '\x1f');
            return out ? out.split(/\r?\n/).filter(Boolean) : [];
          }

          function roleLoginNames(rolesFile) {
            const text = fs.readFileSync(rolesFile, 'utf8');
            const names = new Set();
            for (const line of text.split(/\r?\n/)) {
              const m = line.match(/^CREATE ROLE\s+"?([^";\s]+)"?.*\bLOGIN\b/i);
              if (m) names.add(m[1]);
              const m2 = line.match(/^ALTER ROLE\s+"?([^";\s]+)"?.*\bLOGIN\b/i);
              if (m2) names.add(m2[1]);
            }
            return [...names].sort();
          }

          async function backupOne(row) {
            const slug = String(row.slug || '').trim();
            const dbUrl = String(row.supabase_sql || '').trim();
            if (!/^[A-Za-z0-9_-]+$/.test(slug)) throw new Error(`Invalid slug from D1: ${slug}`);
            if (!dbUrl) throw new Error(`[${slug}] Missing supabase_sql.`);

            const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}Z$/, 'Z');
            const base = `${slug}_${stamp}_${backupFormat}`;
            const dir = path.join('backups_cli', slug, base);
            fs.mkdirSync(dir, { recursive: true });

            const roles = path.join(dir, 'roles.sql');
            const schema = path.join(dir, 'schema.sql');
            const data = path.join(dir, 'data.sql');
            const histSchema = path.join(dir, 'history_schema.sql');
            const histData = path.join(dir, 'history_data.sql');
            const manifestPath = path.join(dir, 'manifest.json');
            const bundle = path.join('backups_cli', slug, `${base}.tar.gz`);
            const sideManifest = `${bundle}.manifest.json`;
            const shaFile = `${bundle}.sha256`;

            console.log(`\n=== BACKUP [${slug}] ===`);
            await run('supabase', ['db', 'dump', '--db-url', dbUrl, '-f', roles, '--role-only'], { echoStdout: true });
            await run('supabase', ['db', 'dump', '--db-url', dbUrl, '-f', schema], { echoStdout: true });
            await run('supabase', ['db', 'dump', '--db-url', dbUrl, '-f', data, '--use-copy', '--data-only', '-x', 'storage.buckets_vectors', '-x', 'storage.vector_indexes'], { echoStdout: true });

            for (const f of [roles, schema, data]) {
              if (!fs.existsSync(f) || fs.statSync(f).size === 0) throw new Error(`[${slug}] Empty dump component: ${path.basename(f)}`);
            }

            let hasMigrationHistory = false;
            if (await relationExists(dbUrl, 'supabase_migrations.schema_migrations')) {
              try {
                await run('supabase', ['db', 'dump', '--db-url', dbUrl, '-f', histSchema, '--schema', 'supabase_migrations'], { echoStdout: true });
                await run('supabase', ['db', 'dump', '--db-url', dbUrl, '-f', histData, '--use-copy', '--data-only', '--schema', 'supabase_migrations'], { echoStdout: true });
                hasMigrationHistory = fs.existsSync(histSchema) && fs.existsSync(histData) && fs.statSync(histSchema).size > 0;
              } catch (e) {
                console.warn(`[${slug}] WARNING: Could not preserve migration history: ${safeError(e)}`);
                for (const f of [histSchema, histData]) if (fs.existsSync(f)) fs.rmSync(f, { force: true });
              }
            }

            const copyCounts = parseCopyCounts(data);
            const managed = await collectManagedSignatures(dbUrl);
            const extensions = await collectExtensions(dbUrl);
            const realtimeTables = await collectRealtimeTables(dbUrl);
            const serverVersion = await psql(dbUrl, 'SHOW server_version;');
            const storageObjectsLive = await safeCount(dbUrl, 'storage.objects');
            const storageBucketsLive = await safeCount(dbUrl, 'storage.buckets');
            const vaultSecrets = await safeCount(dbUrl, 'vault.secrets');
            const authUsersLive = await safeCount(dbUrl, 'auth.users');
            const authIdentitiesLive = await safeCount(dbUrl, 'auth.identities');
            // Prefer counts parsed from data.sql because they describe the exact data dump snapshot.
            const authUsers = copyCounts['auth.users'] ?? authUsersLive;
            const authIdentities = copyCounts['auth.identities'] ?? authIdentitiesLive;
            const storageBuckets = copyCounts['storage.buckets'] ?? storageBucketsLive;
            const storageObjects = copyCounts['storage.objects'] ?? storageObjectsLive;
            const customLoginRoles = roleLoginNames(roles);

            const components = {};
            for (const f of [roles, schema, data, ...(hasMigrationHistory ? [histSchema, histData] : [])]) {
              components[path.basename(f)] = { sha256: sha256File(f), bytes: fs.statSync(f).size };
            }

            const manifest = {
              format: backupFormat,
              format_version: 1,
              source_slug: slug,
              created_at_utc: new Date().toISOString(),
              supabase_cli_version: process.env.SUPABASE_CLI_VERSION || 'unknown',
              postgres_server_version: serverVersion,
              components,
              has_migration_history: hasMigrationHistory,
              verification: {
                copy_row_counts: copyCounts,
                auth_users_count: authUsers,
                auth_identities_count: authIdentities,
                storage_buckets_count: storageBuckets,
                storage_objects_count: storageObjects,
                vault_secrets_count: vaultSecrets,
                extensions,
                realtime_publication_tables: realtimeTables,
                managed_schema_signatures: managed,
                custom_login_roles: customLoginRoles
              },
              limitations: {
                storage_object_files_included: false,
                auth_storage_custom_schema_automatically_recreated: false,
                encryption_root_key_included: false,
                edge_functions_included: false,
                auth_settings_and_api_keys_included: false
              }
            };

            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n', { mode: 0o600 });
            fs.copyFileSync(manifestPath, sideManifest);

            const archiveFiles = ['roles.sql', 'schema.sql', 'data.sql', 'manifest.json'];
            if (hasMigrationHistory) archiveFiles.push('history_schema.sql', 'history_data.sql');
            await run('tar', ['-czf', path.resolve(bundle), '-C', dir, ...archiveFiles], { echoStderr: false });
            await run('tar', ['-tzf', bundle], { echoStderr: false });

            const bundleSha = sha256File(bundle);
            fs.writeFileSync(shaFile, `${bundleSha}  ${path.basename(bundle)}\n`, { mode: 0o600 });

            console.log(`OK [${slug}] ${bundle}`);
            return { slug, bundle, shaFile, manifest: sideManifest, bundleSha, createdAt: manifest.created_at_utc };
          }

          async function main() {
            let sql = 'SELECT slug, supabase_sql FROM danh_sach_truong';
            const params = [];
            if (inputSlug) {
              sql += ' WHERE slug = ?';
              params.push(inputSlug);
            }
            sql += ' ORDER BY slug';
            const rows = await d1Query(sql, params);
            if (!rows.length) throw new Error(inputSlug ? `No D1 row found for slug [${inputSlug}].` : 'No school rows found in D1.');

            fs.mkdirSync('backups_cli', { recursive: true });
            const results = [];
            const failures = [];
            for (const row of rows) {
              try {
                results.push(await backupOne(row));
              } catch (e) {
                const slug = String(row.slug || 'unknown');
                const msg = safeError(e);
                failures.push({ slug, error: msg });
                console.error(`FAILED [${slug}]: ${msg}`);
              }
            }

            fs.writeFileSync('backup_results.json', JSON.stringify({ results, failures }, null, 2) + '\n');
            console.log(`\nBackup creation summary: success=${results.length}, failed=${failures.length}, total=${rows.length}`);
            if (!results.length) process.exit(2);
          }

          main().catch(err => {
            console.error(`FATAL: ${safeError(err)}`);
            process.exit(1);
          });
          NODE
          node backup_cli.js

      - name: Upload verified backup sets to R2 and apply retention
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          : "${R2_BUCKET_NAME:?Missing R2_BUCKET_NAME}"
          cat > upload_r2.js <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const os = require('os');
          const crypto = require('crypto');
          const { spawn } = require('child_process');

          const bucket = process.env.R2_BUCKET_NAME || '';
          const prefix = process.env.BACKUP_PREFIX || 'database_backups_cli';
          const safetyPrefix = process.env.SAFETY_PREFIX || 'database_backups_cli_safety';
          const backupFormat = process.env.BACKUP_FORMAT || 'supabase-cli-r2-v1';
          const retentionDays = Number(process.env.RETENTION_DAYS || 30);
          const minKeep = Math.max(1, Number(process.env.MIN_BACKUPS_PER_SCHOOL || 3));
          if (!bucket) throw new Error('Missing R2_BUCKET_NAME');

          function run(command, args) {
            return new Promise((resolve, reject) => {
              const child = spawn(command, args, { stdio: ['ignore', 'pipe', 'pipe'] });
              let stdout = '', stderr = '';
              child.stdout.on('data', d => { stdout += d.toString(); });
              child.stderr.on('data', d => { stderr += d.toString(); });
              child.on('error', reject);
              child.on('close', code => {
                if (code === 0) resolve({ stdout, stderr });
                else {
                  const e = new Error(`${command} exit ${code}: ${stderr.slice(-4000)}`);
                  e.stderr = stderr;
                  reject(e);
                }
              });
            });
          }

          function sha256File(file) {
            const h = crypto.createHash('sha256');
            h.update(fs.readFileSync(file));
            return h.digest('hex');
          }

          async function uploadOne(item) {
            const remoteDir = `r2:${bucket}/${prefix}/${item.slug}`;
            const bundleName = path.basename(item.bundle);
            const remoteBundle = `${remoteDir}/${bundleName}`;
            const remoteSha = `${remoteBundle}.sha256`;
            const remoteManifest = `${remoteBundle}.manifest.json`;
            const tmp = path.join(os.tmpdir(), `${process.pid}-${bundleName}`);
            console.log(`Uploading [${item.slug}] ${bundleName}`);
            try {
              await run('rclone', ['copyto', item.bundle, remoteBundle, '--s3-no-check-bucket']);
              await run('rclone', ['copyto', remoteBundle, tmp, '--s3-no-check-bucket']);
              const remoteHash = sha256File(tmp);
              fs.rmSync(tmp, { force: true });
              if (remoteHash !== item.bundleSha) throw new Error(`SHA-256 mismatch after R2 round trip: expected ${item.bundleSha}, got ${remoteHash}`);
              await run('rclone', ['copyto', item.shaFile, remoteSha, '--s3-no-check-bucket']);
              await run('rclone', ['copyto', item.manifest, remoteManifest, '--s3-no-check-bucket']);
              console.log(`VERIFIED R2 [${item.slug}] ${bundleName}`);
              return true;
            } catch (e) {
              fs.rmSync(tmp, { force: true });
              console.error(`UPLOAD FAILURE DETAIL [${item.slug}]: ${String(e.message || e).slice(0, 6000)}`);
              for (const remote of [remoteManifest, remoteSha, remoteBundle]) {
                try { await run('rclone', ['deletefile', remote, '--s3-no-check-bucket']); } catch (_) {}
              }
              return false;
            }
          }

          async function listRemoteFiles(remoteDir) {
            try {
              const { stdout } = await run('rclone', ['lsjson', remoteDir, '--files-only', '--s3-no-check-bucket']);
              return JSON.parse(stdout || '[]');
            } catch (e) {
              const msg = String(e.message || e);
              if (/directory not found|object not found|not found|404/i.test(msg)) return [];
              throw e;
            }
          }

          function managedArtifactInfo(fileName, slug) {
            let base = '';
            let kind = '';
            if (fileName.endsWith('.tar.gz.manifest.json')) {
              base = fileName.slice(0, -'.manifest.json'.length);
              kind = 'manifest';
            } else if (fileName.endsWith('.tar.gz.sha256')) {
              base = fileName.slice(0, -'.sha256'.length);
              kind = 'sha256';
            } else if (fileName.endsWith('.tar.gz')) {
              base = fileName;
              kind = 'bundle';
            } else {
              return null;
            }

            // Only touch artifacts created by this workflow family. This deliberately
            // excludes unrelated .tar.gz/.sha256/.json objects that a user may keep
            // in the same R2 folder. It also matches pre-restore safety bundles because
            // their base name still starts with the slug and ends with the same format.
            if (!base.startsWith(`${slug}_`) || !base.endsWith(`_${backupFormat}.tar.gz`)) return null;
            return { base, kind };
          }

          async function cleanupCompleteRetention(slug) {
            const remoteDir = `r2:${bucket}/${prefix}/${slug}`;
            const files = await listRemoteFiles(remoteDir);
            const byName = new Map(files.map(f => [f.Path, f]));
            const bundles = files
              .filter(f => f.Path.endsWith('.tar.gz'))
              .filter(f => byName.has(`${f.Path}.sha256`) && byName.has(`${f.Path}.manifest.json`))
              .sort((a, b) => new Date(b.ModTime) - new Date(a.ModTime));
            const cutoff = Date.now() - retentionDays * 86400 * 1000;
            const keep = new Set(bundles.slice(0, minKeep).map(f => f.Path));
            for (const b of bundles) {
              if (keep.has(b.Path)) continue;
              if (new Date(b.ModTime).getTime() >= cutoff) continue;
              for (const suffix of ['.manifest.json', '.sha256', '']) {
                const remote = `${remoteDir}/${b.Path}${suffix}`;
                try {
                  await run('rclone', ['deletefile', remote, '--s3-no-check-bucket']);
                  console.log(`Retention deleted complete-set artifact: ${remote}`);
                } catch (e) {
                  console.warn(`Retention warning for ${remote}: ${String(e.message || e).slice(0, 1000)}`);
                }
              }
            }
          }

          async function cleanupOrphansInDir(remoteDir, slug, label) {
            const files = await listRemoteFiles(remoteDir);
            const groups = new Map();
            for (const file of files) {
              const info = managedArtifactInfo(String(file.Path || ''), slug);
              if (!info) continue;
              if (!groups.has(info.base)) groups.set(info.base, new Map());
              groups.get(info.base).set(info.kind, file);
            }

            const cutoff = Date.now() - retentionDays * 86400 * 1000;
            let orphanSets = 0;
            let deletedFiles = 0;
            for (const [base, parts] of groups) {
              const complete = parts.has('bundle') && parts.has('sha256') && parts.has('manifest');
              if (complete) continue;

              // Safety rule: use the NEWEST timestamp among the surviving pieces.
              // The set is deleted only when every existing piece is older than the
              // retention window, so an upload currently in progress can never qualify.
              const times = [...parts.values()]
                .map(f => new Date(f.ModTime).getTime())
                .filter(Number.isFinite);
              if (!times.length) {
                console.warn(`Orphan cleanup skipped [${label}] ${base}: no valid ModTime.`);
                continue;
              }
              const newest = Math.max(...times);
              if (newest >= cutoff) continue;

              orphanSets++;
              const orderedKinds = ['manifest', 'sha256', 'bundle'];
              for (const kind of orderedKinds) {
                const file = parts.get(kind);
                if (!file) continue;
                const remote = `${remoteDir}/${file.Path}`;
                try {
                  await run('rclone', ['deletefile', remote, '--s3-no-check-bucket']);
                  deletedFiles++;
                  console.log(`Orphan cleanup deleted [${label}]: ${remote}`);
                } catch (e) {
                  console.warn(`Orphan cleanup warning [${label}] for ${remote}: ${String(e.message || e).slice(0, 1000)}`);
                }
              }
            }
            if (orphanSets || deletedFiles) {
              console.log(`Orphan cleanup summary [${label}] [${slug}]: sets=${orphanSets}, files_deleted=${deletedFiles}`);
            }
          }

          async function main() {
            const report = JSON.parse(fs.readFileSync('backup_results.json', 'utf8'));
            let uploadOk = 0, uploadFail = 0;
            const successfulSlugs = new Set();
            for (const item of report.results || []) {
              if (await uploadOne(item)) {
                uploadOk++;
                successfulSlugs.add(item.slug);
              } else uploadFail++;
            }
            // Preserve the existing complete-backup retention policy exactly:
            // only a slug with a newly verified upload is allowed to age out old
            // COMPLETE sets. This prevents a failed backup run from reducing recovery depth.
            for (const slug of successfulSlugs) {
              try { await cleanupCompleteRetention(slug); }
              catch (e) { console.warn(`Complete-set cleanup warning [${slug}]: ${String(e.message || e).slice(0, 3000)}`); }
            }

            // Orphan files are not valid restore points, so they may be cleaned even
            // when today's backup for that slug failed. Limit this to slugs present in
            // the current D1-driven report, require age > RETENTION_DAYS, and only touch
            // files that match this workflow's exact backup naming family.
            const knownSlugs = new Set([
              ...(report.results || []).map(x => String(x.slug || '')),
              ...(report.failures || []).map(x => String(x.slug || ''))
            ].filter(x => /^[A-Za-z0-9_-]+$/.test(x)));

            for (const slug of knownSlugs) {
              try {
                await cleanupOrphansInDir(`r2:${bucket}/${prefix}/${slug}`, slug, 'main');
              } catch (e) {
                console.warn(`Orphan cleanup warning [main] [${slug}]: ${String(e.message || e).slice(0, 3000)}`);
              }
              try {
                await cleanupOrphansInDir(`r2:${bucket}/${safetyPrefix}/${slug}`, slug, 'safety');
              } catch (e) {
                console.warn(`Orphan cleanup warning [safety] [${slug}]: ${String(e.message || e).slice(0, 3000)}`);
              }
            }

            console.log(`R2 summary: uploaded_verified=${uploadOk}, upload_failed=${uploadFail}, backup_generation_failed=${(report.failures || []).length}`);
            if (uploadFail > 0 || (report.failures || []).length > 0) process.exit(1);
          }

          main().catch(e => {
            console.error(`R2 FATAL: ${String(e.message || e).slice(0, 6000)}`);
            process.exit(1);
          });
          NODE
          node upload_r2.js

      - name: Cleanup local credentials and backup files
        if: always()
        run: |
          set +e
          rm -f ~/.config/rclone/rclone.conf
          rm -rf backups_cli backup_cli.js upload_r2.js backup_results.json
