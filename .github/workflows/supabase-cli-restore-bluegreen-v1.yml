name: Supabase CLI Restore Direct v6 - transactional compatibility restore

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: 'Suffix/slug cua truong can phuc hoi (D1 slug va thu muc backup mac dinh)'
        required: true
        type: string
      backup_file:
        description: 'Ten backup .tar.gz; de trong = tu dong chon backup hoan chinh moi nhat'
        required: false
        default: ''
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: supabase-db-restore-direct-${{ github.repository }}
  cancel-in-progress: false

env:
  BACKUP_FORMAT: supabase-cli-r2-v1
  BACKUP_PREFIX: database_backups_cli
  SAFETY_PREFIX: database_backups_cli_safety
  SUPABASE_CLI_VERSION: '2.117.0'

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Install PostgreSQL client and rclone
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client curl ca-certificates
          curl -fsSL https://rclone.org/install.sh | sudo bash
          supabase --version
          psql --version
          rclone version | head -n 1

      - name: Configure Cloudflare R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${CF_ACCOUNT_ID:?Missing CF_ACCOUNT_ID}"
          : "${R2_ACCESS_KEY_ID:?Missing R2_ACCESS_KEY_ID}"
          : "${R2_SECRET_ACCESS_KEY:?Missing R2_SECRET_ACCESS_KEY}"
          mkdir -p ~/.config/rclone
          chmod 700 ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF_RCLONE
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          region = auto
          endpoint = https://$CF_ACCOUNT_ID.r2.cloudflarestorage.com
          no_check_bucket = true
          EOF_RCLONE
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Restore selected suffix
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DB_ID: ${{ secrets.CF_D1_DB_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          INPUT_SUFFIX: ${{ github.event.inputs.suffix }}
          INPUT_BACKUP_FILE: ${{ github.event.inputs.backup_file }}
        run: |
          set -euo pipefail
          cat > restore_direct_v6.js <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const { spawn } = require('child_process');

          const cfAccountId = process.env.CF_ACCOUNT_ID || '';
          const cfApiToken = process.env.CF_API_TOKEN || '';
          const cfDbId = process.env.CF_D1_DB_ID || '';
          const bucket = process.env.R2_BUCKET_NAME || '';
          const prefix = process.env.BACKUP_PREFIX || 'database_backups_cli';
          const safetyPrefix = process.env.SAFETY_PREFIX || 'database_backups_cli_safety';
          const expectedFormat = process.env.BACKUP_FORMAT || 'supabase-cli-r2-v1';
          const suffix = (process.env.INPUT_SUFFIX || '').trim();
          const requestedFile = (process.env.INPUT_BACKUP_FILE || '').trim();

          if (!cfAccountId || !cfApiToken || !cfDbId) throw new Error('Missing Cloudflare D1 secrets.');
          if (!bucket) throw new Error('Missing R2_BUCKET_NAME.');
          if (!/^[A-Za-z0-9_-]+$/.test(suffix)) throw new Error('suffix is invalid.');

          const managedSchemas = new Set([
            'auth', 'storage', 'realtime', 'graphql', 'graphql_public',
            'extensions', 'pgbouncer', 'pgsodium', 'pgsodium_masks',
            'vault', 'cron', 'supabase_functions', 'supabase_migrations',
            'net', '_realtime', '_analytics'
          ]);

          function safeError(err) {
            const text = String(err && (err.stderr || err.message || err) || 'Unknown error');
            return text.replace(/postgres(?:ql)?:\/\/[^\s"']+/gi, '[DATABASE_URL_REDACTED]').slice(0, 16000);
          }

          function run(command, args, options = {}) {
            return new Promise((resolve, reject) => {
              const child = spawn(command, args, {
                cwd: options.cwd,
                env: options.env || process.env,
                stdio: ['ignore', 'pipe', 'pipe']
              });
              let stdout = '', stderr = '';
              child.stdout.on('data', d => {
                const s = d.toString(); stdout += s;
                if (options.echoStdout) process.stdout.write(s);
                if (stdout.length > 16 * 1024 * 1024) stdout = stdout.slice(-16 * 1024 * 1024);
              });
              child.stderr.on('data', d => {
                const s = d.toString(); stderr += s;
                if (options.echoStderr !== false) process.stderr.write(s);
                if (stderr.length > 16 * 1024 * 1024) stderr = stderr.slice(-16 * 1024 * 1024);
              });
              child.on('error', reject);
              child.on('close', code => {
                if (code === 0) return resolve({ stdout, stderr });
                const e = new Error(`${command} exited with code ${code}`);
                e.code = code; e.stdout = stdout; e.stderr = stderr;
                reject(e);
              });
            });
          }

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          async function d1Query(sql, params = []) {
            const url = `https://api.cloudflare.com/client/v4/accounts/${cfAccountId}/d1/database/${cfDbId}/query`;
            const resp = await fetch(url, {
              method: 'POST',
              headers: { Authorization: `Bearer ${cfApiToken}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ sql, params })
            });
            const body = await resp.json().catch(() => ({}));
            if (!resp.ok || body.success === false) throw new Error(`D1 query failed: HTTP ${resp.status}; ${JSON.stringify(body.errors || body)}`);
            const block = body.result?.[0];
            if (!block || block.success === false) throw new Error(`D1 query result failed: ${JSON.stringify(block || body)}`);
            return block.results || [];
          }

          async function loadTarget() {
            const rows = await d1Query('SELECT slug, supabase_sql FROM danh_sach_truong WHERE slug = ? LIMIT 1', [suffix]);
            if (!rows.length) throw new Error(`D1 has no row for suffix [${suffix}].`);
            const dbUrl = String(rows[0].supabase_sql || '').trim();
            if (!dbUrl) throw new Error(`D1 row [${suffix}] has empty supabase_sql.`);
            return { slug: suffix, dbUrl };
          }

          function pgEnvFromUrl(dbUrl) {
            const u = new URL(dbUrl);
            if (!['postgres:', 'postgresql:'].includes(u.protocol)) throw new Error('Invalid PostgreSQL URL protocol.');
            return {
              ...process.env,
              PGHOST: u.hostname,
              PGPORT: u.port || '5432',
              PGUSER: decodeURIComponent(u.username),
              PGPASSWORD: decodeURIComponent(u.password),
              PGDATABASE: decodeURIComponent((u.pathname || '/postgres').replace(/^\//, '')) || 'postgres',
              PGSSLMODE: u.searchParams.get('sslmode') || 'require',
              PGCONNECT_TIMEOUT: '20'
            };
          }

          async function psql(dbUrl, sql, fieldSep = '\t') {
            const { stdout } = await run('psql', ['-X', '-v', 'ON_ERROR_STOP=1', '-A', '-t', '-F', fieldSep, '-c', sql], {
              env: pgEnvFromUrl(dbUrl), echoStderr: false
            });
            return stdout.trim();
          }

          async function relationExists(dbUrl, regclass) {
            const escaped = regclass.replace(/'/g, "''");
            return (await psql(dbUrl, `SELECT CASE WHEN to_regclass('${escaped}') IS NULL THEN '0' ELSE '1' END;`)) === '1';
          }

          function quoteQualified(key) {
            const idx = key.indexOf('.');
            if (idx <= 0) throw new Error(`Invalid qualified table name: ${key}`);
            const a = key.slice(0, idx), b = key.slice(idx + 1);
            return '"' + a.replace(/"/g, '""') + '"."' + b.replace(/"/g, '""') + '"';
          }

          async function countTable(dbUrl, key) {
            if (!(await relationExists(dbUrl, key))) return null;
            return Number(await psql(dbUrl, `SELECT count(*)::bigint FROM ${quoteQualified(key)};`) || 0);
          }

          function sha256File(file) {
            const h = crypto.createHash('sha256');
            const fd = fs.openSync(file, 'r');
            const buf = Buffer.allocUnsafe(1024 * 1024);
            try {
              let n;
              while ((n = fs.readSync(fd, buf, 0, buf.length, null)) > 0) h.update(buf.subarray(0, n));
            } finally { fs.closeSync(fd); }
            return h.digest('hex');
          }

          function parseQualifiedName(raw) {
            const quoted = raw.match(/^"((?:[^"]|"")+)"\."((?:[^"]|"")+)"$/);
            if (quoted) return [quoted[1].replace(/""/g, '"'), quoted[2].replace(/""/g, '"')];
            const idx = raw.indexOf('.');
            if (idx > 0) return [raw.slice(0, idx).replace(/^"|"$/g, ''), raw.slice(idx + 1).replace(/^"|"$/g, '')];
            return ['public', raw.replace(/^"|"$/g, '')];
          }

          function parseCopyTableNames(dataFile) {
            const lines = fs.readFileSync(dataFile, 'utf8').split(/\r?\n/);
            const names = [];
            for (const line of lines) {
              const m = line.match(/^COPY\s+(.+?)\s+\(.+\)\s+FROM stdin;$/);
              if (!m) continue;
              const [schema, table] = parseQualifiedName(m[1]);
              if (!schema || !table) throw new Error(`Invalid COPY target: ${m[1]}`);
              names.push(`${schema}.${table}`);
            }
            return [...new Set(names)].sort();
          }

          function splitSqlIdentifierList(text) {
            const out = [];
            let cur = '', quoted = false;
            for (let i = 0; i < text.length; i++) {
              const ch = text[i];
              if (ch === '"') {
                cur += ch;
                if (quoted && text[i + 1] === '"') { cur += '"'; i++; continue; }
                quoted = !quoted;
                continue;
              }
              if (ch === ',' && !quoted) { out.push(cur.trim()); cur = ''; continue; }
              cur += ch;
            }
            if (cur.trim()) out.push(cur.trim());
            if (quoted) throw new Error(`Unterminated quoted identifier list: ${text}`);
            return out;
          }

          function unquoteIdentifier(raw) {
            const v = String(raw || '').trim();
            if (/^"(?:[^"]|"")+"$/.test(v)) return v.slice(1, -1).replace(/""/g, '"');
            return v;
          }

          function parseCopyLayouts(dataFile) {
            const lines = fs.readFileSync(dataFile, 'utf8').split(/\r?\n/);
            const layouts = new Map();
            for (const line of lines) {
              const m = line.match(/^COPY\s+(.+?)\s+\((.*)\)\s+FROM stdin;$/);
              if (!m) continue;
              const [schema, table] = parseQualifiedName(m[1]);
              if (!schema || !table) throw new Error(`Invalid COPY target: ${m[1]}`);
              const cols = splitSqlIdentifierList(m[2]).map(unquoteIdentifier);
              const key = `${schema}.${table}`;
              const old = layouts.get(key);
              if (old && JSON.stringify(old) !== JSON.stringify(cols)) throw new Error(`Backup contains inconsistent COPY layouts for ${key}.`);
              layouts.set(key, cols);
            }
            return layouts;
          }

          function sqlLiteral(value) { return "'" + String(value).replace(/'/g, "''") + "'"; }

          async function getTargetColumnMeta(dbUrl, key) {
            const q = sqlLiteral(key);
            const out = await psql(dbUrl, `
              SELECT COALESCE(json_agg(json_build_object(
                'name', a.attname,
                'type', format_type(a.atttypid, a.atttypmod),
                'not_null', a.attnotnull,
                'has_default', ad.oid IS NOT NULL,
                'generated', a.attgenerated,
                'identity', a.attidentity
              ) ORDER BY a.attnum)::text, '[]')
              FROM pg_attribute a
              LEFT JOIN pg_attrdef ad ON ad.adrelid=a.attrelid AND ad.adnum=a.attnum
              WHERE a.attrelid=to_regclass(${q}) AND a.attnum>0 AND NOT a.attisdropped;`);
            try { return JSON.parse(out || '[]'); }
            catch (_) { throw new Error(`Could not parse target column metadata for ${key}.`); }
          }

          async function preflightExistingDataCompatibility(dbUrl, files) {
            const merged = new Map();
            for (const file of files.filter(Boolean)) {
              if (!fs.existsSync(file)) continue;
              for (const [key, cols] of parseCopyLayouts(file)) {
                const old = merged.get(key);
                if (old && JSON.stringify(old) !== JSON.stringify(cols)) throw new Error(`Backup has conflicting COPY column layouts for ${key}.`);
                merged.set(key, cols);
              }
            }
            if (!merged.size) throw new Error('Backup contains no COPY table layout; refusing in-place destructive restore.');

            const errors = [], warnings = [];
            for (const [key, backupCols] of [...merged.entries()].sort(([a],[b]) => a.localeCompare(b))) {
              if (!(await relationExists(dbUrl, key))) { errors.push(`${key}: target table does not exist`); continue; }
              const meta = await getTargetColumnMeta(dbUrl, key);
              const byName = new Map(meta.map(x => [x.name, x]));
              const missing = backupCols.filter(c => !byName.has(c));
              if (missing.length) errors.push(`${key}: missing target column(s): ${missing.join(', ')}`);

              const generatedInCopy = backupCols.filter(c => byName.get(c)?.generated);
              if (generatedInCopy.length) errors.push(`${key}: backup COPY includes generated target column(s): ${generatedInCopy.join(', ')}`);

              const backupSet = new Set(backupCols);
              const requiredExtra = meta.filter(c => !backupSet.has(c.name) && c.not_null && !c.has_default && !c.generated && !c.identity);
              if (requiredExtra.length) errors.push(`${key}: target has required column(s) absent from backup COPY and without default: ${requiredExtra.map(x => x.name).join(', ')}`);

              const extra = meta.filter(c => !backupSet.has(c.name));
              if (extra.length) warnings.push(`${key}: target has ${extra.length} extra column(s); PostgreSQL transaction will validate defaults/constraints while loading`);
            }
            return { layouts: merged, errors, warnings };
          }

          function parseCopyCounts(dataFile) {
            const text = fs.readFileSync(dataFile, 'utf8');
            const lines = text.split(/\r?\n/);
            const counts = {};
            let current = null, count = 0;
            for (const line of lines) {
              if (!current) {
                const m = line.match(/^COPY\s+(.+?)\s+\(.+\)\s+FROM stdin;$/);
                if (m) { current = m[1]; count = 0; }
              } else if (line === '\\.') {
                const [schema, table] = parseQualifiedName(current);
                counts[`${schema}.${table}`] = count;
                current = null; count = 0;
              } else count++;
            }
            if (current) throw new Error('data.sql ended inside a COPY block.');
            return Object.fromEntries(Object.entries(counts).sort(([a], [b]) => a.localeCompare(b)));
          }

          function normalizeSql(text) {
            return text.split(/\r?\n/)
              .map(s => s.trim())
              .filter(s => s && !s.startsWith('--') && !/^\\(?:un)?restrict\b/i.test(s))
              .map(s => s.replace(/\s+/g, ' '))
              .join('\n');
          }

          function schemaFingerprint(file) {
            return crypto.createHash('sha256').update(normalizeSql(fs.readFileSync(file, 'utf8'))).digest('hex');
          }

          async function collectManagedSignatures(dbUrl) {
            const tr = await psql(dbUrl, `
              SELECT event_object_schema || '.' || event_object_table || '|' || trigger_name || '|' || event_manipulation || '|' || action_timing || '|' || action_orientation || '|' || coalesce(action_statement,'')
              FROM information_schema.triggers
              WHERE event_object_schema IN ('auth','storage','realtime') ORDER BY 1;`, '\x1f');
            const po = await psql(dbUrl, `
              SELECT schemaname || '.' || tablename || '|' || policyname || '|' || cmd || '|' || permissive || '|' || coalesce(array_to_string(roles,','),'') || '|' || coalesce(qual,'') || '|' || coalesce(with_check,'')
              FROM pg_policies WHERE schemaname IN ('auth','storage','realtime') ORDER BY 1;`, '\x1f');
            return {
              triggers: tr ? tr.split(/\r?\n/).filter(Boolean) : [],
              policies: po ? po.split(/\r?\n/).filter(Boolean) : []
            };
          }

          async function collectExtensions(dbUrl) {
            const out = await psql(dbUrl, `SELECT extname || '|' || extversion FROM pg_extension ORDER BY extname;`, '\x1f');
            return out ? out.split(/\r?\n/).filter(Boolean).map(line => {
              const i = line.indexOf('|');
              return { name: line.slice(0, i), version: line.slice(i + 1) };
            }) : [];
          }

          async function collectExtensionNames(dbUrl) {
            return (await collectExtensions(dbUrl)).map(x => x.name);
          }

          async function collectRealtimeTables(dbUrl) {
            const exists = (await psql(dbUrl, `SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_publication WHERE pubname='supabase_realtime') THEN '1' ELSE '0' END;`)) === '1';
            if (!exists) return [];
            const out = await psql(dbUrl, `SELECT schemaname || '.' || tablename FROM pg_publication_tables WHERE pubname='supabase_realtime' ORDER BY schemaname, tablename;`, '\x1f');
            return out ? out.split(/\r?\n/).filter(Boolean) : [];
          }

          async function inspectTarget(dbUrl) {
            const appRelations = Number(await psql(dbUrl, `
              SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE c.relkind IN ('r','p','v','m','S')
                AND n.nspname NOT IN ('auth','storage','realtime','graphql','graphql_public','extensions','pgbouncer','pgsodium','pgsodium_masks','vault','cron','supabase_functions','supabase_migrations','net','_realtime','_analytics','information_schema')
                AND n.nspname NOT LIKE 'pg_%'
                AND NOT EXISTS (SELECT 1 FROM pg_depend d WHERE d.objid=c.oid AND d.deptype='e');`));
            const appFunctions = Number(await psql(dbUrl, `
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname NOT IN ('auth','storage','realtime','graphql','graphql_public','extensions','pgbouncer','pgsodium','pgsodium_masks','vault','cron','supabase_functions','supabase_migrations','net','_realtime','_analytics','information_schema')
                AND n.nspname NOT LIKE 'pg_%'
                AND NOT EXISTS (SELECT 1 FROM pg_depend d WHERE d.objid=p.oid AND d.deptype='e');`));
            const authUsers = await countTable(dbUrl, 'auth.users');
            const authIdentities = await countTable(dbUrl, 'auth.identities');
            const storageObjects = await countTable(dbUrl, 'storage.objects');
            const storageBuckets = await countTable(dbUrl, 'storage.buckets');
            const dirty = [];
            if (appRelations > 0) dirty.push(`application relations=${appRelations}`);
            if (appFunctions > 0) dirty.push(`application functions=${appFunctions}`);
            if ((authUsers || 0) > 0) dirty.push(`auth.users=${authUsers}`);
            if ((authIdentities || 0) > 0) dirty.push(`auth.identities=${authIdentities}`);
            if ((storageObjects || 0) > 0) dirty.push(`storage.objects=${storageObjects}`);
            if ((storageBuckets || 0) > 0) dirty.push(`storage.buckets=${storageBuckets}`);
            return { clean: dirty.length === 0, dirty };
          }

          function normalizeBackupName(input) {
            let v = String(input || '').trim().replace(/^['"]|['"]$/g, '');
            if (!v || v.toLowerCase() === 'latest') return 'latest';
            v = v.replace(/\\/g, '/');
            try { if (/^https?:\/\//i.test(v)) v = new URL(v).pathname; } catch (_) {}
            v = v.split('/').filter(Boolean).pop() || '';
            if (v.endsWith('.tar.gz.sha256')) v = v.slice(0, -'.sha256'.length);
            if (v.endsWith('.tar.gz.manifest.json')) v = v.slice(0, -'.manifest.json'.length);
            if (!/^[A-Za-z0-9_.-]+\.tar\.gz$/.test(v)) throw new Error('backup_file must be blank/latest or a safe .tar.gz/.sha256/.manifest.json name.');
            return v;
          }

          async function listRemoteDir(remoteDir) {
            try {
              const { stdout } = await run('rclone', ['lsjson', remoteDir, '--files-only', '--s3-no-check-bucket'], { echoStderr: false });
              return JSON.parse(stdout || '[]');
            } catch (_) { return []; }
          }

          async function resolveBackupLocation() {
            const wanted = normalizeBackupName(requestedFile);
            const defaultDir = `r2:${bucket}/${prefix}/${suffix}`;
            const files = await listRemoteDir(defaultDir);
            const map = new Map(files.map(f => [f.Path, f]));
            if (wanted === 'latest') {
              const complete = files
                .filter(f => f.Path.endsWith('.tar.gz'))
                .filter(f => map.has(`${f.Path}.sha256`) && map.has(`${f.Path}.manifest.json`))
                .sort((a, b) => new Date(b.ModTime) - new Date(a.ModTime));
              if (!complete.length) throw new Error(`No complete Supabase CLI backup set found for suffix [${suffix}].`);
              return { remoteDir: defaultDir, name: complete[0].Path };
            }
            if (map.has(wanted) && map.has(`${wanted}.sha256`) && map.has(`${wanted}.manifest.json`)) {
              return { remoteDir: defaultDir, name: wanted };
            }

            const root = `r2:${bucket}/${prefix}`;
            const { stdout } = await run('rclone', ['lsjson', root, '--recursive', '--files-only', '--s3-no-check-bucket'], { echoStderr: false });
            const all = JSON.parse(stdout || '[]');
            const candidates = all.filter(f => path.posix.basename(f.Path) === wanted);
            const complete = [];
            const allNames = new Set(all.map(f => f.Path));
            for (const c of candidates) {
              if (allNames.has(`${c.Path}.sha256`) && allNames.has(`${c.Path}.manifest.json`)) complete.push(c.Path);
            }
            if (complete.length === 0) throw new Error(`Backup [${wanted}] was not found as a complete set in R2.`);
            if (complete.length > 1) throw new Error(`Backup filename [${wanted}] exists in multiple R2 folders. Use a unique filename.`);
            const full = complete[0];
            return { remoteDir: `${root}/${path.posix.dirname(full)}`, name: path.posix.basename(full) };
          }

          async function downloadAndVerifyBackup() {
            const loc = await resolveBackupLocation();
            fs.rmSync('restore_work', { recursive: true, force: true });
            fs.mkdirSync('restore_work', { recursive: true });
            const localBundle = path.join('restore_work', loc.name);
            const localSha = `${localBundle}.sha256`;
            const localManifest = `${localBundle}.manifest.json`;
            await run('rclone', ['copyto', `${loc.remoteDir}/${loc.name}`, localBundle, '--s3-no-check-bucket']);
            await run('rclone', ['copyto', `${loc.remoteDir}/${loc.name}.sha256`, localSha, '--s3-no-check-bucket']);
            await run('rclone', ['copyto', `${loc.remoteDir}/${loc.name}.manifest.json`, localManifest, '--s3-no-check-bucket']);

            const expected = fs.readFileSync(localSha, 'utf8').trim().split(/\s+/)[0];
            const actual = sha256File(localBundle);
            if (!/^[a-f0-9]{64}$/i.test(expected) || expected.toLowerCase() !== actual.toLowerCase()) throw new Error(`Backup SHA-256 mismatch for ${loc.name}.`);

            const outsideManifest = JSON.parse(fs.readFileSync(localManifest, 'utf8'));
            if (outsideManifest.format !== expectedFormat || outsideManifest.format_version !== 1) {
              throw new Error(`Unsupported backup format: ${outsideManifest.format} v${outsideManifest.format_version}`);
            }

            const { stdout: listOut } = await run('tar', ['-tzf', localBundle]);
            const entries = listOut.split(/\r?\n/).filter(Boolean);
            const allowed = new Set(['roles.sql','schema.sql','data.sql','manifest.json','history_schema.sql','history_data.sql']);
            for (const e of entries) {
              if (e.startsWith('/') || e.includes('..') || !allowed.has(e)) throw new Error(`Unsafe or unexpected archive entry: ${e}`);
            }
            for (const required of ['roles.sql','schema.sql','data.sql','manifest.json']) if (!entries.includes(required)) throw new Error(`Archive is missing ${required}.`);
            await run('tar', ['-xzf', localBundle, '--no-same-owner', '--no-same-permissions', '-C', 'restore_work']);
            const insideManifest = JSON.parse(fs.readFileSync(path.join('restore_work', 'manifest.json'), 'utf8'));
            if (JSON.stringify(insideManifest) !== JSON.stringify(outsideManifest)) throw new Error('Inside and sidecar manifests differ.');
            for (const [file, meta] of Object.entries(insideManifest.components || {})) {
              const f = path.join('restore_work', file);
              if (!fs.existsSync(f)) throw new Error(`Manifest component missing: ${file}`);
              if (sha256File(f) !== meta.sha256) throw new Error(`Component SHA-256 mismatch: ${file}`);
            }
            console.log(`Selected backup: ${loc.name}`);
            console.log(`Backup source slug: ${insideManifest.source_slug || 'unknown'}; target suffix: ${suffix}`);
            if (insideManifest.source_slug && insideManifest.source_slug !== suffix) {
              console.warn(`WARNING: cross-school restore requested by explicit backup selection: [${insideManifest.source_slug}] -> [${suffix}].`);
            }
            return { name: loc.name, manifest: insideManifest };
          }

          function makeRealtimeSql(manifest, dbUrl, file) {
            return collectRealtimeTables(dbUrl).then(actual => {
              const expected = (manifest.verification?.realtime_publication_tables || []).slice().sort();
              const a = new Set(actual), e = new Set(expected);
              const lines = ['-- Restore supabase_realtime publication membership'];
              for (const key of actual) if (!e.has(key)) lines.push(`ALTER PUBLICATION "supabase_realtime" DROP TABLE ${quoteQualified(key)};`);
              for (const key of expected) if (!a.has(key)) lines.push(`ALTER PUBLICATION "supabase_realtime" ADD TABLE ${quoteQualified(key)};`);
              fs.writeFileSync(file, lines.join('\n') + '\n');
            });
          }

          async function ensureExtensions(dbUrl, manifest) {
            const target = new Set(await collectExtensionNames(dbUrl));
            const missing = (manifest.verification?.extensions || []).map(x => x.name).filter(x => !target.has(x) && x !== 'plpgsql');
            for (const ext of missing) {
              if (!/^[A-Za-z0-9_-]+$/.test(ext)) throw new Error(`Unsafe extension name: ${ext}`);
              console.log(`Target missing extension [${ext}]; attempting CREATE EXTENSION IF NOT EXISTS.`);
              await psql(dbUrl, `CREATE EXTENSION IF NOT EXISTS "${ext.replace(/"/g, '""')}";`);
            }
            const after = new Set(await collectExtensionNames(dbUrl));
            const stillMissing = (manifest.verification?.extensions || []).map(x => x.name).filter(x => !after.has(x));
            if (stillMissing.length) throw new Error(`Target is missing required extensions: ${stillMissing.join(', ')}`);
          }

          async function createSafetyBackup(dbUrl) {
            console.log('Existing target detected: creating mandatory pre-restore safety backup first.');
            fs.rmSync('safety_work', { recursive: true, force: true });
            fs.mkdirSync('safety_work', { recursive: true });
            const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}Z$/, 'Z');
            const base = `${suffix}_${stamp}_pre_restore_safety_${expectedFormat}`;
            const dir = path.join('safety_work', base);
            fs.mkdirSync(dir, { recursive: true });
            const roles = path.join(dir, 'roles.sql');
            const schema = path.join(dir, 'schema.sql');
            const data = path.join(dir, 'data.sql');
            const histSchema = path.join(dir, 'history_schema.sql');
            const histData = path.join(dir, 'history_data.sql');

            await run('supabase', ['db','dump','--db-url',dbUrl,'-f',roles,'--role-only'], { echoStdout: true });
            await run('supabase', ['db','dump','--db-url',dbUrl,'-f',schema], { echoStdout: true });
            await run('supabase', ['db','dump','--db-url',dbUrl,'-f',data,'--use-copy','--data-only','-x','storage.buckets_vectors','-x','storage.vector_indexes'], { echoStdout: true });
            for (const f of [roles, schema, data]) if (!fs.existsSync(f) || fs.statSync(f).size === 0) throw new Error(`Safety dump component is empty: ${path.basename(f)}`);

            let hasHistory = false;
            if (await relationExists(dbUrl, 'supabase_migrations.schema_migrations')) {
              try {
                await run('supabase', ['db','dump','--db-url',dbUrl,'-f',histSchema,'--schema','supabase_migrations']);
                await run('supabase', ['db','dump','--db-url',dbUrl,'-f',histData,'--use-copy','--data-only','--schema','supabase_migrations']);
                hasHistory = fs.existsSync(histSchema) && fs.existsSync(histData) && fs.statSync(histSchema).size > 0;
              } catch (_) { hasHistory = false; }
            }

            const copyCounts = parseCopyCounts(data);
            const components = {};
            for (const f of [roles, schema, data, ...(hasHistory ? [histSchema, histData] : [])]) {
              components[path.basename(f)] = { sha256: sha256File(f), bytes: fs.statSync(f).size };
            }
            const manifest = {
              format: expectedFormat,
              format_version: 1,
              source_slug: suffix,
              created_at_utc: new Date().toISOString(),
              supabase_cli_version: process.env.SUPABASE_CLI_VERSION || 'unknown',
              postgres_server_version: await psql(dbUrl, 'SHOW server_version;'),
              components,
              has_migration_history: hasHistory,
              safety_snapshot_before_restore: true,
              verification: {
                copy_row_counts: copyCounts,
                auth_users_count: copyCounts['auth.users'] ?? await countTable(dbUrl, 'auth.users'),
                auth_identities_count: copyCounts['auth.identities'] ?? await countTable(dbUrl, 'auth.identities'),
                storage_buckets_count: copyCounts['storage.buckets'] ?? await countTable(dbUrl, 'storage.buckets'),
                storage_objects_count: copyCounts['storage.objects'] ?? await countTable(dbUrl, 'storage.objects'),
                vault_secrets_count: await countTable(dbUrl, 'vault.secrets'),
                extensions: await collectExtensions(dbUrl),
                realtime_publication_tables: await collectRealtimeTables(dbUrl),
                managed_schema_signatures: await collectManagedSignatures(dbUrl),
                custom_login_roles: []
              },
              limitations: {
                storage_object_files_included: false,
                auth_storage_custom_schema_automatically_recreated: false,
                encryption_root_key_included: false,
                edge_functions_included: false,
                auth_settings_and_api_keys_included: false
              }
            };
            const manifestFile = path.join(dir, 'manifest.json');
            fs.writeFileSync(manifestFile, JSON.stringify(manifest, null, 2) + '\n');
            const bundle = path.join('safety_work', `${base}.tar.gz`);
            const archive = ['roles.sql','schema.sql','data.sql','manifest.json'];
            if (hasHistory) archive.push('history_schema.sql','history_data.sql');
            await run('tar', ['-czf', path.resolve(bundle), '-C', dir, ...archive]);
            const sha = sha256File(bundle);
            const shaFile = `${bundle}.sha256`;
            const sideManifest = `${bundle}.manifest.json`;
            fs.writeFileSync(shaFile, `${sha}  ${path.basename(bundle)}\n`);
            fs.copyFileSync(manifestFile, sideManifest);

            const remoteDir = `r2:${bucket}/${safetyPrefix}/${suffix}`;
            await run('rclone', ['copyto', bundle, `${remoteDir}/${path.basename(bundle)}`, '--s3-no-check-bucket']);
            await run('rclone', ['copyto', shaFile, `${remoteDir}/${path.basename(shaFile)}`, '--s3-no-check-bucket']);
            await run('rclone', ['copyto', sideManifest, `${remoteDir}/${path.basename(sideManifest)}`, '--s3-no-check-bucket']);
            const verify = path.join('safety_work', `verify_${path.basename(bundle)}`);
            await run('rclone', ['copyto', `${remoteDir}/${path.basename(bundle)}`, verify, '--s3-no-check-bucket']);
            if (sha256File(verify) !== sha) throw new Error('Safety backup remote verification failed. Restore will NOT proceed.');
            console.log(`Safety backup verified on R2: ${safetyPrefix}/${suffix}/${path.basename(bundle)}`);
            return { currentSchemaFile: schema };
          }

          async function terminateClientSessions(dbUrl) {
            try {
              const sql = `
                SELECT pg_terminate_backend(pid)
                FROM pg_stat_activity
                WHERE datname = current_database()
                  AND pid <> pg_backend_pid()
                  AND backend_type = 'client backend'
                  AND usename <> 'supabase_admin';`;
              await psql(dbUrl, sql);
            } catch (err) {
              console.warn(`Could not terminate all client sessions before restore: ${safeError(err).split('\n')[0]}`);
            }
          }

          async function restoreCleanTarget(dbUrl, manifest) {
            await ensureExtensions(dbUrl, manifest);
            const realtimeFile = path.resolve('restore_work/realtime.sql');
            await makeRealtimeSql(manifest, dbUrl, realtimeFile);
            const rolesPath = 'restore_work/roles.sql';
            const schemaPath = 'restore_work/schema.sql';

            const buildArgs = () => {
              const args = [
                '-X','--single-transaction','--variable','ON_ERROR_STOP=1',
                '--file',path.resolve(rolesPath),
                '--file',path.resolve(schemaPath),
                '--command','SET session_replication_role = replica',
                '--file',path.resolve('restore_work/data.sql')
              ];
              if (manifest.has_migration_history && fs.existsSync('restore_work/history_schema.sql') && fs.existsSync('restore_work/history_data.sql')) {
                args.push('--file',path.resolve('restore_work/history_schema.sql'),'--file',path.resolve('restore_work/history_data.sql'));
              }
              args.push('--file', realtimeFile);
              return args;
            };

            function commentMatchingLines(file, matcher, reason) {
              const before = fs.readFileSync(file, 'utf8');
              let changed = 0;
              const after = before.split(/\r?\n/).map(line => {
                if (!/^\s*--/.test(line) && matcher(line)) {
                  changed++;
                  return `-- v6 compatibility (${reason}): ${line}`;
                }
                return line;
              }).join('\n');
              if (changed) fs.writeFileSync(file, after);
              return changed;
            }

            function patchCompatibilityError(msg) {
              let changed = 0;
              const pm = msg.match(/permission denied for parameter\s+["']?([A-Za-z0-9_.-]+)["']?/i);
              if (pm) {
                const param = pm[1];
                const esc = param.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const rx = new RegExp(`^\\s*ALTER\\s+(?:ROLE|USER)\\b.*\\b(?:SET|RESET)\\s+"?${esc}"?(?:\\s|=|;|$)`, 'i');
                changed += commentMatchingLines(rolesPath, line => rx.test(line), `target forbids role parameter ${param}`);
              }
              if (/permission denied to grant role\s+"?postgres"?|cli_login_postgres/i.test(msg)) {
                changed += commentMatchingLines(rolesPath, line => /^\s*GRANT\s+"?postgres"?\s+TO\s+"?cli_login_postgres"?/i.test(line), 'reserved Supabase role grant');
              }
              if (/supabase_admin/i.test(msg) && /(owner|permission|must be owner)/i.test(msg)) {
                changed += commentMatchingLines(schemaPath, line => /^\s*ALTER\s+.+\s+OWNER\s+TO\s+"?supabase_admin"?\s*;/i.test(line), 'Supabase-managed owner');
              }
              return changed;
            }

            let lastErr;
            for (let attempt = 1; attempt <= 8; attempt++) {
              try {
                console.log(`Clean-target restore transaction attempt ${attempt}/8 ...`);
                await run('psql', buildArgs(), { env: pgEnvFromUrl(dbUrl), echoStdout: true, echoStderr: true });
                console.log('Clean-target full logical restore COMMITTED successfully.');
                return;
              } catch (err) {
                lastErr = err;
                const msg = safeError(err);
                const changed = patchCompatibilityError(msg);
                if (!changed || attempt === 8) throw err;
                console.warn(`Restore transaction rolled back. Applied ${changed} narrowly-scoped Supabase compatibility patch(es); retrying.`);
              }
            }
            throw lastErr;
          }

          async function restoreExistingCompatibleTarget(dbUrl, manifest, currentSchemaFile) {
            const backupFp = schemaFingerprint('restore_work/schema.sql');
            const currentFp = schemaFingerprint(currentSchemaFile);
            console.log(`Schema fingerprint backup=${backupFp}`);
            console.log(`Schema fingerprint target=${currentFp}`);
            if (backupFp !== currentFp) {
              console.warn('Schema dump fingerprints differ. v6 does NOT treat a raw schema.sql hash mismatch as proof of incompatibility because separate Supabase projects can produce different dump text for platform/environment details.');
              console.warn('v6 will instead run a structural COPY-column preflight, then let PostgreSQL validate the actual data load inside one transaction. Any incompatibility causes a full rollback.');
            } else {
              console.log('Schema dump fingerprints are identical.');
            }

            const historyData = manifest.has_migration_history && fs.existsSync('restore_work/history_data.sql')
              ? 'restore_work/history_data.sql' : null;
            const preflight = await preflightExistingDataCompatibility(dbUrl, ['restore_work/data.sql', historyData]);
            for (const w of preflight.warnings) console.warn(`COMPAT WARNING: ${w}`);
            if (preflight.errors.length) {
              for (const e of preflight.errors) console.error(`COMPAT ERROR: ${e}`);
              throw new Error(`Existing target is structurally incompatible with this backup (${preflight.errors.length} hard incompatibility error(s)). No target data was changed. Use a clean/new Supabase project for a full schema+data restore.`);
            }
            console.log(`Structural COPY preflight PASSED for ${preflight.layouts.size} table(s).`);

            const uniqueTables = [...preflight.layouts.keys()].sort();
            for (const key of uniqueTables) {
              if (!(await relationExists(dbUrl, key))) throw new Error(`Target schema is missing table required by backup data: ${key}`);
            }

            // Existing-target restore is intentionally DATA-ONLY. It preserves the
            // target schema and restores the selected snapshot's rows. If schema.sql
            // differs, the safety backup plus single PostgreSQL transaction protect
            // the target: COPY/constraints/types are validated by PostgreSQL itself.
            // For an exact schema rollback, restore to a clean/new Supabase project.
            const truncateSql = [
              "SET lock_timeout = '30s';",
              "SET statement_timeout = '0';",
              'SET session_replication_role = replica;',
              `TRUNCATE TABLE ${uniqueTables.map(quoteQualified).join(', ')} CONTINUE IDENTITY;`
            ].join('\n') + '\n';
            fs.writeFileSync('restore_work/truncate.sql', truncateSql);

            function makeInPlaceDataFile(inputFile, outputFile) {
              const lines = fs.readFileSync(inputFile, 'utf8').split(/\r?\n/);
              let removed = 0;
              const out = lines.map(line => {
                if (/^\s*SELECT\s+pg_catalog\.setval\s*\(/i.test(line)) {
                  removed++;
                  return `-- in-place restore v6: preserved target sequence state; skipped: ${line}`;
                }
                return line;
              });
              fs.writeFileSync(outputFile, out.join('\n'));
              return removed;
            }

            const inPlaceData = path.resolve('restore_work/data_inplace.sql');
            let skippedSetvals = makeInPlaceDataFile('restore_work/data.sql', inPlaceData);
            let inPlaceHistoryData = null;
            if (historyData) {
              inPlaceHistoryData = path.resolve('restore_work/history_data_inplace.sql');
              skippedSetvals += makeInPlaceDataFile(historyData, inPlaceHistoryData);
            }
            console.log(`In-place sequence protection: CONTINUE IDENTITY; skipped ${skippedSetvals} pg_dump setval statement(s).`);

            const realtimeFile = path.resolve('restore_work/realtime.sql');
            await makeRealtimeSql(manifest, dbUrl, realtimeFile);

            const args = [
              '-X','--single-transaction','--variable','ON_ERROR_STOP=1',
              '--command',"SET lock_timeout = '30s'",
              '--command',"SET statement_timeout = '0'",
              '--command','SET session_replication_role = replica',
              '--file',path.resolve('restore_work/truncate.sql'),
              '--file',inPlaceData
            ];
            if (inPlaceHistoryData) args.push('--file',inPlaceHistoryData);
            args.push('--file', realtimeFile);

            let lastErr;
            for (let attempt = 1; attempt <= 4; attempt++) {
              await terminateClientSessions(dbUrl);
              try {
                console.log(`In-place transactional data restore attempt ${attempt}/4 ...`);
                await run('psql', args, { env: pgEnvFromUrl(dbUrl), echoStdout: true, echoStderr: true });
                console.log('In-place data restore COMMITTED successfully.');
                if (backupFp !== currentFp) {
                  console.warn('IMPORTANT: data was restored successfully into the CURRENT target schema. The target schema itself was not rolled back to the backup schema. For exact schema+data restoration, use a clean/new target.');
                }
                return;
              } catch (err) {
                lastErr = err;
                const msg = safeError(err);
                if (/(deadlock detected|lock timeout|could not obtain lock|canceling statement due to lock timeout)/i.test(msg) && attempt < 4) {
                  const wait = [5, 10, 20, 30][attempt - 1];
                  console.warn(`Lock contention detected; transaction rolled back. Retrying in ${wait}s.`);
                  await sleep(wait * 1000);
                  continue;
                }
                throw new Error(`Existing-target restore was rejected by PostgreSQL and fully rolled back. This normally means the current schema/data constraints are not compatible with the selected backup. Original error: ${msg}`);
              }
            }
            throw lastErr;
          }

          async function verifyTarget(dbUrl, manifest) {
            const errors = [], warnings = [];
            const expectedCounts = manifest.verification?.copy_row_counts || {};
            for (const [key, expected] of Object.entries(expectedCounts)) {
              const idx = key.indexOf('.');
              const schema = idx > 0 ? key.slice(0, idx) : '';
              const isApp = !managedSchemas.has(schema) && !schema.startsWith('pg_') && schema !== 'information_schema';
              const isKeyManaged = ['auth.users','auth.identities','storage.buckets','storage.objects'].includes(key);
              if (!isApp && !isKeyManaged) continue;
              const actual = await countTable(dbUrl, key);
              if (actual === null) errors.push(`missing table ${key}`);
              else if (Number(actual) !== Number(expected)) errors.push(`row count ${key}: expected=${expected}, actual=${actual}`);
            }

            const expectedManaged = manifest.verification?.managed_schema_signatures || { triggers: [], policies: [] };
            const actualManaged = await collectManagedSignatures(dbUrl);
            if (JSON.stringify(actualManaged.triggers) !== JSON.stringify(expectedManaged.triggers || [])) errors.push('managed-schema trigger signatures differ');
            if (JSON.stringify(actualManaged.policies) !== JSON.stringify(expectedManaged.policies || [])) errors.push('managed-schema policy signatures differ');

            const expectedRealtime = (manifest.verification?.realtime_publication_tables || []).slice().sort();
            const actualRealtime = (await collectRealtimeTables(dbUrl)).slice().sort();
            if (JSON.stringify(expectedRealtime) !== JSON.stringify(actualRealtime)) errors.push('supabase_realtime publication membership differs');

            const targetExt = new Set(await collectExtensionNames(dbUrl));
            const missingExt = (manifest.verification?.extensions || []).map(x => x.name).filter(x => !targetExt.has(x));
            if (missingExt.length) errors.push(`missing extensions: ${missingExt.join(', ')}`);

            const storageObjects = Number(manifest.verification?.storage_objects_count || 0);
            const vaultSecrets = Number(manifest.verification?.vault_secrets_count || 0);
            if (storageObjects > 0) warnings.push(`backup contains ${storageObjects} storage.objects metadata rows; actual Storage files are outside logical DB backup`);
            if (vaultSecrets > 0) warnings.push(`backup contains ${vaultSecrets} Vault secret rows; a newly created project has a different root encryption key unless migrated separately`);
            warnings.push('Auth settings/API keys/Edge Functions and other project-level settings are outside this logical database restore.');

            for (const w of warnings) console.warn(`WARNING: ${w}`);
            if (errors.length) {
              for (const e of errors) console.error(`VERIFY ERROR: ${e}`);
              throw new Error(`Post-restore verification failed with ${errors.length} error(s).`);
            }
            console.log('Post-restore database verification PASSED.');
          }

          async function main() {
            console.log(`RESTORE suffix: [${suffix}]`);
            console.log(`Requested backup file: [${requestedFile || 'LATEST COMPLETE'}]`);
            console.log('Mode is AUTO: same D1 suffix is the restore destination. No shadow/green suffix is required.');

            const target = await loadTarget();
            await psql(target.dbUrl, 'SELECT 1;');
            const { name, manifest } = await downloadAndVerifyBackup();
            const state = await inspectTarget(target.dbUrl);

            if (state.clean) {
              console.log('Target is CLEAN/NEW. Running full official Supabase logical restore (roles + schema + data).');
              await restoreCleanTarget(target.dbUrl, manifest);
            } else {
              console.log(`Target already contains data: ${state.dirty.join(', ')}`);
              console.log('Existing-target mode: safety backup -> structural COPY compatibility preflight -> transactional data rollback.');
              const safety = await createSafetyBackup(target.dbUrl);
              await restoreExistingCompatibleTarget(target.dbUrl, manifest, safety.currentSchemaFile);
            }

            await verifyTarget(target.dbUrl, manifest);
            console.log('RESTORE SUCCESS: database restore and verification completed.');
            console.log(`Target D1 suffix: [${suffix}] | Backup: [${name}] | Backup source: [${manifest.source_slug || 'unknown'}]`);
          }

          main().catch(err => {
            console.error(`ERROR: ${safeError(err)}`);
            process.exit(1);
          });
          NODE
          node restore_direct_v6.js

      - name: Cleanup local credentials and work files
        if: always()
        run: |
          set +e
          rm -f ~/.config/rclone/rclone.conf
          rm -rf restore_work safety_work restore_direct_v6.js
