name: Sao lưu CSDL Supabase lên Cloudflare R2 - bản ổn định

on:
  schedule:
    # 05:00 UTC (12:00 giờ Việt Nam) và 18:00 UTC (01:00 sáng hôm sau giờ Việt Nam)
    - cron: '0 5,18 * * *'
  workflow_dispatch:
    inputs:
      truong_slug:
        description: 'Nhập slug của trường cần sao lưu (để TRỐNG nếu muốn sao lưu TOÀN BỘ)'
        required: false
        type: string

# Không cho backup và restore chạy chồng lấn nhau trong cùng repository.
# File restore-final.yml dùng cùng concurrency group này.
concurrency:
  group: supabase-database-maintenance
  cancel-in-progress: false

permissions:
  contents: read

env:
  TZ: Asia/Ho_Chi_Minh

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install PostgreSQL client 17
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Install rclone
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Truy vấn D1 và tạo bản sao lưu cục bộ
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DB_ID: ${{ secrets.CF_D1_DB_ID }}
          INPUT_SLUG: ${{ github.event.inputs.truong_slug }}
        run: |
          set -euo pipefail
          cat << 'NODE' > backup_script.js
          'use strict';

          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const readline = require('readline');
          const { spawn } = require('child_process');
          const { pipeline } = require('stream/promises');
          const { createGzip, createGunzip } = require('zlib');
          const { Writable } = require('stream');

          const PG_DUMP = '/usr/lib/postgresql/17/bin/pg_dump';
          const STATUS_FILE = 'backup_status.json';
          const BACKUP_FORMAT_VERSION = '4';
          const BACKUP_SCOPE = 'public + auth.users + auth.identities';

          const cfAccountId = (process.env.CF_ACCOUNT_ID || '').trim();
          const cfApiToken = (process.env.CF_API_TOKEN || '').trim();
          const cfDbId = (process.env.CF_D1_DB_ID || '').trim();
          const inputSlug = (process.env.INPUT_SLUG || '').trim();

          const status = {
            version: 1,
            startedAt: new Date().toISOString(),
            finishedAt: null,
            successes: [],
            failures: [],
            fatal: null
          };

          function writeStatus() {
            status.finishedAt = new Date().toISOString();
            fs.writeFileSync(STATUS_FILE, JSON.stringify(status, null, 2) + '\n');
          }

          function safeErrorMessage(err) {
            let msg = err && err.message ? String(err.message) : String(err);
            msg = msg.replace(/postgres(?:ql)?:\/\/[^\s]+/gi, '[POSTGRES_URL_REDACTED]');
            msg = msg.replace(/password\s*=\s*[^\s]+/gi, 'password=[REDACTED]');
            return msg.split('\n').slice(0, 8).join('\n');
          }

          function validateSlug(slug) {
            return /^[A-Za-z0-9_-]+$/.test(slug);
          }

          function timestampVn() {
            const parts = new Intl.DateTimeFormat('en-GB', {
              timeZone: 'Asia/Ho_Chi_Minh',
              year: 'numeric', month: '2-digit', day: '2-digit',
              hour: '2-digit', minute: '2-digit', second: '2-digit',
              hourCycle: 'h23'
            }).formatToParts(new Date());
            const p = Object.fromEntries(parts.map(x => [x.type, x.value]));
            return `${p.hour}-${p.minute}-${p.second}_${p.day}-${p.month}-${p.year}`;
          }

          function connectionForPostgres(rawUrl) {
            let u;
            try {
              u = new URL(rawUrl);
            } catch {
              throw new Error('Chuỗi kết nối Supabase không phải PostgreSQL URL hợp lệ.');
            }
            if (!['postgresql:', 'postgres:'].includes(u.protocol)) {
              throw new Error('Chuỗi kết nối Supabase phải bắt đầu bằng postgresql:// hoặc postgres://.');
            }
            const password = decodeURIComponent(u.password || '');
            if (!password) throw new Error('Chuỗi kết nối Supabase không có mật khẩu.');
            u.password = '';
            return {
              safeUrl: u.toString(),
              env: {
                ...process.env,
                PGPASSWORD: password,
                PGCONNECT_TIMEOUT: '20'
              }
            };
          }

          function runToFile(command, args, outputFile, env, append = false) {
            return new Promise((resolve, reject) => {
              const fd = fs.openSync(outputFile, append ? 'a' : 'w');
              let stderr = '';
              let settled = false;
              const child = spawn(command, args, {
                env,
                stdio: ['ignore', fd, 'pipe']
              });

              child.stderr.on('data', chunk => {
                stderr += chunk.toString();
                if (stderr.length > 1024 * 1024) stderr = stderr.slice(-1024 * 1024);
              });

              const finish = (err) => {
                if (settled) return;
                settled = true;
                try { fs.closeSync(fd); } catch {}
                if (err) reject(err); else resolve();
              };

              child.on('error', err => finish(new Error(`Không chạy được ${path.basename(command)}: ${err.message}`)));
              child.on('close', code => {
                if (code === 0) return finish();
                const detail = stderr.trim().split('\n').slice(-12).join('\n');
                finish(new Error(`${path.basename(command)} thất bại (exit ${code})${detail ? `: ${detail}` : ''}`));
              });
            });
          }

          async function normalizePublicDump(filePath) {
            const tempPath = `${filePath}.normalized`;
            const input = fs.createReadStream(filePath, { encoding: 'utf8' });
            const output = fs.createWriteStream(tempPath, { encoding: 'utf8' });
            const rl = readline.createInterface({ input, crlfDelay: Infinity });

            for await (let line of rl) {
              // Các đối tượng global/system không cần thiết cho bản sao ứng dụng.
              if (/^(CREATE|ALTER|DROP) EVENT TRIGGER\b/.test(line)) continue;
              if (/^COMMENT ON EVENT TRIGGER\b/.test(line)) continue;
              if (/^COMMENT ON EXTENSION\b/.test(line)) continue;
              if (/^COMMENT ON SCHEMA "public"\b/.test(line)) continue;

              if (line === 'CREATE SCHEMA "public";') {
                line = 'CREATE SCHEMA IF NOT EXISTS "public";';
              } else if (line.startsWith('CREATE FUNCTION ')) {
                line = line.replace(/^CREATE FUNCTION /, 'CREATE OR REPLACE FUNCTION ');
              } else if (line.startsWith('CREATE PROCEDURE ')) {
                line = line.replace(/^CREATE PROCEDURE /, 'CREATE OR REPLACE PROCEDURE ');
              }

              if (!output.write(line + '\n')) {
                await new Promise(resolve => output.once('drain', resolve));
              }
            }

            await new Promise((resolve, reject) => {
              output.end(resolve);
              output.on('error', reject);
            });
            fs.renameSync(tempPath, filePath);
          }

          async function appendFile(target, source) {
            await pipeline(
              fs.createReadStream(source),
              fs.createWriteStream(target, { flags: 'a' })
            );
          }

          async function sha256(filePath) {
            const hash = crypto.createHash('sha256');
            await pipeline(fs.createReadStream(filePath), hash);
            return hash.digest('hex');
          }

          async function gzipAndVerify(sqlFile, gzipFile) {
            await pipeline(
              fs.createReadStream(sqlFile),
              createGzip({ level: 9 }),
              fs.createWriteStream(gzipFile)
            );

            // Đọc giải nén toàn bộ vào sink để phát hiện file gzip hỏng trước khi upload.
            await pipeline(
              fs.createReadStream(gzipFile),
              createGunzip(),
              new Writable({ write(_chunk, _enc, cb) { cb(); } })
            );
          }

          function buildPreCleanSql() {
            return String.raw`SET check_function_bodies = false;
          
          DO $restore_preclean$
          DECLARE
            r RECORD;
            dropped_any BOOLEAN;
            remaining_count INTEGER;
          BEGIN
            -- Chỉ hỗ trợ trigger nghiệp vụ trên auth.users/auth.identities khi trigger function nằm trong public.
            IF EXISTS (
              SELECT 1
              FROM pg_trigger t
              JOIN pg_class c ON c.oid = t.tgrelid
              JOIN pg_namespace tn ON tn.oid = c.relnamespace
              JOIN pg_proc p ON p.oid = t.tgfoid
              JOIN pg_namespace fn ON fn.oid = p.pronamespace
              WHERE NOT t.tgisinternal
                AND tn.nspname = 'auth'
                AND c.relname IN ('users', 'identities')
                AND fn.nspname <> 'public'
            ) THEN
              RAISE EXCEPTION 'Có trigger tùy chỉnh trên auth.users/auth.identities dùng function ngoài schema public. Dừng restore để tránh tác dụng phụ.';
            END IF;
          
            -- Đưa các trigger function public đang gắn vào Auth về No-Op TRƯỚC khi xóa bảng public.
            -- Nhờ vậy trigger trên auth vẫn tồn tại nhưng không chạy logic nghiệp vụ khi nạp lại user.
            FOR r IN (
              SELECT DISTINCT p.proname
              FROM pg_trigger t
              JOIN pg_class c ON c.oid = t.tgrelid
              JOIN pg_namespace tn ON tn.oid = c.relnamespace
              JOIN pg_proc p ON p.oid = t.tgfoid
              JOIN pg_namespace fn ON fn.oid = p.pronamespace
              WHERE NOT t.tgisinternal
                AND tn.nspname = 'auth'
                AND c.relname IN ('users', 'identities')
                AND fn.nspname = 'public'
                AND p.prorettype = 'pg_catalog.trigger'::regtype
            ) LOOP
              EXECUTE 'CREATE OR REPLACE FUNCTION "public".' || quote_ident(r.proname) ||
                      '() RETURNS trigger LANGUAGE plpgsql AS $fn$ BEGIN RETURN COALESCE(NEW, OLD); END; $fn$;';
            END LOOP;
          
            -- 1. Xóa View và Materialized View trong public (trừ đối tượng thuộc Extension).
            FOR r IN (
              SELECT c.relname, c.relkind
              FROM pg_class c
              JOIN pg_namespace n ON c.relnamespace = n.oid
              WHERE n.nspname = 'public'
                AND c.relkind IN ('v', 'm')
                AND NOT EXISTS (
                  SELECT 1 FROM pg_depend d
                  WHERE d.objid = c.oid AND d.deptype = 'e'
                )
            ) LOOP
              IF r.relkind = 'v' THEN
                EXECUTE 'DROP VIEW IF EXISTS "public".' || quote_ident(r.relname) || ' CASCADE;';
              ELSE
                EXECUTE 'DROP MATERIALIZED VIEW IF EXISTS "public".' || quote_ident(r.relname) || ' CASCADE;';
              END IF;
            END LOOP;
          
            -- 2. Xóa Table/Partitioned Table/Sequence trong public (trừ đối tượng thuộc Extension).
            FOR r IN (
              SELECT c.relname, c.relkind
              FROM pg_class c
              JOIN pg_namespace n ON c.relnamespace = n.oid
              WHERE n.nspname = 'public'
                AND c.relkind IN ('r', 'p', 'S')
                AND NOT EXISTS (
                  SELECT 1 FROM pg_depend d
                  WHERE d.objid = c.oid AND d.deptype = 'e'
                )
            ) LOOP
              IF r.relkind IN ('r', 'p') THEN
                EXECUTE 'DROP TABLE IF EXISTS "public".' || quote_ident(r.relname) || ' CASCADE;';
              ELSE
                EXECUTE 'DROP SEQUENCE IF EXISTS "public".' || quote_ident(r.relname) || ' CASCADE;';
              END IF;
            END LOOP;
          
            -- 3. Xóa Function/Procedure còn lại trong public nhưng KHÔNG xóa trigger function đang gắn vào Auth.
            -- Thử nhiều vòng để xử lý phụ thuộc giữa các routine; nếu còn phụ thuộc ngoài phạm vi backup thì dừng.
            LOOP
              dropped_any := FALSE;
              remaining_count := 0;
          
              FOR r IN (
                SELECT p.oid, p.proname, pg_get_function_identity_arguments(p.oid) AS args
                FROM pg_proc p
                JOIN pg_namespace n ON p.pronamespace = n.oid
                WHERE n.nspname = 'public'
                  AND p.prokind IN ('f', 'p')
                  AND NOT EXISTS (
                    SELECT 1 FROM pg_depend d
                    WHERE d.objid = p.oid AND d.deptype = 'e'
                  )
                  AND NOT EXISTS (
                    SELECT 1
                    FROM pg_trigger t
                    JOIN pg_class c ON c.oid = t.tgrelid
                    JOIN pg_namespace tn ON tn.oid = c.relnamespace
                    WHERE NOT t.tgisinternal
                      AND t.tgfoid = p.oid
                      AND tn.nspname = 'auth'
                      AND c.relname IN ('users', 'identities')
                  )
              ) LOOP
                remaining_count := remaining_count + 1;
                BEGIN
                  EXECUTE 'DROP ROUTINE IF EXISTS "public".' || quote_ident(r.proname) || '(' || r.args || ');';
                  dropped_any := TRUE;
                EXCEPTION WHEN dependent_objects_still_exist THEN
                  NULL;
                END;
              END LOOP;
          
              EXIT WHEN remaining_count = 0;
              IF NOT dropped_any THEN
                RAISE EXCEPTION 'Không thể xóa hết Function/Procedure trong public do còn phụ thuộc ngoài phạm vi backup.';
              END IF;
            END LOOP;
          
            -- 4. Xóa ENUM/DOMAIN/Composite tự định nghĩa. Không dùng CASCADE: nếu có phụ thuộc ngoài public thì dừng.
            LOOP
              dropped_any := FALSE;
              remaining_count := 0;
          
              FOR r IN (
                SELECT t.oid, t.typname
                FROM pg_type t
                JOIN pg_namespace n ON t.typnamespace = n.oid
                LEFT JOIN pg_class c ON t.typrelid = c.oid
                WHERE n.nspname = 'public'
                  AND (t.typtype IN ('e', 'd') OR (t.typtype = 'c' AND c.relkind = 'c'))
                  AND NOT EXISTS (
                    SELECT 1 FROM pg_depend d
                    WHERE d.objid = t.oid AND d.deptype = 'e'
                  )
              ) LOOP
                remaining_count := remaining_count + 1;
                BEGIN
                  EXECUTE 'DROP TYPE IF EXISTS "public".' || quote_ident(r.typname) || ';';
                  dropped_any := TRUE;
                EXCEPTION WHEN dependent_objects_still_exist THEN
                  NULL;
                END;
              END LOOP;
          
              EXIT WHEN remaining_count = 0;
              IF NOT dropped_any THEN
                RAISE EXCEPTION 'Không thể xóa hết kiểu dữ liệu trong public do còn phụ thuộc ngoài phạm vi backup.';
              END IF;
            END LOOP;
          
            -- 5. Làm sạch tài khoản cũ. KHÔNG sửa storage.buckets/storage.objects.
            -- Nếu có ràng buộc ngoài phạm vi backup ngăn xóa user, PostgreSQL sẽ báo lỗi và toàn bộ restore rollback.
            DELETE FROM auth.identities;
            DELETE FROM auth.users;
          END
          $restore_preclean$;
          `;
          }

          async function backupOne(truong, index, dateStr) {
            const rawSlug = String(truong.slug || '').trim();
            if (!rawSlug) throw new Error(`Bản ghi D1 thứ ${index + 1} thiếu slug.`);
            if (!validateSlug(rawSlug)) throw new Error(`Slug "${rawSlug}" chứa ký tự không được hỗ trợ. Chỉ cho phép A-Z, a-z, 0-9, _ và -.`);

            const dbUrl = String(truong.supabase_sql || '').trim();
            if (!dbUrl) throw new Error(`[${rawSlug}] Thiếu chuỗi kết nối supabase_sql.`);
            const conn = connectionForPostgres(dbUrl);

            const schoolDir = path.join('backups', rawSlug);
            fs.mkdirSync(schoolDir, { recursive: true });

            const baseName = `${rawSlug}_${dateStr}`;
            const sqlFile = path.join(schoolDir, `${baseName}.sql`);
            const gzipFile = `${sqlFile}.gz`;
            const checksumFile = `${gzipFile}.sha256`;
            const f1PreClean = path.join(schoolDir, `${baseName}.1_pre_clean.sql`);
            const f2AuthData = path.join(schoolDir, `${baseName}.2_auth_data.sql`);
            const f3PublicFull = path.join(schoolDir, `${baseName}.3_public_full.sql`);
            const tempFiles = [f1PreClean, f2AuthData, f3PublicFull, sqlFile];

            try {
              const preCleanSql = buildPreCleanSql();
              if (preCleanSql.includes('\\vert{}') || preCleanSql.includes('\u000b')) {
                throw new Error('Pre-clean SQL chứa ký tự bất hợp lệ.');
              }
              fs.writeFileSync(f1PreClean, preCleanSql, 'utf8');

              const commonArgs = [
                `--dbname=${conn.safeUrl}`,
                '--no-owner',
                '--no-privileges',
                '--quote-all-identifiers',
                '--lock-wait-timeout=30s'
              ];

              // Chỉ sao lưu schema public để đồng bộ chính xác với pre-clean của restore.
              await runToFile(PG_DUMP, [
                ...commonArgs,
                '--schema=public',
                '--no-publications',
                '--no-subscriptions',
                '--format=p'
              ], f3PublicFull, conn.env, false);

              // Auth chỉ sao lưu dữ liệu hai bảng cần thiết. Không dùng ON CONFLICT DO NOTHING:
              // nếu dữ liệu cũ chưa xóa sạch thì restore phải thất bại và rollback thay vì âm thầm bỏ qua.
              await runToFile(PG_DUMP, [
                ...commonArgs,
                '--data-only',
                '--table=auth.users',
                '--column-inserts',
                '--format=p'
              ], f2AuthData, conn.env, false);

              await runToFile(PG_DUMP, [
                ...commonArgs,
                '--data-only',
                '--table=auth.identities',
                '--column-inserts',
                '--format=p'
              ], f2AuthData, conn.env, true);

              if (fs.statSync(f3PublicFull).size < 100) throw new Error('pg_dump public tạo file quá nhỏ/bất thường.');
              if (fs.statSync(f2AuthData).size < 100) throw new Error('pg_dump auth tạo file quá nhỏ/bất thường.');

              await normalizePublicDump(f3PublicFull);

              const header = [
                `-- BACKUP_FORMAT_VERSION: ${BACKUP_FORMAT_VERSION}`,
                `-- BACKUP_SLUG: ${rawSlug}`,
                `-- BACKUP_CREATED_AT: ${new Date().toISOString()}`,
                `-- BACKUP_SCOPE: ${BACKUP_SCOPE}`,
                '-- Generated by GitHub Actions. Restore must be executed with ON_ERROR_STOP and a single transaction.',
                ''
              ].join('\n');
              fs.writeFileSync(sqlFile, header, 'utf8');
              await appendFile(sqlFile, f1PreClean);
              await appendFile(sqlFile, f2AuthData);
              await appendFile(sqlFile, f3PublicFull);

              const head = fs.readFileSync(sqlFile, { encoding: 'utf8', flag: 'r' }).slice(0, 64 * 1024);
              if (!head.includes(`-- BACKUP_SLUG: ${rawSlug}`)) throw new Error('Thiếu metadata BACKUP_SLUG trong file SQL.');
              if (head.includes('\\vert{}') || head.includes('\u000b')) throw new Error('File SQL chứa token/ký tự bất hợp lệ.');

              await gzipAndVerify(sqlFile, gzipFile);
              const digest = await sha256(gzipFile);
              fs.writeFileSync(checksumFile, `${digest}  ${path.basename(gzipFile)}\n`, 'utf8');

              const size = fs.statSync(gzipFile).size;
              if (size < 100) throw new Error('File .sql.gz quá nhỏ/bất thường.');

              return {
                slug: rawSlug,
                gzipFile,
                checksumFile,
                fileName: path.basename(gzipFile),
                sha256: digest,
                size
              };
            } finally {
              for (const f of tempFiles) {
                try { if (fs.existsSync(f)) fs.unlinkSync(f); } catch {}
              }
            }
          }

          async function main() {
            try {
              if (!cfAccountId || !cfApiToken || !cfDbId) {
                throw new Error('Thiếu một hoặc nhiều GitHub Secrets: CF_ACCOUNT_ID, CF_API_TOKEN, CF_D1_DB_ID.');
              }
              if (inputSlug && !validateSlug(inputSlug)) {
                throw new Error('truong_slug không hợp lệ. Chỉ cho phép A-Z, a-z, 0-9, _ và -.');
              }

              const d1ApiUrl = `https://api.cloudflare.com/client/v4/accounts/${cfAccountId}/d1/database/${cfDbId}/query`;
              let sql = 'SELECT supabase_sql, slug FROM danh_sach_truong';
              let payload = { sql };

              if (inputSlug) {
                sql += ' WHERE slug = ?';
                payload = { sql, params: [inputSlug] };
                console.log(`--- CHẾ ĐỘ: Sao lưu trường [${inputSlug}] ---`);
              } else {
                console.log('--- CHẾ ĐỘ: Sao lưu TOÀN BỘ danh sách trường ---');
              }

              const response = await fetch(d1ApiUrl, {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${cfApiToken}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
              });

              if (!response.ok) {
                throw new Error(`Cloudflare D1 HTTP ${response.status} ${response.statusText}.`);
              }

              let data;
              try {
                data = await response.json();
              } catch {
                throw new Error('Cloudflare D1 trả về dữ liệu không phải JSON hợp lệ.');
              }

              if (!data.success) {
                throw new Error(`Lỗi truy vấn D1: ${JSON.stringify(data.errors || [])}`);
              }

              const results = data.result?.[0]?.results;
              if (!Array.isArray(results) || results.length === 0) {
                throw new Error(inputSlug
                  ? `Không tìm thấy trường có slug "${inputSlug}" trong D1.`
                  : 'Bảng danh_sach_truong không có dữ liệu để sao lưu.');
              }

              const seen = new Set();
              for (const row of results) {
                const s = String(row.slug || '').trim();
                if (!validateSlug(s)) throw new Error(`D1 chứa slug không hợp lệ: "${s}".`);
                if (seen.has(s)) throw new Error(`D1 chứa slug trùng lặp: "${s}".`);
                seen.add(s);
              }

              fs.mkdirSync('backups', { recursive: true });
              const dateStr = timestampVn();
              const batchSize = 5;

              console.log(`Đã tìm thấy ${results.length} trường. Bắt đầu sao lưu theo lô tối đa ${batchSize} trường.`);

              for (let i = 0; i < results.length; i += batchSize) {
                const batch = results.slice(i, i + batchSize);
                console.log(`\nĐang xử lý trường ${i + 1} đến ${Math.min(i + batchSize, results.length)} / ${results.length}...`);

                const settled = await Promise.allSettled(
                  batch.map((truong, idx) => backupOne(truong, i + idx, dateStr))
                );

                settled.forEach((item, idx) => {
                  const slug = String(batch[idx].slug || `row-${i + idx + 1}`);
                  if (item.status === 'fulfilled') {
                    status.successes.push(item.value);
                    console.log(`✅ [${slug}] Tạo backup cục bộ thành công: ${item.value.fileName}`);
                  } else {
                    const message = safeErrorMessage(item.reason);
                    status.failures.push({ slug, error: message });
                    console.error(`❌ [${slug}] Backup thất bại: ${message}`);
                  }
                });
              }
            } catch (err) {
              status.fatal = safeErrorMessage(err);
              console.error(`❌ LỖI HỆ THỐNG: ${status.fatal}`);
            } finally {
              writeStatus();
              console.log('\n--- TỔNG KẾT TẠO BACKUP CỤC BỘ ---');
              console.log(`Thành công: ${status.successes.length} | Thất bại: ${status.failures.length}${status.fatal ? ' | Có lỗi hệ thống' : ''}`);
            }
          }

          main().catch(err => {
            status.fatal = safeErrorMessage(err);
            writeStatus();
            console.error(status.fatal);
          });
          NODE

          node --check backup_script.js
          node backup_script.js

      - name: Cấu hình Cloudflare R2
        if: always()
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT_ID"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          test -n "$R2_BUCKET_NAME"
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          region = auto
          endpoint = https://$CF_ACCOUNT_ID.r2.cloudflarestorage.com
          EOF
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Upload backup hợp lệ lên R2 và dọn bản cũ an toàn
        if: always()
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          cat << 'NODE' > upload_and_cleanup.js
          'use strict';

          const fs = require('fs');
          const path = require('path');
          const { spawn } = require('child_process');

          const bucket = (process.env.R2_BUCKET_NAME || '').trim();
          const BACKUP_STATUS = 'backup_status.json';
          const UPLOAD_STATUS = 'upload_status.json';
          const KEEP_MINIMUM = 2;
          const RETENTION_MS = 30 * 24 * 60 * 60 * 1000;

          function run(command, args, { allowFailure = false } = {}) {
            return new Promise((resolve, reject) => {
              let stdout = '';
              let stderr = '';
              const child = spawn(command, args, { stdio: ['ignore', 'pipe', 'pipe'] });
              child.stdout.on('data', d => { stdout += d.toString(); });
              child.stderr.on('data', d => { stderr += d.toString(); });
              child.on('error', reject);
              child.on('close', code => {
                if (code === 0 || allowFailure) return resolve({ code, stdout, stderr });
                reject(new Error(`${path.basename(command)} thất bại (exit ${code}): ${stderr.trim().split('\n').slice(-8).join('\n')}`));
              });
            });
          }

          async function remoteDelete(remotePath) {
            await run('rclone', ['deletefile', remotePath], { allowFailure: true });
          }

          async function cleanupSlug(slug) {
            const remoteDir = `r2:${bucket}/database_backups/${slug}/`;
            const result = await run('rclone', ['lsjson', remoteDir, '--files-only']);
            const all = JSON.parse(result.stdout || '[]');
            const gzFiles = all
              .filter(x => typeof x.Path === 'string' && x.Path.endsWith('.sql.gz'))
              .sort((a, b) => new Date(b.ModTime) - new Date(a.ModTime));

            const protectedNames = new Set(gzFiles.slice(0, KEEP_MINIMUM).map(x => x.Path));
            const cutoff = Date.now() - RETENTION_MS;
            let deleted = 0;

            for (const file of gzFiles) {
              if (protectedNames.has(file.Path)) continue;
              const modTime = new Date(file.ModTime).getTime();
              if (!Number.isFinite(modTime) || modTime >= cutoff) continue;

              await remoteDelete(`${remoteDir}${file.Path}`);
              await remoteDelete(`${remoteDir}${file.Path}.sha256`);
              deleted++;
            }

            return deleted;
          }

          async function main() {
            const uploadStatus = { uploaded: [], failures: [], cleanupFailures: [] };

            if (!bucket) {
              uploadStatus.failures.push({ slug: '*', error: 'Thiếu R2_BUCKET_NAME.' });
              fs.writeFileSync(UPLOAD_STATUS, JSON.stringify(uploadStatus, null, 2) + '\n');
              return;
            }

            if (!fs.existsSync(BACKUP_STATUS)) {
              uploadStatus.failures.push({ slug: '*', error: 'Không tìm thấy backup_status.json; không upload gì để tránh đẩy dữ liệu không xác định.' });
              fs.writeFileSync(UPLOAD_STATUS, JSON.stringify(uploadStatus, null, 2) + '\n');
              return;
            }

            const backupStatus = JSON.parse(fs.readFileSync(BACKUP_STATUS, 'utf8'));
            const successes = Array.isArray(backupStatus.successes) ? backupStatus.successes : [];

            for (const item of successes) {
              const slug = item.slug;
              const remoteDir = `r2:${bucket}/database_backups/${slug}/`;
              const remoteGz = `${remoteDir}${path.basename(item.gzipFile)}`;
              const remoteSha = `${remoteDir}${path.basename(item.checksumFile)}`;

              try {
                if (!fs.existsSync(item.gzipFile) || !fs.existsSync(item.checksumFile)) {
                  throw new Error('Thiếu file .sql.gz hoặc .sha256 cục bộ.');
                }

                console.log(`⬆️ [${slug}] Upload ${path.basename(item.gzipFile)}...`);
                await run('rclone', ['copyto', item.gzipFile, remoteGz, '--checksum', '--retries', '3', '--low-level-retries', '10']);
                await run('rclone', ['copyto', item.checksumFile, remoteSha, '--checksum', '--retries', '3', '--low-level-retries', '10']);

                uploadStatus.uploaded.push({ slug, fileName: path.basename(item.gzipFile) });
                console.log(`✅ [${slug}] Upload thành công.`);
              } catch (err) {
                // Nếu upload dở dang, xóa cặp remote để tránh "latest" chọn nhầm một backup không hoàn chỉnh.
                await remoteDelete(remoteGz);
                await remoteDelete(remoteSha);
                uploadStatus.failures.push({ slug, error: String(err.message || err) });
                console.error(`❌ [${slug}] Upload thất bại: ${err.message || err}`);
              }
            }

            // Chỉ cleanup trường đã upload thành công ở lần chạy hiện tại.
            // Nếu trường đang backup lỗi, bản tốt cũ của trường đó sẽ KHÔNG bị cleanup.
            for (const item of uploadStatus.uploaded) {
              try {
                const deleted = await cleanupSlug(item.slug);
                console.log(`🧹 [${item.slug}] Đã xóa ${deleted} backup quá 30 ngày; luôn giữ tối thiểu ${KEEP_MINIMUM} bản mới nhất.`);
              } catch (err) {
                uploadStatus.cleanupFailures.push({ slug: item.slug, error: String(err.message || err) });
                console.error(`⚠️ [${item.slug}] Cleanup thất bại: ${err.message || err}`);
              }
            }

            fs.writeFileSync(UPLOAD_STATUS, JSON.stringify(uploadStatus, null, 2) + '\n');
          }

          main().catch(err => {
            fs.writeFileSync(UPLOAD_STATUS, JSON.stringify({ uploaded: [], failures: [{ slug: '*', error: String(err.message || err) }], cleanupFailures: [] }, null, 2) + '\n');
            console.error(err);
          });
          NODE

          node --check upload_and_cleanup.js
          node upload_and_cleanup.js

      - name: Đánh giá kết quả cuối cùng
        if: always()
        run: |
          set -euo pipefail
          node << 'NODE'
          const fs = require('fs');
          let failed = false;

          if (!fs.existsSync('backup_status.json')) {
            console.error('❌ Không có backup_status.json.');
            process.exit(1);
          }
          const backup = JSON.parse(fs.readFileSync('backup_status.json', 'utf8'));
          const backupFailures = Array.isArray(backup.failures) ? backup.failures : [];
          if (backup.fatal || backupFailures.length > 0) {
            failed = true;
            console.error(`❌ Tạo backup có lỗi. Thành công: ${(backup.successes || []).length}, thất bại: ${backupFailures.length}${backup.fatal ? ', có lỗi hệ thống' : ''}.`);
          }

          if (!fs.existsSync('upload_status.json')) {
            console.error('❌ Không có upload_status.json.');
            process.exit(1);
          }
          const upload = JSON.parse(fs.readFileSync('upload_status.json', 'utf8'));
          const uploadFailures = Array.isArray(upload.failures) ? upload.failures : [];
          const cleanupFailures = Array.isArray(upload.cleanupFailures) ? upload.cleanupFailures : [];
          if (uploadFailures.length > 0 || cleanupFailures.length > 0) {
            failed = true;
            console.error(`❌ R2 có lỗi. Upload lỗi: ${uploadFailures.length}, cleanup lỗi: ${cleanupFailures.length}.`);
          }

          console.log(`✅ Số backup đã upload hợp lệ lên R2: ${(upload.uploaded || []).length}.`);
          if (failed) process.exit(1);
          console.log('✅ Toàn bộ quy trình backup hoàn tất không phát hiện lỗi.');
          NODE

      - name: Xóa cấu hình Rclone cục bộ
        if: always()
        run: rm -f ~/.config/rclone/rclone.conf
