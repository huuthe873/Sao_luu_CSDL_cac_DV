name: Sao lưu CSDL Supabase

on:
  schedule:
    - cron: '0 * * * *' # Cảnh báo: nên đổi thành chạy 1-2 lần/ngày nếu số lượng trường lớn
  workflow_dispatch: 

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Thêm Node.js để chạy script truy vấn Cloudflare API
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install PostgreSQL client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Truy vấn D1 và Thực thi Sao lưu
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DB_ID: ${{ secrets.CF_D1_DB_ID }}
        run: |
          cat << 'EOF' > backup_script.js
          const fs = require('fs');
          const { execSync } = require('child_process');

          const cfAccountId = process.env.CF_ACCOUNT_ID;
          const cfApiToken = process.env.CF_API_TOKEN;
          const cfDbId = process.env.CF_D1_DB_ID;

          if (!cfAccountId || !cfApiToken || !cfDbId) {
            console.error('LỖI: Thiếu biến môi trường Cloudflare Secrets.');
            process.exit(1);
          }

          async function main() {
            try {
              console.log('--- Bước 1: Lấy danh sách kết nối từ Cloudflare D1 ---');
              const d1ApiUrl = `https://api.cloudflare.com/client/v4/accounts/${cfAccountId}/d1/database/${cfDbId}/query`;
              
              // Lấy chuỗi kết nối postgres (db_url) và tên để làm file (ten_truong)
              const query = "SELECT db_url, ten_truong FROM danh_sach_truong";

              const d1Response = await fetch(d1ApiUrl, {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${cfApiToken}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({ sql: query })
              });

              const d1Data = await d1Response.json();
              if (!d1Data.success) {
                throw new Error('Lỗi truy vấn D1: ' + JSON.stringify(d1Data.errors));
              }

              const results = d1Data.result[0].results;
              if (!results || results.length === 0) {
                console.log('Không có dữ liệu trong bảng danh_sach_truong.');
                process.exit(0);
              }

              console.log(`Đã tìm thấy ${results.length} trường. Bắt đầu sao lưu...`);

              // Tạo thư mục backups nếu chưa có
              if (!fs.existsSync('backups')) {
                fs.mkdirSync('backups');
              }

              // Lấy ngày giờ làm đuôi file (VD: 2026-08-16_13-00-00)
              const now = new Date();
              const dateStr = now.toISOString().replace(/T/, '_').replace(/:/g, '-').split('.')[0];

              let successCount = 0;
              let failCount = 0;

              console.log('\n--- Bước 2: Tiến hành sao lưu (Chạy Tuần Tự) ---');
              // Khác với lệnh DUY TRÌ chạy song song, việc BACKUP phải chạy tuần tự 
              // để máy ảo không bị tràn RAM/Disk khi chạy cùng lúc hàng chục lệnh pg_dump
              
              for (let i = 0; i < results.length; i++) {
                const truong = results[i];
                const dbUrl = truong.db_url;
                
                // Lọc bỏ dấu cách và ký tự đặc biệt trong tên trường để làm tên file an toàn
                const tenFileSafe = (truong.ten_truong || `backup_${i}`).replace(/[^a-zA-Z0-9_-]/g, '_');
                
                console.log(`\n[${i + 1}/${results.length}] Đang sao lưu: ${tenFileSafe}`);

                if (!dbUrl) {
                  console.error('  -> BỎ QUA: Thiếu chuỗi kết nối db_url.');
                  failCount++;
                  continue;
                }

                const sqlFile = `backups/${tenFileSafe}-${dateStr}.sql`;

                try {
                  // 1. Thực thi lệnh pg_dump
                  const cmd = `/usr/lib/postgresql/17/bin/pg_dump "${dbUrl}" --clean --if-exists --quote-all-identifiers > ${sqlFile}`;
                  execSync(cmd, { stdio: 'pipe' });
                  
                  // 2. Nén file lại thành .gz để tiết kiệm dung lượng Git
                  execSync(`gzip ${sqlFile}`);
                  
                  console.log(`  -> ✅ Thành công: ${sqlFile}.gz`);
                  successCount++;
                } catch (error) {
                  console.error(`  -> ❌ THẤT BẠI: Quá trình pg_dump gặp lỗi.`);
                  // Dọn dẹp file lỗi để tránh push file rác lên Git
                  if (fs.existsSync(sqlFile)) fs.unlinkSync(sqlFile);
                  if (fs.existsSync(`${sqlFile}.gz`)) fs.unlinkSync(`${sqlFile}.gz`);
                  failCount++;
                }
              }

              console.log('\n--- TỔNG KẾT SAO LƯU ---');
              console.log(`Thành công: ${successCount} | Thất bại: ${failCount}`);

            } catch (err) {
              console.error('LỖI HỆ THỐNG TRẦM TRỌNG:', err.message);
              process.exit(1);
            }
          }

          main();
          EOF
          node backup_script.js

      - name: Commit and Push Backup
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Đã cập nhật: Xóa các bản sao lưu cũ (*.sql.gz) hơn 30 ngày
          find backups/ -name "*.sql.gz" -mtime +30 -type f -delete
          
          git add -A backups/
          git commit -m "chore: tự động sao lưu ${successCount:-các} trường $(date +'%Y-%m-%d')" || echo "Không có thay đổi nào để commit"
          git push
