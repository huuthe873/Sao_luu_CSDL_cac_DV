name: Phục hồi CSDL Supabase - moi3

on:
  workflow_dispatch:
    inputs:
      truong_slug:
        description: 'Slug của trường cần phục hồi (Ví dụ: truong-thpt-a)'
        required: true
        type: string
      backup_file:
        description: 'Tên file .sql.gz trên R2 (hoặc để "latest")'
        required: true
        default: 'latest'
        type: string

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PostgreSQL client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Cấu hình Cloudflare R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          cat << EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          region = auto
          endpoint = https://$CF_ACCOUNT_ID.r2.cloudflarestorage.com
          EOF

      - name: Lấy chuỗi kết nối và Phục hồi CSDL
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DB_ID: ${{ secrets.CF_D1_DB_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          INPUT_SLUG: ${{ github.event.inputs.truong_slug }}
          INPUT_FILE: ${{ github.event.inputs.backup_file }}
        run: |
          cat << 'EOF' > restore_script.js
          const fs = require('fs');
          const util = require('util');
          const exec = util.promisify(require('child_process').exec);
          
          const execOptions = { maxBuffer: 1024 * 1024 * 50 };
          const cfAccountId = process.env.CF_ACCOUNT_ID;
          const cfApiToken = process.env.CF_API_TOKEN;
          const cfDbId = process.env.CF_D1_DB_ID;
          const r2Bucket = process.env.R2_BUCKET_NAME;
          const slug = process.env.INPUT_SLUG.replace(/[^a-zA-Z0-9_-]/g, '');
          const fileReq = process.env.INPUT_FILE.trim();

          async function main() {
            try {
              console.log(`--- Đang truy vấn CSDL trường: ${slug} ---`);
              const d1ApiUrl = `https://api.cloudflare.com/client/v4/accounts/${cfAccountId}/d1/database/${cfDbId}/query`;
              const d1Response = await fetch(d1ApiUrl, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${cfApiToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ sql: "SELECT supabase_sql FROM danh_sach_truong WHERE slug = ?", params: [slug] })
              });
              const d1Data = await d1Response.json();
              const results = d1Data.result?.[0]?.results;

              if (!results || results.length === 0) throw new Error(`❌ Không tìm thấy trường "${slug}".`);
              const dbUrl = results[0].supabase_sql;
              if (!dbUrl) throw new Error("❌ Thiếu chuỗi kết nối.");
              
              let fileToDownload = fileReq;
              if (fileReq.toLowerCase() === 'latest') {
                const { stdout } = await exec(`rclone lsjson r2:${r2Bucket}/database_backups/${slug}/`, execOptions);
                const files = JSON.parse(stdout).filter(f => f.Path.endsWith('.sql.gz'));
                if (files.length === 0) throw new Error(`❌ Không có file backup.`);
                files.sort((a, b) => new Date(b.ModTime) - new Date(a.ModTime));
                fileToDownload = files[0].Path;
              }

              const localFileName = fileToDownload.split('/').pop();
              console.log(`⬇️ Đang tải file: ${fileToDownload}`);
              await exec(`rclone copy "r2:${r2Bucket}/database_backups/${slug}/${fileToDownload}" ./`, execOptions);
              
              if (!fs.existsSync(localFileName)) throw new Error("❌ Không tải được file.");
              await exec(`gunzip -f "${localFileName}"`, execOptions);
              const sqlFile = localFileName.replace('.gz', '');

              console.log(`🔥 ĐANG PHỤC HỒI DỮ LIỆU... (Chế độ Nguyên tử - An Toàn Tuyệt Đối)`);
              
              try {
                // Sử dụng পোর্ট 5432 (Direct) hoặc Session Mode, chạy trong 1 Transaction duy nhất
                const { stderr: psqlErr } = await exec(`/usr/lib/postgresql/17/bin/psql "${dbUrl}" -v ON_ERROR_STOP=1 --single-transaction -f "${sqlFile}"`, execOptions);
                
                if (psqlErr) {
                  const errorLines = psqlErr.split('\n').filter(line => line.includes('ERROR:') || line.includes('FATAL:'));
                  if (errorLines.length > 0) throw new Error(errorLines.join('\n'));
                }
                console.log("🎉 PHỤC HỒI THÀNH CÔNG 100%! HỆ THỐNG ĐÃ SẴN SÀNG VẬN HÀNH.");
              } catch (dbErr) {
                let errorDetails = dbErr.message;
                if (dbErr.stderr) {
                  const realErrors = dbErr.stderr.split('\n').filter(line =>
                    line.includes('ERROR:') || line.includes('FATAL:') || line.includes('DETAIL:') || line.includes('CONTEXT:')
                  );
                  if (realErrors.length > 0) errorDetails = realErrors.join('\n');
                }
                throw new Error(`\n❌ CẢNH BÁO: DỮ LIỆU ĐÃ BỊ TỪ CHỐI PHỤC HỒI ĐỂ BẢO VỆ AN TOÀN.\nCSDL CŨ ĐƯỢC GIỮ NGUYÊN VẸN 100% DO ĐÃ ROLLBACK.\nLỗi PostgreSQL:\n${errorDetails}`);
              } finally {
                if (fs.existsSync(sqlFile)) fs.unlinkSync(sqlFile);
              }
            } catch (err) {
              console.error(err.message);
              process.exit(1);
            }
          }
          main();
          EOF
          node restore_script.js

      - name: Xóa cấu hình Rclone
        run: rm -f ~/.config/rclone/rclone.conf
