name: Phục hồi CSDL Supabase

on:
  workflow_dispatch:
    inputs:
      truong_slug:
        description: 'Mã trường (slug) - VD: truong_a'
        required: true
        type: string
      backup_filename:
        description: 'Tên file sao lưu - VD: truong_a_01-00-00_16-08-2026.sql.gz'
        required: true
        type: string

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install PostgreSQL client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Lấy kết nối từ D1 và Thực thi Phục hồi
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DB_ID: ${{ secrets.CF_D1_DB_ID }}
          TRUONG_SLUG: ${{ github.event.inputs.truong_slug }}
          BACKUP_FILE: ${{ github.event.inputs.backup_filename }}
        run: |
          cat << 'EOF' > restore_script.js
          const fs = require('fs');
          const { execSync } = require('child_process');

          const cfAccountId = process.env.CF_ACCOUNT_ID;
          const cfApiToken = process.env.CF_API_TOKEN;
          const cfDbId = process.env.CF_D1_DB_ID;
          
          // Lấy thông tin người dùng nhập vào
          const truongSlug = process.env.TRUONG_SLUG;
          const backupFilename = process.env.BACKUP_FILE;

          if (!cfAccountId || !cfApiToken || !cfDbId) {
            console.error('LỖI: Thiếu biến môi trường Cloudflare Secrets.');
            process.exit(1);
          }

          // Cấu trúc đường dẫn chính xác vào thư mục của trường
          const filePath = `backups/${truongSlug}/${backupFilename}`;

          // Kiểm tra xem file có thực sự tồn tại trong Repo không
          if (!fs.existsSync(filePath)) {
            console.error(`LỖI: Không tìm thấy file tại đường dẫn: ${filePath}`);
            console.error(`Hãy kiểm tra lại tên trường và tên file đã nhập đúng chưa.`);
            process.exit(1);
          }

          async function main() {
            try {
              console.log(`--- Bước 1: Tìm chuỗi kết nối cho trường "${truongSlug}" ---`);
              const d1ApiUrl = `https://api.cloudflare.com/client/v4/accounts/${cfAccountId}/d1/database/${cfDbId}/query`;
              
              // Truy vấn chỉ lấy đúng dữ liệu của trường đang cần phục hồi
              const query = `SELECT supabase_sql FROM danh_sach_truong WHERE slug = '${truongSlug}' LIMIT 1`;

              const d1Response = await fetch(d1ApiUrl, {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${cfApiToken}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({ sql: query })
              });

              const d1Data = await d1Response.json();
              if (!d1Data.success) {
                throw new Error('Lỗi truy vấn D1: ' + JSON.stringify(d1Data.errors));
              }

              const results = d1Data.result[0].results;
              if (!results || results.length === 0) {
                console.error(`LỖI: Không tìm thấy mã trường "${truongSlug}" trong cơ sở dữ liệu D1 Cloudflare.`);
                process.exit(1);
              }

              const dbUrl = results[0].supabase_sql;
              if (!dbUrl) {
                console.error(`LỖI: Trường "${truongSlug}" bị trống cột chuỗi kết nối (supabase_sql).`);
                process.exit(1);
              }

              console.log(`✅ Lấy kết nối thành công. Đang tiến hành nạp dữ liệu...`);
              
              // Tiến hành giải nén
              console.log(`[1/2] Đang giải nén file ${backupFilename}...`);
              execSync(`gunzip -c "${filePath}" > temp_restore.sql`);

              // Đẩy dữ liệu vào CSDL
              console.log(`[2/2] Đang kết nối vào Supabase và phục hồi dữ liệu...`);
              
              // Tham số stdio: 'inherit' giúp hiển thị log quá trình nạp SQL lên màn hình GitHub Actions
              execSync(`psql "${dbUrl}" < temp_restore.sql`, { stdio: 'inherit' });

              // Dọn rác sau khi xong
              fs.unlinkSync('temp_restore.sql');

              console.log('\n✅ PHỤC HỒI HOÀN TẤT THÀNH CÔNG!');

            } catch (err) {
              console.error('\n❌ LỖI HỆ THỐNG:', err.message);
              // Đảm bảo file rác tạm luôn được xóa kể cả khi bị lỗi
              if (fs.existsSync('temp_restore.sql')) {
                fs.unlinkSync('temp_restore.sql');
              }
              process.exit(1);
            }
          }

          main();
          EOF
          node restore_script.js
