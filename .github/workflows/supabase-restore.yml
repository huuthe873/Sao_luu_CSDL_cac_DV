name: Phục hồi CSDL Supabase

on:
  workflow_dispatch:
    inputs:
      truong_slug:
        description: 'Slug của trường cần phục hồi (Ví dụ: truong-thpt-a)'
        required: true
        type: string
      backup_file:
        description: 'Tên file .sql.gz trên R2 (hoặc để "latest" để tự động lấy file mới nhất)'
        required: true
        default: 'latest'
        type: string

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install PostgreSQL client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Cấu hình Cloudflare R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          cat << EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          region = auto
          endpoint = https://$CF_ACCOUNT_ID.r2.cloudflarestorage.com
          EOF

      - name: Lấy chuỗi kết nối và Phục hồi CSDL
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DB_ID: ${{ secrets.CF_D1_DB_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          INPUT_SLUG: ${{ github.event.inputs.truong_slug }}
          INPUT_FILE: ${{ github.event.inputs.backup_file }}
        run: |
          cat << 'EOF' > restore_script.js
          const fs = require('fs');
          const util = require('util');
          const exec = util.promisify(require('child_process').exec);

          const cfAccountId = process.env.CF_ACCOUNT_ID;
          const cfApiToken = process.env.CF_API_TOKEN;
          const cfDbId = process.env.CF_D1_DB_ID;
          const r2Bucket = process.env.R2_BUCKET_NAME;
          
          // Làm sạch input để chống lỗi
          const slug = process.env.INPUT_SLUG.replace(/[^a-zA-Z0-9_-]/g, '');
          const fileReq = process.env.INPUT_FILE.trim();

          async function main() {
            try {
              console.log(`--- Đang truy vấn D1 tìm CSDL của trường: ${slug} ---`);
              
              const d1ApiUrl = `https://api.cloudflare.com/client/v4/accounts/${cfAccountId}/d1/database/${cfDbId}/query`;
              const query = "SELECT supabase_sql FROM danh_sach_truong WHERE slug = ?";
              
              const d1Response = await fetch(d1ApiUrl, {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${cfApiToken}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({ sql: query, params: [slug] })
              });

              const d1Data = await d1Response.json();
              const results = d1Data.result?.[0]?.results;

              if (!results || results.length === 0) {
                throw new Error(`❌ Không tìm thấy trường có slug "${slug}" trong CSDL D1.`);
              }
              const dbUrl = results[0].supabase_sql;
              if (!dbUrl) throw new Error("❌ Bảng D1 không chứa chuỗi kết nối supabase_sql hợp lệ.");
              
              console.log("✅ Đã lấy được chuỗi kết nối CSDL!");

              let fileToDownload = fileReq;

              // 1. Nếu yêu cầu "latest", dùng rclone quét thư mục của trường để lấy file mới nhất
              if (fileReq.toLowerCase() === 'latest') {
                console.log(`🔍 Đang tìm file sao lưu mới nhất trên R2 cho thư mục ${slug}...`);
                const { stdout } = await exec(`rclone lsjson r2:${r2Bucket}/database_backups/${slug}/`);
                const files = JSON.parse(stdout);
                
                const sqlFiles = files.filter(f => f.Path.endsWith('.sql.gz'));
                if (sqlFiles.length === 0) {
                  throw new Error(`❌ Không có file backup nào (.sql.gz) trong thư mục của trường ${slug}.`);
                }
                
                // Sắp xếp theo thời gian mới nhất (ModTime)
                sqlFiles.sort((a, b) => new Date(b.ModTime) - new Date(a.ModTime));
                fileToDownload = sqlFiles[0].Path;
                console.log(`✅ File mới nhất tìm thấy: ${fileToDownload}`);
              }

              // Lấy tên file thực tế khi lưu xuống local
              const localFileName = fileToDownload.split('/').pop();

              // 2. Tải file từ Cloudflare R2 về
              console.log(`⬇️ Đang tải file ${fileToDownload} từ R2...`);
              await exec(`rclone copy "r2:${r2Bucket}/database_backups/${slug}/${fileToDownload}" ./`);
              
              if (!fs.existsSync(localFileName)) {
                throw new Error("❌ Không tải được file từ R2. Vui lòng kiểm tra lại tên file.");
              }

              // 3. Giải nén file
              console.log(`📦 Đang giải nén file...`);
              await exec(`gunzip -f "${localFileName}"`);
              const sqlFile = localFileName.replace('.gz', '');

              // 4. Phục hồi dữ liệu
              console.log(`🔥 ĐANG BẮT ĐẦU PHỤC HỒI DỮ LIỆU... (Có thể mất vài phút)`);
              const { stdout: psqlOut, stderr: psqlErr } = await exec(`psql "${dbUrl}" -f "${sqlFile}"`);
              
              if (psqlErr && !psqlErr.includes('NOTICE')) {
                 console.log("⚠️ Cảnh báo từ psql:", psqlErr);
              }

              console.log("🎉 PHỤC HỒI THÀNH CÔNG 100%!");
              
              // Dọn dẹp file thừa
              if (fs.existsSync(sqlFile)) fs.unlinkSync(sqlFile);

            } catch (err) {
              console.error(err.message);
              process.exit(1);
            }
          }
          main();
          EOF
          node restore_script.js
