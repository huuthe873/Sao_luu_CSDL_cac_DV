name: khoi_phuc_v20_audit_hardened

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: 'Suffix/slug cua truong can phuc hoi (D1 slug va thu muc backup mac dinh)'
        required: true
        type: string
      backup_file:
        description: 'Ten backup .tar.gz; de trong = tu dong chon backup hoan chinh moi nhat'
        required: false
        default: ''
        type: string

      action:
        description: 'validate = kiem tra khong sua DB; restore = ghi de du lieu dich'
        required: true
        type: choice
        options: [validate, restore]
        default: validate
      confirm_target:
        description: 'Token suffix:fingerprint tu lan validate da kiem tra dung DB dich'
        required: false
        type: string
      maintenance_confirmed:
        description: 'Da dung ghi du lieu, Auth workers, migrations va cac workflow khac'
        type: boolean
        default: false
      safety_backup_confirmed:
        description: 'Da co safety backup rieng cua DB dich va da xac minh'
        type: boolean
        default: false
      allow_setval:
        description: 'Chap nhan setval khong rollback; chi bat trong maintenance da kiem tra'
        type: boolean
        default: false
      accept_schema_drift:
        description: 'Da xem khac biet schema; chap nhan DATA-ONLY giu schema dich'
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: supabase-db-maintenance-${{ github.repository }}
  cancel-in-progress: false

env:
  BACKUP_FORMAT: supabase-cli-r2-v1
  BACKUP_PREFIX: database_backups
  SUPABASE_CLI_VERSION: '2.117.0'

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Install PostgreSQL client and rclone
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates

          # Install PostgreSQL client 17 to match the Supabase Postgres 17 dump environment.
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          sudo sh -c "printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main' > /etc/apt/sources.list.d/pgdg.list"
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          # Avoid a pipe here. With set -o pipefail, 'rclone version | head -n 1' can exit 141 (SIGPIPE)
          # after head exits early even though rclone itself installed correctly.
          curl -fsSL https://rclone.org/install.sh -o /tmp/install-rclone.sh
          sudo bash /tmp/install-rclone.sh
          rm -f /tmp/install-rclone.sh

          supabase --version
          psql --version
          rclone version

      - name: Configure Cloudflare R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${CF_ACCOUNT_ID:?Missing CF_ACCOUNT_ID}"
          : "${R2_ACCESS_KEY_ID:?Missing R2_ACCESS_KEY_ID}"
          : "${R2_SECRET_ACCESS_KEY:?Missing R2_SECRET_ACCESS_KEY}"
          mkdir -p ~/.config/rclone
          chmod 700 ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF_RCLONE
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          region = auto
          endpoint = https://$CF_ACCOUNT_ID.r2.cloudflarestorage.com
          no_check_bucket = true
          EOF_RCLONE
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Restore selected suffix
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DB_ID: ${{ secrets.CF_D1_DB_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_CONFIRM_TARGET: ${{ inputs.confirm_target }}
          INPUT_MAINTENANCE_CONFIRMED: ${{ inputs.maintenance_confirmed }}
          INPUT_SAFETY_BACKUP_CONFIRMED: ${{ inputs.safety_backup_confirmed }}
          INPUT_ALLOW_SETVAL: ${{ inputs.allow_setval }}
          INPUT_ACCEPT_SCHEMA_DRIFT: ${{ inputs.accept_schema_drift }}
          INPUT_SUFFIX: ${{ github.event.inputs.suffix }}
          INPUT_BACKUP_FILE: ${{ github.event.inputs.backup_file }}
        run: |
          set -euo pipefail
          cat > restore_direct_v20.js <<'NODE'
          process.umask(0o077);
          
          function parseQualifiedName(raw) {
            const token = '("(?:[^"\\r\\n]|"")+"|[A-Za-z_\\u0080-\\uffff][A-Za-z0-9_$\\u0080-\\uffff]*)';
            const m = String(raw).trim().match(new RegExp(`^${token}\\s*\\.\\s*${token}$`));
            if (!m) throw new Error(`Unsupported qualified SQL identifier: ${raw}`);
            const parts = [m[1], m[2]].map(s => s.startsWith('"') ? s.slice(1, -1).replace(/""/g, '"') : s.toLowerCase());
            // The v1 manifest uses schema.table keys. Embedded dots cannot be represented
            // unambiguously. Reject instead of silently restoring/counting the wrong relation.
            if (parts.some(s => !s || /[.\x00-\x1f\x7f]/.test(s))) throw new Error(`Identifier cannot be represented safely in backup format v1: ${raw}`);
            return parts;
          }
          
          function splitSqlIdentifierList(text) {
            const out = []; let cur = '', quoted = false;
            for (let i = 0; i < text.length; i++) {
              const ch = text[i];
              if (ch === '"') {
                cur += ch;
                if (quoted && text[i + 1] === '"') { cur += '"'; i++; continue; }
                quoted = !quoted; continue;
              }
              if (ch === ',' && !quoted) { out.push(cur.trim()); cur = ''; continue; }
              cur += ch;
            }
            if (cur.trim()) out.push(cur.trim());
            if (quoted) throw new Error('Unterminated quoted column identifier.');
            return out;
          }
          
          function unquoteIdentifier(raw) {
            const v = String(raw).trim();
            if (/^"(?:[^"]|"")+"$/.test(v)) return v.slice(1, -1).replace(/""/g, '"');
            if (!/^[A-Za-z_\u0080-\uffff][A-Za-z0-9_$\u0080-\uffff]*$/.test(v)) throw new Error(`Unsupported column identifier: ${v}`);
            return v.toLowerCase();
          }
          
          function parseCopyHeader(line) {
            const withColumns = line.match(/^COPY\s+(.+?)\s+\((.*)\)\s+FROM stdin;$/);
            const bare = withColumns ? null : line.match(/^COPY\s+(.+?)\s+FROM stdin;$/);
            const m = withColumns || bare;
            if (!m) return null;
            const [schema, table] = parseQualifiedName(m[1]);
            const columns = withColumns ? splitSqlIdentifierList(m[2]).map(unquoteIdentifier) : null;
            if (columns && new Set(columns).size !== columns.length) throw new Error(`Duplicate COPY column in ${schema}.${table}`);
            return { key: `${schema}.${table}`, columns };
          }
          
          async function* dumpLines(file) {
            // Native stream async iteration propagates read errors (unlike relying only on
            // readline's input stream). Memory is bounded by chunk size + longest dump row.
            let pending = '';
            for await (const chunk of fs.createReadStream(file, { encoding: 'utf8', highWaterMark: 1024 * 1024 })) {
              pending += chunk;
              let start = 0, pos;
              while ((pos = pending.indexOf('\n', start)) >= 0) {
                const line = pending.slice(start, pos);
                yield line.endsWith('\r') ? line.slice(0, -1) : line;
                start = pos + 1;
              }
              pending = pending.slice(start);
            }
            if (pending) yield pending.endsWith('\r') ? pending.slice(0, -1) : pending;
          }
          
          async function scanCopyFile(file, outputFile = null) {
            const counts = Object.create(null), layouts = new Map(), sequences = new Map();
            const seen = new Set(); let current = null, count = 0, removed = 0;
            const output = outputFile ? fs.createWriteStream(outputFile, { encoding: 'utf8', flags: 'w', mode: 0o600 }) : null;
            const finished = output ? require('stream/promises').finished(output) : null;
            if (finished) finished.catch(() => {});
            try {
              for await (const line of dumpLines(file)) {
                let outLine = line;
                if (current !== null) {
                  if (line === '\\.') { counts[current] = count; current = null; count = 0; }
                  else {
                    count++;
                    if (!Number.isSafeInteger(count)) throw new Error('COPY row count exceeds safe integer range.');
                  }
                } else {
                  const header = parseCopyHeader(line);
                  if (header) {
                    if (seen.has(header.key)) throw new Error(`Duplicate COPY block: ${header.key}`);
                    seen.add(header.key); current = header.key; count = 0;
                    if (header.columns === null) throw new Error(`COPY without an explicit column list is unsupported: ${header.key}`);
                    layouts.set(header.key, header.columns);
                  } else if (/^\s*SELECT\s+pg_catalog\.setval\s*\(/i.test(line)) {
                    const m = line.match(/^\s*SELECT\s+pg_catalog\.setval\('((?:[^']|'')+)',\s*(-?\d+),\s*(true|false)\);\s*$/i);
                    if (!m) throw new Error('Unsupported pg_dump setval statement; refusing to rewrite it.');
                    const qualified = m[1].replace(/''/g, "'");
                    const key = parseQualifiedName(qualified).join('.');
                    const last = BigInt(m[2]);
                    if (last < -(1n << 63n) || last > (1n << 63n) - 1n) throw new Error(`Out-of-range sequence state: ${key}`);
                    if (sequences.has(key)) throw new Error(`Duplicate sequence state: ${key}`);
                    sequences.set(key, { key, last: last.toString(), called: m[3].toLowerCase() === 'true' });
                    if (output) { removed++; outLine = '-- Source setval omitted; guarded sequence repair runs before COMMIT.'; }
                  }
                }
                if (output && !output.write(outLine + '\n')) await require('events').once(output, 'drain');
              }
              if (current !== null) throw new Error(`Dump ended inside COPY block: ${current}`);
              if (output) { output.end(); await finished; }
              return { counts: Object.fromEntries(Object.entries(counts).sort(([a],[b]) => a.localeCompare(b))), layouts, sequences, removed };
            } catch (e) {
              if (output) { output.destroy(); fs.rmSync(outputFile, { force: true }); }
              throw e;
            }
          }
          
          async function parseCopyCounts(file) { return (await scanCopyFile(file)).counts; }
          async function parseCopyLayouts(file) { return (await scanCopyFile(file)).layouts; }
          async function parseCopyTableNames(file) { return [...(await parseCopyLayouts(file)).keys()].sort(); }
          async function makeInPlaceDataFile(inputFile, outputFile) { return (await scanCopyFile(inputFile, outputFile)).removed; }
          
          function dumpSemanticFingerprint(file) {
            // Remove ONLY matching pg_dump guard commands at file boundaries. Never remove
            // guard-looking lines inside function bodies, string literals, or COPY payloads.
            const lines = fs.readFileSync(file, 'utf8').split('\n');
            const ignorable = s => /^\s*(?:--.*)?$/.test(s);
            let first = 0, last = lines.length - 1;
            while (first < lines.length && ignorable(lines[first])) first++;
            while (last >= 0 && ignorable(lines[last])) last--;
            const m = (lines[first] || '').match(/^\\restrict ([A-Za-z0-9]+)\r?$/);
            if (m && lines[last] && lines[last].replace(/\r$/, '') === `\\unrestrict ${m[1]}` && first < last) {
              lines.splice(last, 1); lines.splice(first, 1);
            }
            return crypto.createHash('sha256').update(lines.join('\n'), 'utf8').digest('hex');
          }
          
          function safeError(err) {
            const text = String(err && (err.stderr || err.message || err) || 'Unknown error');
            return text.replace(/postgres(?:ql)?:\/\/[^\s"']+/gi, '[DATABASE_URL_REDACTED]')
              .split(/\r?\n/).map(line => {
                if (/^\s*(?:DETAIL|CONTEXT|STATEMENT|QUERY):/i.test(line)) return '[ROW/SQL CONTEXT REDACTED]';
                return line.replace(/(invalid input syntax[^:]*:)\s*.*/i, '$1 [VALUE REDACTED]');
              }).join('\n').slice(-16000);
          }
          
          function positiveInteger(raw, name, max = 100000) {
            if (!/^\d+$/.test(String(raw))) throw new Error(`${name} must be a positive integer.`);
            const n = Number(raw);
            if (!Number.isSafeInteger(n) || n < 1 || n > max) throw new Error(`${name} must be in 1..${max}.`);
            return n;
          }
          
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const readline = require('readline');
          const { once } = require('events');
          const { spawn } = require('child_process');
          
          const cfAccountId = process.env.CF_ACCOUNT_ID || '';
          const cfApiToken = process.env.CF_API_TOKEN || '';
          const cfDbId = process.env.CF_D1_DB_ID || '';
          const bucket = process.env.R2_BUCKET_NAME || '';
          const prefix = process.env.BACKUP_PREFIX || 'database_backups';
          const expectedFormat = process.env.BACKUP_FORMAT || 'supabase-cli-r2-v1';
          const suffix = (process.env.INPUT_SUFFIX || '').trim();
          const requestedFile = (process.env.INPUT_BACKUP_FILE || '').trim();
          const restoreGuardSchema = '_supabase_backup_restore_internal';
          const restoreGuardComment = 'Internal commit marker for automated Supabase backup/restore workflow';
          const restoreRunId = `${process.env.GITHUB_RUN_ID || 'local'}-${process.env.GITHUB_RUN_ATTEMPT || '0'}-${crypto.randomBytes(12).toString('hex')}-${suffix}`;
          const action = process.env.INPUT_ACTION || 'validate';
          const allowSetval = process.env.INPUT_ALLOW_SETVAL === 'true';
          const acceptSchemaDrift = process.env.INPUT_ACCEPT_SCHEMA_DRIFT === 'true';
          let restoreCommitted = false;
          if (!['validate','restore'].includes(action)) throw new Error('Unsupported restore action.');
          
          if (!cfAccountId || !cfApiToken || !cfDbId) throw new Error('Missing Cloudflare D1 secrets.');
          if (!bucket) throw new Error('Missing R2_BUCKET_NAME.');
          if (!/^[a-z0-9][a-z0-9.-]*$/.test(bucket) || !prefix.split('/').every(x=>/^[A-Za-z0-9_-]+$/.test(x))) throw new Error('Unsafe R2 bucket/prefix.');
          
          if (!/^[A-Za-z0-9_-]+$/.test(suffix)) throw new Error('suffix is invalid.');
          
          const managedSchemas = new Set([
            'auth', 'storage', 'realtime', 'graphql', 'graphql_public',
            'extensions', 'pgbouncer', 'pgsodium', 'pgsodium_masks',
            'vault', 'cron', 'supabase_functions', 'supabase_migrations',
            'net', '_realtime', '_analytics', restoreGuardSchema
          ]);
          
          
          
          function run(command, args, options = {}) {
            return new Promise((resolve, reject) => {
              const launchArgs = command === 'psql' ? ['--set','VERBOSITY=terse','--set','SHOW_CONTEXT=never',...args] : args;
              const child = spawn(command, launchArgs, {
                cwd: options.cwd,
                env: options.env || process.env,
                stdio: ['ignore', 'pipe', 'pipe']
              });
              let stdout = '', stderr = '';
              child.stdout.on('data', d => {
                const s = d.toString(); stdout += s;
                if (options.echoStdout) process.stdout.write(s);
                if (stdout.length > 16 * 1024 * 1024) stdout = stdout.slice(-16 * 1024 * 1024);
              });
              child.stderr.on('data', d => {
                const s = d.toString(); stderr += s;
                if (stderr.length > 16 * 1024 * 1024) stderr = stderr.slice(-16 * 1024 * 1024);
              });
              child.on('error', reject);
              child.on('close', (code, signal) => {
                if (stderr && options.echoStderr !== false) console.error(safeError({ stderr }));
                if (code === 0) return resolve({ stdout, stderr });
                const e = new Error(`${command} exited with code ${code}`);
                e.code = code; e.signal = signal; e.stdout = stdout; e.stderr = stderr;
                reject(e);
              });
            });
          }
          
          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
          
          let maintenanceRouteLogged = false;
          
          function maintenanceDbUrl(dbUrl) {
            const u = new URL(dbUrl);
            if (!['postgres:', 'postgresql:'].includes(u.protocol)) throw new Error('Invalid PostgreSQL URL protocol.');
          
            // Supabase shared pooler: 6543 = transaction mode, 5432 = session mode.
            // Long-running maintenance/restore work must not use transaction mode.
            if (u.hostname.endsWith('.pooler.supabase.com') && u.port === '6543') {
              u.port = '5432';
              if (!maintenanceRouteLogged) {
                console.log('MAINTENANCE CONNECTION: detected Supabase shared transaction pooler :6543; automatically switching restore/dump traffic to session pooler :5432 on the same host.');
                maintenanceRouteLogged = true;
              }
            }
            if (!u.searchParams.has('sslmode')) u.searchParams.set('sslmode', 'require');
            if (!u.searchParams.has('connect_timeout')) u.searchParams.set('connect_timeout', '30');
            if (!u.searchParams.has('keepalives')) u.searchParams.set('keepalives', '1');
            if (!u.searchParams.has('keepalives_idle')) u.searchParams.set('keepalives_idle', '30');
            if (!u.searchParams.has('keepalives_interval')) u.searchParams.set('keepalives_interval', '10');
            if (!u.searchParams.has('keepalives_count')) u.searchParams.set('keepalives_count', '5');
            return u.toString();
          }
          
          function isTransientPgConnectionError(text) {
            return /(SSL error:\s*unexpected eof|server closed the connection unexpectedly|connection reset by peer|broken pipe|connection timed out|timeout expired|could not receive data from server|could not send data to server|terminating connection due to administrator command|the database system is starting up|cannot connect now|network is unreachable|no route to host|temporary failure in name resolution|i\/o timeout|TLS handshake timeout)/i.test(String(text || ''));
          }
          
          async function d1Query(sql, params = []) {
            const url = `https://api.cloudflare.com/client/v4/accounts/${cfAccountId}/d1/database/${cfDbId}/query`;
            const resp = await fetch(url, {
              method: 'POST',
              signal: AbortSignal.timeout(30000),
              headers: { Authorization: `Bearer ${cfApiToken}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ sql, params })
            });
            const body = await resp.json().catch(() => ({}));
            if (!resp.ok || body.success === false) throw new Error(`D1 query failed: HTTP ${resp.status}; ${JSON.stringify(body.errors || body)}`);
            const block = body.result?.[0];
            if (!block || block.success === false) throw new Error(`D1 query result failed: ${JSON.stringify(block || body)}`);
            return block.results || [];
          }
          
          async function loadTarget() {
            const rows = await d1Query('SELECT slug, supabase_sql FROM danh_sach_truong WHERE slug = ? LIMIT 2', [suffix]);
            if (rows.length !== 1) throw new Error(`D1 must contain exactly one row for suffix [${suffix}]; got ${rows.length}.`);
            const dbUrl = String(rows[0].supabase_sql || '').trim();
            if (!dbUrl) throw new Error(`D1 row [${suffix}] has empty supabase_sql.`);
            return { slug: suffix, dbUrl };
          }
          
          const pgServiceFiles = new Map();
          let pgServiceDirectory;
          function pgEnvFromUrl(dbUrl) {
            const u = new URL(maintenanceDbUrl(dbUrl));
            const cfg = {
              host:u.hostname,port:u.port || '5432',user:decodeURIComponent(u.username),
              dbname:decodeURIComponent(u.pathname.replace(/^\//,'')) || 'postgres',
              sslmode:u.searchParams.get('sslmode') || 'require',connect_timeout:'30',
              keepalives:'1',keepalives_idle:'30',keepalives_interval:'10',keepalives_count:'5'
            };
            if (Object.values(cfg).some(v=>/[\r\n\x00]/.test(v))) throw new Error('Invalid newline/NUL in libpq connection settings.');
            const id = crypto.createHash('sha256').update(JSON.stringify(cfg)).digest('hex');
            if (!pgServiceFiles.has(id)) {
              if (!pgServiceDirectory) {
                pgServiceDirectory=fs.mkdtempSync(path.join(require('os').tmpdir(),'supabase-pg-service-'));
                process.once('exit',()=>fs.rmSync(pgServiceDirectory,{recursive:true,force:true}));
              }
              const file=path.join(pgServiceDirectory,id+'.conf');
              fs.writeFileSync(file,'[maintenance]\n'+Object.entries(cfg).map(([k,v])=>`${k}=${v}`).join('\n')+'\n',{mode:0o600});
              pgServiceFiles.set(id,file);
            }
            const env={...process.env};
            for(const key of Object.keys(env)) if(key.startsWith('PG')) delete env[key];
            return {...env,PGSERVICEFILE:pgServiceFiles.get(id),PGSERVICE:'maintenance',
              PGPASSWORD:decodeURIComponent(u.password),PGAPPNAME:'supabase-audit-maintenance',PGCLIENTENCODING:'UTF8'};
          }
          
          
          async function psql(dbUrl, sql, fieldSep = '\t') {
            let lastErr;
            for (let attempt = 1; attempt <= 4; attempt++) {
              try {
                const { stdout } = await run('psql', ['-X', '-v', 'ON_ERROR_STOP=1', '-A', '-t', '-F', fieldSep, '-c', sql], {
                  env: pgEnvFromUrl(dbUrl), echoStderr: false
                });
                return stdout.trim();
              } catch (err) {
                lastErr = err;
                const msg = safeError(err);
                if (!isTransientPgConnectionError(msg) || attempt === 4) throw err;
                const wait = [2, 5, 10][attempt - 1] || 10;
                console.warn(`Transient PostgreSQL connection error during maintenance query (attempt ${attempt}/4). Retrying in ${wait}s: ${msg.split('\n')[0]}`);
                await sleep(wait * 1000);
              }
            }
            throw lastErr;
          }
          
          function sqlLiteral(value) { return "'" + String(value).replace(/'/g, "''") + "'"; }
          
          async function inspectRestoreGuard(dbUrl) {
            const out = await psql(dbUrl, `
              SELECT CASE
                WHEN to_regnamespace(${sqlLiteral(restoreGuardSchema)}) IS NULL THEN 'absent'
                WHEN COALESCE(obj_description(to_regnamespace(${sqlLiteral(restoreGuardSchema)}), 'pg_namespace'), '') = ${sqlLiteral(restoreGuardComment)} THEN 'owned'
                ELSE 'conflict'
              END;`);
            return out.trim();
          }
          
          async function cleanupOwnedRestoreGuard(dbUrl) {
            const state = await inspectRestoreGuard(dbUrl);
            if (state === 'absent') return;
            if (state !== 'owned') {
              throw new Error(`Reserved internal schema ${restoreGuardSchema} already exists but is not owned by this workflow. Refusing to modify it.`);
            }
            await psql(dbUrl, `DROP SCHEMA IF EXISTS "${restoreGuardSchema}" CASCADE;`);
            console.log(`Removed stale internal restore marker schema [${restoreGuardSchema}].`);
          }
          
          function makeCommitMarkerSql(file, backupName, sourceSlug) {
            const lines = [
              '-- Durable commit marker. It is created inside the SAME transaction and therefore',
              '-- proves COMMIT outcome after a network disconnect. It is removed after final verification.',
              `DO $guard$ BEGIN IF to_regnamespace(${sqlLiteral(restoreGuardSchema)}) IS NOT NULL AND COALESCE(obj_description(to_regnamespace(${sqlLiteral(restoreGuardSchema)}), 'pg_namespace'), '') <> ${sqlLiteral(restoreGuardComment)} THEN RAISE EXCEPTION 'Reserved restore guard schema exists with an unexpected owner/comment'; END IF; END $guard$;`,
              `CREATE SCHEMA IF NOT EXISTS "${restoreGuardSchema}";`,
              `COMMENT ON SCHEMA "${restoreGuardSchema}" IS ${sqlLiteral(restoreGuardComment)};`,
              `CREATE TABLE IF NOT EXISTS "${restoreGuardSchema}".commits (restore_id text PRIMARY KEY, backup_name text NOT NULL, source_slug text, target_slug text NOT NULL, committed_at timestamptz NOT NULL DEFAULT clock_timestamp());`,
              `INSERT INTO "${restoreGuardSchema}".commits(restore_id, backup_name, source_slug, target_slug) VALUES (${sqlLiteral(restoreRunId)}, ${sqlLiteral(backupName)}, ${sqlLiteral(sourceSlug || '')}, ${sqlLiteral(suffix)}) ON CONFLICT (restore_id) DO UPDATE SET backup_name = EXCLUDED.backup_name, source_slug = EXCLUDED.source_slug, target_slug = EXCLUDED.target_slug, committed_at = clock_timestamp();`
            ];
            fs.writeFileSync(file, lines.join('\n') + '\n');
          }
          
          async function commitMarkerExists(dbUrl, backupName) {
            const state = await inspectRestoreGuard(dbUrl);
            if (state === 'absent') return false;
            if (state !== 'owned') throw new Error(`Restore commit marker schema conflict detected after transaction.`);
            const out = await psql(dbUrl, `
              SELECT CASE WHEN EXISTS (
                SELECT 1 FROM "${restoreGuardSchema}".commits
