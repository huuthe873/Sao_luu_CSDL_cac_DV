name: Phục hồi CSDL Supabase - bản ổn định 3

on:
  workflow_dispatch:
    inputs:
      truong_slug:
        description: 'Slug chính xác của trường cần phục hồi (ví dụ: truong-thpt-a)'
        required: true
        type: string
      backup_file:
        description: 'Nhập latest, file .sql.gz, file .sql.gz.sha256, hoặc dán đường dẫn đầy đủ; workflow sẽ tự chuẩn hóa an toàn'
        required: true
        default: 'latest'
        type: string

# Dùng chung group với workflow backup để tránh backup/restore chạy chồng lấn.
concurrency:
  group: supabase-database-maintenance
  cancel-in-progress: false

permissions:
  contents: read

env:
  TZ: Asia/Ho_Chi_Minh

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install PostgreSQL client 17
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/psql --version

      - name: Install rclone
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Cấu hình Cloudflare R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT_ID"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          test -n "$R2_BUCKET_NAME"
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          region = auto
          endpoint = https://$CF_ACCOUNT_ID.r2.cloudflarestorage.com
          no_check_bucket = true
          EOF
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Lấy chuỗi kết nối, kiểm tra backup và phục hồi CSDL
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DB_ID: ${{ secrets.CF_D1_DB_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          INPUT_SLUG: ${{ github.event.inputs.truong_slug }}
          INPUT_FILE: ${{ github.event.inputs.backup_file }}
        run: |
          set -euo pipefail
          cat << 'NODE' > restore_script.js
          'use strict';

          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const { spawn } = require('child_process');
          const { pipeline } = require('stream/promises');
          const { createGunzip } = require('zlib');

          const PSQL = '/usr/lib/postgresql/17/bin/psql';
          const SUPPORTED_BACKUP_VERSIONS = new Set(['4']);

          const cfAccountId = (process.env.CF_ACCOUNT_ID || '').trim();
          const cfApiToken = (process.env.CF_API_TOKEN || '').trim();
          const cfDbId = (process.env.CF_D1_DB_ID || '').trim();
          const r2Bucket = (process.env.R2_BUCKET_NAME || '').trim();
          const slug = (process.env.INPUT_SLUG || '').trim();
          const rawFileReq = (process.env.INPUT_FILE || '').trim();

          function safeErrorMessage(err) {
            let msg = err && err.message ? String(err.message) : String(err);
            msg = msg.replace(/postgres(?:ql)?:\/\/[^\s]+/gi, '[POSTGRES_URL_REDACTED]');
            msg = msg.replace(/password\s*=\s*[^\s]+/gi, 'password=[REDACTED]');
            return msg.split('\n').slice(0, 20).join('\n');
          }

          function validateSlug(value) {
            return /^[A-Za-z0-9_-]+$/.test(value);
          }

          function isSafeBackupBasename(value) {
            return /^[A-Za-z0-9._-]+\.sql\.gz$/i.test(value)
              && !value.includes('..')
              && !value.includes('/')
              && !value.includes('\\');
          }

          function normalizeRequestedFile(value) {
            let v = String(value || '').trim();

            // Nếu workflow được gọi qua API/CLI mà bỏ trống input, dùng mặc định an toàn là latest.
            if (!v) return 'latest';

            // Chấp nhận người dùng nhập/dán kèm một cặp dấu nháy.
            if ((v.startsWith('\"') && v.endsWith('\"')) || (v.startsWith("'") && v.endsWith("'"))) {
              v = v.slice(1, -1).trim();
            }
            if (/^latest$/i.test(v)) return 'latest';

            // Cho phép dán URL/path/object key từ R2 nhưng chỉ lấy basename; thư mục đích vẫn bị khóa theo slug.
            // Loại query/hash nếu người dùng dán URL có tham số.
            try {
              if (/^https?:\/\//i.test(v)) {
                const u = new URL(v);
                v = decodeURIComponent(u.pathname || '');
              } else {
                v = v.split(/[?#]/, 1)[0];
              }
            } catch {
              throw new Error('backup_file là URL không hợp lệ.');
            }

            v = v.replace(/\\/g, '/');
            const parts = v.split('/').filter(Boolean);
            let base = (parts.length ? parts[parts.length - 1] : v).trim();

            // R2 lưu mỗi bản backup thành một cặp:
            //   <ten>.sql.gz         = dữ liệu backup thực tế
            //   <ten>.sql.gz.sha256  = checksum SHA-256 đi kèm
            // Nếu người dùng chọn/dán nhầm file .sha256 trong giao diện R2,
            // tự chuyển về file .sql.gz tương ứng thay vì báo lỗi.
            if (/\.sql\.gz\.sha256$/i.test(base)) {
              base = base.slice(0, -'.sha256'.length);
              console.log(`ℹ️ Bạn đã chọn file checksum; tự chuyển sang backup tương ứng: ${base}`);
            }

            if (!isSafeBackupBasename(base)) {
              throw new Error('backup_file không hợp lệ. Hãy nhập latest, file .sql.gz hoặc file .sql.gz.sha256.');
            }
            return base;
          }

          function connectionForPostgres(rawUrl) {
            let u;
            try {
              u = new URL(rawUrl);
            } catch {
              throw new Error('Chuỗi kết nối Supabase không phải PostgreSQL URL hợp lệ.');
            }
            if (!['postgresql:', 'postgres:'].includes(u.protocol)) {
              throw new Error('Chuỗi kết nối Supabase phải bắt đầu bằng postgresql:// hoặc postgres://.');
            }
            const password = decodeURIComponent(u.password || '');
            if (!password) throw new Error('Chuỗi kết nối Supabase không có mật khẩu.');
            u.password = '';
            return {
              safeUrl: u.toString(),
              env: {
                ...process.env,
                PGPASSWORD: password,
                PGCONNECT_TIMEOUT: '20'
              }
            };
          }

          function run(command, args, { env = process.env, allowFailure = false } = {}) {
            return new Promise((resolve, reject) => {
              let stdout = '';
              let stderr = '';
              const child = spawn(command, args, { env, stdio: ['ignore', 'pipe', 'pipe'] });
              child.stdout.on('data', d => {
                stdout += d.toString();
                if (stdout.length > 8 * 1024 * 1024) stdout = stdout.slice(-8 * 1024 * 1024);
              });
              child.stderr.on('data', d => {
                stderr += d.toString();
                if (stderr.length > 8 * 1024 * 1024) stderr = stderr.slice(-8 * 1024 * 1024);
              });
              child.on('error', err => reject(new Error(`Không chạy được ${path.basename(command)}: ${err.message}`)));
              child.on('close', code => {
                if (code === 0 || allowFailure) return resolve({ code, stdout, stderr });
                const detail = stderr.trim().split('\n').slice(-20).join('\n');
                reject(new Error(`${path.basename(command)} thất bại (exit ${code})${detail ? `:\n${detail}` : ''}`));
              });
            });
          }

          async function sha256(filePath) {
            const hash = crypto.createHash('sha256');
            await pipeline(fs.createReadStream(filePath), hash);
            return hash.digest('hex');
          }

          async function scanSqlForForbiddenContent(filePath) {
            const forbidden = [
              '\\vert{}',
              'UPDATE storage.buckets SET owner = NULL',
              'UPDATE storage.objects SET owner = NULL'
            ];

            return new Promise((resolve, reject) => {
              const stream = fs.createReadStream(filePath, { encoding: 'utf8' });
              let carry = '';
              stream.on('data', chunk => {
                const text = carry + chunk;
                if (text.includes('\u000b')) {
                  stream.destroy(new Error('File SQL chứa ký tự vertical-tab bất thường.'));
                  return;
                }
                for (const token of forbidden) {
                  if (text.includes(token)) {
                    stream.destroy(new Error(`File SQL chứa nội dung cũ/không an toàn: ${token}`));
                    return;
                  }
                }
                carry = text.slice(-256);
              });
              stream.on('error', reject);
              stream.on('end', resolve);
            });
          }

          async function main() {
            const workDir = path.resolve('restore_work');
            fs.mkdirSync(workDir, { recursive: true });
            let localGz = null;
            let checksumLocal = null;
            let sqlFile = null;

            try {
              if (!cfAccountId || !cfApiToken || !cfDbId || !r2Bucket) {
                throw new Error('Thiếu một hoặc nhiều Secrets/biến bắt buộc: CF_ACCOUNT_ID, CF_API_TOKEN, CF_D1_DB_ID, R2_BUCKET_NAME.');
              }
              if (!slug || !validateSlug(slug)) {
                throw new Error('truong_slug không hợp lệ. Chỉ cho phép A-Z, a-z, 0-9, _ và -.');
              }
              const fileReq = normalizeRequestedFile(rawFileReq);
              if (rawFileReq && rawFileReq !== fileReq) {
                console.log(`ℹ️ backup_file đã được chuẩn hóa thành: ${fileReq}`);
              }

              console.log(`--- Truy vấn D1 cho trường [${slug}] ---`);
              const d1ApiUrl = `https://api.cloudflare.com/client/v4/accounts/${cfAccountId}/d1/database/${cfDbId}/query`;
              const response = await fetch(d1ApiUrl, {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${cfApiToken}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  sql: 'SELECT supabase_sql FROM danh_sach_truong WHERE slug = ?',
                  params: [slug]
                })
              });

              if (!response.ok) throw new Error(`Cloudflare D1 HTTP ${response.status} ${response.statusText}.`);

              let d1Data;
              try { d1Data = await response.json(); }
              catch { throw new Error('Cloudflare D1 trả về dữ liệu không phải JSON hợp lệ.'); }

              if (!d1Data.success) throw new Error(`Lỗi truy vấn D1: ${JSON.stringify(d1Data.errors || [])}`);
              const results = d1Data.result?.[0]?.results;
              if (!Array.isArray(results) || results.length !== 1) {
                throw new Error(results?.length > 1
                  ? `D1 có nhiều hơn một bản ghi cho slug "${slug}".`
                  : `Không tìm thấy trường "${slug}" trong D1.`);
              }

              const rawDbUrl = String(results[0].supabase_sql || '').trim();
              if (!rawDbUrl) throw new Error(`Trường "${slug}" thiếu supabase_sql.`);
              const conn = connectionForPostgres(rawDbUrl);

              // Kiểm tra kết nối và các bảng Auth bắt buộc trước khi động đến dữ liệu.
              const preflight = await run(PSQL, [
                `--dbname=${conn.safeUrl}`,
                '-X',
                '--no-psqlrc',
                '-v', 'ON_ERROR_STOP=1',
                '-Atqc',
                "SELECT CASE WHEN to_regclass('auth.users') IS NOT NULL AND to_regclass('auth.identities') IS NOT NULL THEN 'OK' ELSE 'MISSING' END;"
              ], { env: conn.env });
              if (preflight.stdout.trim() !== 'OK') {
                throw new Error('CSDL đích thiếu auth.users hoặc auth.identities; dừng restore.');
              }

              const remoteDir = `r2:${r2Bucket}/database_backups/${slug}/`;
              const listingResult = await run('rclone', ['lsjson', remoteDir, '--files-only']);
              let listing;
              try { listing = JSON.parse(listingResult.stdout || '[]'); }
              catch { throw new Error('Không phân tích được danh sách file trên R2.'); }

              const gzFiles = listing
                .filter(x => typeof x.Path === 'string' && x.Path.endsWith('.sql.gz'))
                .sort((a, b) => new Date(b.ModTime) - new Date(a.ModTime));

              if (gzFiles.length === 0) throw new Error(`Không có file .sql.gz trong ${remoteDir}.`);

              let selected;
              if (fileReq.toLowerCase() === 'latest') {
                selected = gzFiles[0];
              } else {
                selected = gzFiles.find(x => x.Path === fileReq);
                if (!selected) throw new Error(`Không tìm thấy file "${fileReq}" trong thư mục backup của trường "${slug}".`);
              }

              const selectedName = selected.Path;
              if (selectedName.includes('/') || selectedName.includes('\\') || !isSafeBackupBasename(selectedName)) {
                throw new Error('Tên file trên R2 không hợp lệ; dừng để tránh path traversal.');
              }

              localGz = path.join(workDir, selectedName);
              checksumLocal = `${localGz}.sha256`;
              sqlFile = localGz.slice(0, -3);

              console.log(`⬇️ Đang tải backup: ${selectedName}`);
              await run('rclone', ['copyto', `${remoteDir}${selectedName}`, localGz, '--retries', '3', '--low-level-retries', '10']);

              if (!fs.existsSync(localGz) || fs.statSync(localGz).size < 100) {
                throw new Error('File backup tải về không tồn tại hoặc quá nhỏ/bất thường.');
              }

              // Nếu có checksum sidecar (backup mới), bắt buộc xác minh. Backup legacy không có checksum vẫn được kiểm tra gzip + SQL.
              const checksumName = `${selectedName}.sha256`;
              const hasChecksum = listing.some(x => x.Path === checksumName);
              if (hasChecksum) {
                await run('rclone', ['copyto', `${remoteDir}${checksumName}`, checksumLocal, '--retries', '3', '--low-level-retries', '10']);
                const line = fs.readFileSync(checksumLocal, 'utf8').trim();
                const expected = line.split(/\s+/)[0];
                if (!/^[a-f0-9]{64}$/i.test(expected)) throw new Error('File checksum trên R2 không hợp lệ.');
                const actual = await sha256(localGz);
                if (actual.toLowerCase() !== expected.toLowerCase()) {
                  throw new Error('SHA-256 không khớp. File backup có thể bị hỏng hoặc không đầy đủ.');
                }
                console.log('✅ SHA-256 hợp lệ.');
              } else {
                console.warn('⚠️ Backup legacy không có .sha256; sẽ tiếp tục với kiểm tra gzip và kiểm tra SQL an toàn.');
              }

              // Giải nén bằng zlib; lỗi CRC/gzip sẽ dừng trước khi truy cập CSDL.
              await pipeline(
                fs.createReadStream(localGz),
                createGunzip(),
                fs.createWriteStream(sqlFile)
              );
              if (!fs.existsSync(sqlFile) || fs.statSync(sqlFile).size < 100) {
                throw new Error('File SQL sau giải nén quá nhỏ/bất thường.');
              }

              await scanSqlForForbiddenContent(sqlFile);

              const fd = fs.openSync(sqlFile, 'r');
              const buf = Buffer.alloc(64 * 1024);
              const bytes = fs.readSync(fd, buf, 0, buf.length, 0);
              fs.closeSync(fd);
              const head = buf.subarray(0, bytes).toString('utf8');

              const versionMatch = head.match(/^-- BACKUP_FORMAT_VERSION:\s*(.+)$/m);
              const slugMatch = head.match(/^-- BACKUP_SLUG:\s*(.+)$/m);

              if (versionMatch) {
                const version = versionMatch[1].trim();
                if (!SUPPORTED_BACKUP_VERSIONS.has(version)) {
                  throw new Error(`Backup format version ${version} không được workflow restore này hỗ trợ.`);
                }
                if (!slugMatch) throw new Error('Backup mới có version marker nhưng thiếu BACKUP_SLUG.');
                if (slugMatch[1].trim() !== slug) {
                  throw new Error(`BACKUP_SLUG trong file là "${slugMatch[1].trim()}", không khớp trường đích "${slug}".`);
                }
                console.log(`✅ Metadata backup hợp lệ (format ${version}, slug ${slug}).`);
              } else {
                // Chỉ cho legacy đi tiếp nếu tên file phù hợp slug; vẫn từ chối các mẫu SQL cũ không an toàn ở scanSqlForForbiddenContent().
                if (!selectedName.startsWith(`${slug}_`)) {
                  throw new Error('Backup legacy không có metadata và tên file không khớp slug trường đích.');
                }
                console.warn('⚠️ Backup legacy không có BACKUP_FORMAT_VERSION/BACKUP_SLUG; chỉ tiếp tục vì tên file khớp slug và kiểm tra an toàn đã đạt.');
              }

              console.log('🔥 Bắt đầu restore trong MỘT transaction PostgreSQL với ON_ERROR_STOP=1...');

              try {
                await run(PSQL, [
                  `--dbname=${conn.safeUrl}`,
                  '-X',
                  '--no-psqlrc',
                  '-v', 'ON_ERROR_STOP=1',
                  '--single-transaction',
                  '--file', sqlFile
                ], { env: conn.env });
              } catch (dbErr) {
                throw new Error(
                  'RESTORE THẤT BẠI. psql đã dừng khi gặp lỗi; transaction restore đã bị PostgreSQL rollback.\n' +
                  safeErrorMessage(dbErr)
                );
              }

              // Kiểm tra tối thiểu sau commit.
              const postflight = await run(PSQL, [
                `--dbname=${conn.safeUrl}`,
                '-X',
                '--no-psqlrc',
                '-v', 'ON_ERROR_STOP=1',
                '-Atqc',
                "SELECT CASE WHEN to_regclass('auth.users') IS NOT NULL AND to_regclass('auth.identities') IS NOT NULL AND to_regnamespace('public') IS NOT NULL THEN 'OK' ELSE 'MISSING' END;"
              ], { env: conn.env });
              if (postflight.stdout.trim() !== 'OK') {
                throw new Error('Restore đã chạy nhưng kiểm tra hậu kỳ không đạt; cần kiểm tra CSDL ngay.');
              }

              console.log('✅ PHỤC HỒI HOÀN TẤT. Transaction đã commit và kiểm tra hậu kỳ cơ bản đạt.');
            } finally {
              for (const f of [sqlFile, localGz, checksumLocal]) {
                if (!f) continue;
                try { if (fs.existsSync(f)) fs.unlinkSync(f); } catch {}
              }
            }
          }

          main().catch(err => {
            console.error(`❌ ${safeErrorMessage(err)}`);
            process.exit(1);
          });
          NODE

          node --check restore_script.js
          node restore_script.js

      - name: Xóa cấu hình Rclone cục bộ
        if: always()
        run: |
          rm -f ~/.config/rclone/rclone.conf
          rm -rf restore_work
