name: Khoi_phuc_moi_nhat_v19_sequence_safe_final_verified

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: 'Suffix/slug cua truong can phuc hoi (D1 slug va thu muc backup mac dinh)'
        required: true
        type: string
      backup_file:
        description: 'Ten backup .tar.gz; de trong = tu dong chon backup hoan chinh moi nhat'
        required: false
        default: ''
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: supabase-db-maintenance-${{ github.repository }}
  cancel-in-progress: false

env:
  BACKUP_FORMAT: supabase-cli-r2-v1
  BACKUP_PREFIX: database_backups
  SUPABASE_CLI_VERSION: '2.117.0'

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Install PostgreSQL client and rclone
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates

          # Install PostgreSQL client 17 to match the Supabase Postgres 17 dump environment.
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          sudo sh -c "printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main' > /etc/apt/sources.list.d/pgdg.list"
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          # Avoid a pipe here. With set -o pipefail, 'rclone version | head -n 1' can exit 141 (SIGPIPE)
          # after head exits early even though rclone itself installed correctly.
          curl -fsSL https://rclone.org/install.sh -o /tmp/install-rclone.sh
          sudo bash /tmp/install-rclone.sh
          rm -f /tmp/install-rclone.sh

          supabase --version
          psql --version
          rclone version

      - name: Configure Cloudflare R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          : "${CF_ACCOUNT_ID:?Missing CF_ACCOUNT_ID}"
          : "${R2_ACCESS_KEY_ID:?Missing R2_ACCESS_KEY_ID}"
          : "${R2_SECRET_ACCESS_KEY:?Missing R2_SECRET_ACCESS_KEY}"
          mkdir -p ~/.config/rclone
          chmod 700 ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF_RCLONE
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          region = auto
          endpoint = https://$CF_ACCOUNT_ID.r2.cloudflarestorage.com
          no_check_bucket = true
          EOF_RCLONE
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Restore selected suffix
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DB_ID: ${{ secrets.CF_D1_DB_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          INPUT_SUFFIX: ${{ github.event.inputs.suffix }}
          INPUT_BACKUP_FILE: ${{ github.event.inputs.backup_file }}
        run: |
          set -euo pipefail
          cat > restore_direct_v19.js <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const readline = require('readline');
          const { once } = require('events');
          const { spawn } = require('child_process');

          const cfAccountId = process.env.CF_ACCOUNT_ID || '';
          const cfApiToken = process.env.CF_API_TOKEN || '';
          const cfDbId = process.env.CF_D1_DB_ID || '';
          const bucket = process.env.R2_BUCKET_NAME || '';
          const prefix = process.env.BACKUP_PREFIX || 'database_backups';
          const expectedFormat = process.env.BACKUP_FORMAT || 'supabase-cli-r2-v1';
          const suffix = (process.env.INPUT_SUFFIX || '').trim();
          const requestedFile = (process.env.INPUT_BACKUP_FILE || '').trim();
          const restoreGuardSchema = '_supabase_backup_restore_internal';
          const restoreGuardComment = 'Internal commit marker for automated Supabase backup/restore workflow';
          const restoreRunId = `${process.env.GITHUB_RUN_ID || 'local'}-${process.env.GITHUB_RUN_ATTEMPT || '0'}-${Date.now()}-${suffix}`;

          if (!cfAccountId || !cfApiToken || !cfDbId) throw new Error('Missing Cloudflare D1 secrets.');
          if (!bucket) throw new Error('Missing R2_BUCKET_NAME.');
          if (!/^[A-Za-z0-9_-]+$/.test(suffix)) throw new Error('suffix is invalid.');

          const managedSchemas = new Set([
            'auth', 'storage', 'realtime', 'graphql', 'graphql_public',
            'extensions', 'pgbouncer', 'pgsodium', 'pgsodium_masks',
            'vault', 'cron', 'supabase_functions', 'supabase_migrations',
            'net', '_realtime', '_analytics', restoreGuardSchema
          ]);

          function safeError(err) {
            const text = String(err && (err.stderr || err.message || err) || 'Unknown error');
            return text.replace(/postgres(?:ql)?:\/\/[^\s"']+/gi, '[DATABASE_URL_REDACTED]').slice(0, 16000);
          }

          function run(command, args, options = {}) {
            return new Promise((resolve, reject) => {
              const child = spawn(command, args, {
                cwd: options.cwd,
                env: options.env || process.env,
                stdio: ['ignore', 'pipe', 'pipe']
              });
              let stdout = '', stderr = '';
              child.stdout.on('data', d => {
                const s = d.toString(); stdout += s;
                if (options.echoStdout) process.stdout.write(s);
                if (stdout.length > 16 * 1024 * 1024) stdout = stdout.slice(-16 * 1024 * 1024);
              });
              child.stderr.on('data', d => {
                const s = d.toString(); stderr += s;
                if (options.echoStderr !== false) process.stderr.write(s);
                if (stderr.length > 16 * 1024 * 1024) stderr = stderr.slice(-16 * 1024 * 1024);
              });
              child.on('error', reject);
              child.on('close', code => {
                if (code === 0) return resolve({ stdout, stderr });
                const e = new Error(`${command} exited with code ${code}`);
                e.code = code; e.stdout = stdout; e.stderr = stderr;
                reject(e);
              });
            });
          }

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          let maintenanceRouteLogged = false;

          function maintenanceDbUrl(dbUrl) {
            const u = new URL(dbUrl);
            if (!['postgres:', 'postgresql:'].includes(u.protocol)) throw new Error('Invalid PostgreSQL URL protocol.');

            // Supabase shared pooler: 6543 = transaction mode, 5432 = session mode.
            // Long-running maintenance/restore work must not use transaction mode.
            if (u.hostname.endsWith('.pooler.supabase.com') && u.port === '6543') {
              u.port = '5432';
              if (!maintenanceRouteLogged) {
                console.log('MAINTENANCE CONNECTION: detected Supabase shared transaction pooler :6543; automatically switching restore/dump traffic to session pooler :5432 on the same host.');
                maintenanceRouteLogged = true;
              }
            }
            if (!u.searchParams.has('sslmode')) u.searchParams.set('sslmode', 'require');
            if (!u.searchParams.has('connect_timeout')) u.searchParams.set('connect_timeout', '30');
            if (!u.searchParams.has('keepalives')) u.searchParams.set('keepalives', '1');
            if (!u.searchParams.has('keepalives_idle')) u.searchParams.set('keepalives_idle', '30');
            if (!u.searchParams.has('keepalives_interval')) u.searchParams.set('keepalives_interval', '10');
            if (!u.searchParams.has('keepalives_count')) u.searchParams.set('keepalives_count', '5');
            return u.toString();
          }

          function isTransientPgConnectionError(text) {
            return /(SSL error:\s*unexpected eof|server closed the connection unexpectedly|connection reset by peer|broken pipe|connection timed out|timeout expired|could not receive data from server|could not send data to server|terminating connection due to administrator command|the database system is starting up|cannot connect now|network is unreachable|no route to host|temporary failure in name resolution|i\/o timeout|TLS handshake timeout)/i.test(String(text || ''));
          }

          async function d1Query(sql, params = []) {
            const url = `https://api.cloudflare.com/client/v4/accounts/${cfAccountId}/d1/database/${cfDbId}/query`;
            const resp = await fetch(url, {
              method: 'POST',
              headers: { Authorization: `Bearer ${cfApiToken}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ sql, params })
            });
            const body = await resp.json().catch(() => ({}));
            if (!resp.ok || body.success === false) throw new Error(`D1 query failed: HTTP ${resp.status}; ${JSON.stringify(body.errors || body)}`);
            const block = body.result?.[0];
            if (!block || block.success === false) throw new Error(`D1 query result failed: ${JSON.stringify(block || body)}`);
            return block.results || [];
          }

          async function loadTarget() {
            const rows = await d1Query('SELECT slug, supabase_sql FROM danh_sach_truong WHERE slug = ? LIMIT 1', [suffix]);
            if (!rows.length) throw new Error(`D1 has no row for suffix [${suffix}].`);
            const dbUrl = String(rows[0].supabase_sql || '').trim();
            if (!dbUrl) throw new Error(`D1 row [${suffix}] has empty supabase_sql.`);
            return { slug: suffix, dbUrl };
          }

          function pgEnvFromUrl(dbUrl) {
            const u = new URL(maintenanceDbUrl(dbUrl));
            return {
              ...process.env,
              PGHOST: u.hostname,
              PGPORT: u.port || '5432',
              PGUSER: decodeURIComponent(u.username),
              PGPASSWORD: decodeURIComponent(u.password),
              PGDATABASE: decodeURIComponent((u.pathname || '/postgres').replace(/^\//, '')) || 'postgres',
              PGSSLMODE: u.searchParams.get('sslmode') || 'require',
              PGCONNECT_TIMEOUT: '30',
              PGKEEPALIVES: '1',
              PGKEEPALIVESIDLE: '30',
              PGKEEPALIVESINTERVAL: '10',
              PGKEEPALIVESCOUNT: '5',
              PGAPPNAME: `supabase-restore-${suffix}`
            };
          }

          async function psql(dbUrl, sql, fieldSep = '\t') {
            let lastErr;
            for (let attempt = 1; attempt <= 4; attempt++) {
              try {
                const { stdout } = await run('psql', ['-X', '-v', 'ON_ERROR_STOP=1', '-A', '-t', '-F', fieldSep, '-c', sql], {
                  env: pgEnvFromUrl(dbUrl), echoStderr: false
                });
                return stdout.trim();
              } catch (err) {
                lastErr = err;
                const msg = safeError(err);
                if (!isTransientPgConnectionError(msg) || attempt === 4) throw err;
                const wait = [2, 5, 10][attempt - 1] || 10;
                console.warn(`Transient PostgreSQL connection error during maintenance query (attempt ${attempt}/4). Retrying in ${wait}s: ${msg.split('\n')[0]}`);
                await sleep(wait * 1000);
              }
            }
            throw lastErr;
          }

          function sqlLiteral(value) { return "'" + String(value).replace(/'/g, "''") + "'"; }

          async function inspectRestoreGuard(dbUrl) {
            const out = await psql(dbUrl, `
              SELECT CASE
                WHEN to_regnamespace(${sqlLiteral(restoreGuardSchema)}) IS NULL THEN 'absent'
                WHEN COALESCE(obj_description(to_regnamespace(${sqlLiteral(restoreGuardSchema)}), 'pg_namespace'), '') = ${sqlLiteral(restoreGuardComment)} THEN 'owned'
                ELSE 'conflict'
              END;`);
            return out.trim();
          }

          async function cleanupOwnedRestoreGuard(dbUrl) {
            const state = await inspectRestoreGuard(dbUrl);
            if (state === 'absent') return;
            if (state !== 'owned') {
              throw new Error(`Reserved internal schema ${restoreGuardSchema} already exists but is not owned by this workflow. Refusing to modify it.`);
            }
            await psql(dbUrl, `DROP SCHEMA IF EXISTS "${restoreGuardSchema}" CASCADE;`);
            console.log(`Removed stale internal restore marker schema [${restoreGuardSchema}].`);
          }

          function makeCommitMarkerSql(file, backupName, sourceSlug) {
            const lines = [
              '-- Durable commit marker. It is created inside the SAME transaction and therefore',
              '-- proves COMMIT outcome after a network disconnect. It is removed after final verification.',
              `DO $guard$ BEGIN IF to_regnamespace(${sqlLiteral(restoreGuardSchema)}) IS NOT NULL AND COALESCE(obj_description(to_regnamespace(${sqlLiteral(restoreGuardSchema)}), 'pg_namespace'), '') <> ${sqlLiteral(restoreGuardComment)} THEN RAISE EXCEPTION 'Reserved restore guard schema exists with an unexpected owner/comment'; END IF; END $guard$;`,
              `CREATE SCHEMA IF NOT EXISTS "${restoreGuardSchema}";`,
              `COMMENT ON SCHEMA "${restoreGuardSchema}" IS ${sqlLiteral(restoreGuardComment)};`,
              `CREATE TABLE IF NOT EXISTS "${restoreGuardSchema}".commits (restore_id text PRIMARY KEY, backup_name text NOT NULL, source_slug text, target_slug text NOT NULL, committed_at timestamptz NOT NULL DEFAULT clock_timestamp());`,
              `INSERT INTO "${restoreGuardSchema}".commits(restore_id, backup_name, source_slug, target_slug) VALUES (${sqlLiteral(restoreRunId)}, ${sqlLiteral(backupName)}, ${sqlLiteral(sourceSlug || '')}, ${sqlLiteral(suffix)}) ON CONFLICT (restore_id) DO UPDATE SET backup_name = EXCLUDED.backup_name, source_slug = EXCLUDED.source_slug, target_slug = EXCLUDED.target_slug, committed_at = clock_timestamp();`
            ];
            fs.writeFileSync(file, lines.join('\n') + '\n');
          }

          async function commitMarkerExists(dbUrl, backupName) {
            const state = await inspectRestoreGuard(dbUrl);
            if (state === 'absent') return false;
            if (state !== 'owned') throw new Error(`Restore commit marker schema conflict detected after transaction.`);
            const out = await psql(dbUrl, `
              SELECT CASE WHEN EXISTS (
                SELECT 1 FROM "${restoreGuardSchema}".commits
                WHERE restore_id = ${sqlLiteral(restoreRunId)}
                  AND backup_name = ${sqlLiteral(backupName)}
                  AND target_slug = ${sqlLiteral(suffix)}
              ) THEN '1' ELSE '0' END;`);
            return out.trim() === '1';
          }

          async function resolveTransientRestoreOutcome(dbUrl, backupName, context) {
            // Never infer COMMIT from row counts. The transaction-local marker is authoritative.
            // A server that received COMMIT can become visible a moment after the client loses its
            // socket, so do not treat one immediate "marker absent" read as final. Poll for a short,
            // bounded window. If the DB is never reachable, fail as ambiguous rather than replaying.
            const delaysSeconds = [0, 2, 5, 10, 15];
            let reachableChecks = 0;
            let lastErr = null;
            for (const delay of delaysSeconds) {
              if (delay) await sleep(delay * 1000);
              try {
                const committed = await commitMarkerExists(dbUrl, backupName);
                reachableChecks++;
                if (committed) {
                  console.warn(`${context}: network connection was lost, but the durable in-transaction commit marker is present. COMMIT is confirmed.`);
                  return 'committed';
                }
              } catch (e) {
                lastErr = e;
              }
            }
            if (reachableChecks === delaysSeconds.length) {
              console.warn(`${context}: durable commit marker remained absent across ${reachableChecks} reachable checks over the bounded confirmation window. Treating the transaction as NOT committed.`);
              return 'not_committed';
            }
            throw new Error(`${context}: RESTORE OUTCOME IS AMBIGUOUS because the database was not consistently reachable long enough to determine the durable commit marker state. Automatic retry is intentionally stopped to avoid a false success or unintended replay. Last marker-check error: ${safeError(lastErr)}`);
          }

          async function dumpWithRetry(dbUrl, outputFile, extraArgs, label) {
            const maintenanceUrl = maintenanceDbUrl(dbUrl);
            let lastErr;
            for (let attempt = 1; attempt <= 4; attempt++) {
              fs.rmSync(outputFile, { force: true });
              try {
                const result = await run('supabase', ['db', 'dump', '--db-url', maintenanceUrl, '-f', outputFile, ...extraArgs], { echoStdout: true, echoStderr: false });
                if (result.stderr && result.stderr.trim()) console.warn(`${label} diagnostic: ${safeError({ stderr: result.stderr })}`);
                if (!fs.existsSync(outputFile) || fs.statSync(outputFile).size === 0) throw new Error(`${label} produced an empty dump file.`);
                return;
              } catch (err) {
                lastErr = err;
                fs.rmSync(outputFile, { force: true });
                const msg = safeError(err);
                if (!isTransientPgConnectionError(msg) || attempt === 4) throw err;
                const wait = [5, 10, 20][attempt - 1] || 20;
                console.warn(`Transient connection error during ${label} (attempt ${attempt}/4). Retrying in ${wait}s.`);
                await sleep(wait * 1000);
              }
            }
            throw lastErr;
          }

          async function relationExists(dbUrl, regclass) {
            const escaped = regclass.replace(/'/g, "''");
            return (await psql(dbUrl, `SELECT CASE WHEN to_regclass('${escaped}') IS NULL THEN '0' ELSE '1' END;`)) === '1';
          }

          function quoteQualified(key) {
            const idx = key.indexOf('.');
            if (idx <= 0) throw new Error(`Invalid qualified table name: ${key}`);
            const a = key.slice(0, idx), b = key.slice(idx + 1);
            return '"' + a.replace(/"/g, '""') + '"."' + b.replace(/"/g, '""') + '"';
          }

          async function countTable(dbUrl, key) {
            if (!(await relationExists(dbUrl, key))) return null;
            return Number(await psql(dbUrl, `SELECT count(*)::bigint FROM ${quoteQualified(key)};`) || 0);
          }

          function sha256File(file) {
            const h = crypto.createHash('sha256');
            const fd = fs.openSync(file, 'r');
            const buf = Buffer.allocUnsafe(1024 * 1024);
            try {
              let n;
              while ((n = fs.readSync(fd, buf, 0, buf.length, null)) > 0) h.update(buf.subarray(0, n));
            } finally { fs.closeSync(fd); }
            return h.digest('hex');
          }

          function parseQualifiedName(raw) {
            const quoted = raw.match(/^"((?:[^"]|"")+)"\."((?:[^"]|"")+)"$/);
            if (quoted) return [quoted[1].replace(/""/g, '"'), quoted[2].replace(/""/g, '"')];
            const idx = raw.indexOf('.');
            if (idx > 0) return [raw.slice(0, idx).replace(/^"|"$/g, ''), raw.slice(idx + 1).replace(/^"|"$/g, '')];
            return ['public', raw.replace(/^"|"$/g, '')];
          }

          async function parseCopyTableNames(dataFile) {
            const input = fs.createReadStream(dataFile, { encoding: 'utf8', highWaterMark: 1024 * 1024 });
            const rl = readline.createInterface({ input, crlfDelay: Infinity });
            const names = [];
            try {
              for await (const line of rl) {
                const m = line.match(/^COPY\s+(.+?)\s+\(.+\)\s+FROM stdin;$/);
                if (!m) continue;
                const [schema, table] = parseQualifiedName(m[1]);
                if (!schema || !table) throw new Error(`Invalid COPY target: ${m[1]}`);
                names.push(`${schema}.${table}`);
              }
            } finally {
              rl.close();
            }
            return [...new Set(names)].sort();
          }

          function splitSqlIdentifierList(text) {
            const out = [];
            let cur = '', quoted = false;
            for (let i = 0; i < text.length; i++) {
              const ch = text[i];
              if (ch === '"') {
                cur += ch;
                if (quoted && text[i + 1] === '"') { cur += '"'; i++; continue; }
                quoted = !quoted;
                continue;
              }
              if (ch === ',' && !quoted) { out.push(cur.trim()); cur = ''; continue; }
              cur += ch;
            }
            if (cur.trim()) out.push(cur.trim());
            if (quoted) throw new Error(`Unterminated quoted identifier list: ${text}`);
            return out;
          }

          function unquoteIdentifier(raw) {
            const v = String(raw || '').trim();
            if (/^"(?:[^"]|"")+"$/.test(v)) return v.slice(1, -1).replace(/""/g, '"');
            return v;
          }

          async function parseCopyLayouts(dataFile) {
            const input = fs.createReadStream(dataFile, { encoding: 'utf8', highWaterMark: 1024 * 1024 });
            const rl = readline.createInterface({ input, crlfDelay: Infinity });
            const layouts = new Map();
            try {
              for await (const line of rl) {
                const m = line.match(/^COPY\s+(.+?)\s+\((.*)\)\s+FROM stdin;$/);
                if (!m) continue;
                const [schema, table] = parseQualifiedName(m[1]);
                if (!schema || !table) throw new Error(`Invalid COPY target: ${m[1]}`);
                const cols = splitSqlIdentifierList(m[2]).map(unquoteIdentifier);
                const key = `${schema}.${table}`;
                const old = layouts.get(key);
                if (old && JSON.stringify(old) !== JSON.stringify(cols)) throw new Error(`Backup contains inconsistent COPY layouts for ${key}.`);
                layouts.set(key, cols);
              }
            } finally {
              rl.close();
            }
            return layouts;
          }

          async function getTargetColumnMeta(dbUrl, key) {
            const q = sqlLiteral(key);
            const out = await psql(dbUrl, `
              SELECT COALESCE(json_agg(json_build_object(
                'name', a.attname,
                'type', format_type(a.atttypid, a.atttypmod),
                'not_null', a.attnotnull,
                'has_default', ad.oid IS NOT NULL,
                'generated', a.attgenerated,
                'identity', a.attidentity
              ) ORDER BY a.attnum)::text, '[]')
              FROM pg_attribute a
              LEFT JOIN pg_attrdef ad ON ad.adrelid=a.attrelid AND ad.adnum=a.attnum
              WHERE a.attrelid=to_regclass(${q}) AND a.attnum>0 AND NOT a.attisdropped;`);
            try { return JSON.parse(out || '[]'); }
            catch (_) { throw new Error(`Could not parse target column metadata for ${key}.`); }
          }

          async function preflightExistingDataCompatibility(dbUrl, files) {
            const merged = new Map();
            for (const file of files.filter(Boolean)) {
              if (!fs.existsSync(file)) continue;
              for (const [key, cols] of await parseCopyLayouts(file)) {
                const old = merged.get(key);
                if (old && JSON.stringify(old) !== JSON.stringify(cols)) throw new Error(`Backup has conflicting COPY column layouts for ${key}.`);
                merged.set(key, cols);
              }
            }
            if (!merged.size) throw new Error('Backup contains no COPY table layout; refusing in-place destructive restore.');

            const errors = [], warnings = [];
            for (const [key, backupCols] of [...merged.entries()].sort(([a],[b]) => a.localeCompare(b))) {
              if (!(await relationExists(dbUrl, key))) { errors.push(`${key}: target table does not exist`); continue; }
              const meta = await getTargetColumnMeta(dbUrl, key);
              const byName = new Map(meta.map(x => [x.name, x]));
              const missing = backupCols.filter(c => !byName.has(c));
              if (missing.length) errors.push(`${key}: missing target column(s): ${missing.join(', ')}`);

              const generatedInCopy = backupCols.filter(c => byName.get(c)?.generated);
              if (generatedInCopy.length) errors.push(`${key}: backup COPY includes generated target column(s): ${generatedInCopy.join(', ')}`);

              const backupSet = new Set(backupCols);
              const requiredExtra = meta.filter(c => !backupSet.has(c.name) && c.not_null && !c.has_default && !c.generated && !c.identity);
              if (requiredExtra.length) errors.push(`${key}: target has required column(s) absent from backup COPY and without default: ${requiredExtra.map(x => x.name).join(', ')}`);

              const extra = meta.filter(c => !backupSet.has(c.name));
              if (extra.length) warnings.push(`${key}: target has ${extra.length} extra column(s); PostgreSQL transaction will validate defaults/constraints while loading`);
            }
            return { layouts: merged, errors, warnings };
          }

          async function parseCopyCounts(dataFile) {
            const input = fs.createReadStream(dataFile, { encoding: 'utf8', highWaterMark: 1024 * 1024 });
            const rl = readline.createInterface({ input, crlfDelay: Infinity });
            const counts = {};
            let current = null, count = 0;
            try {
              for await (const line of rl) {
                if (!current) {
                  const m = line.match(/^COPY\s+(.+?)\s+\(.+\)\s+FROM stdin;$/);
                  if (m) { current = m[1]; count = 0; }
                } else if (line === '\\.') {
                  const [schema, table] = parseQualifiedName(current);
                  counts[`${schema}.${table}`] = count;
                  current = null; count = 0;
                } else count++;
              }
            } finally {
              rl.close();
            }
            if (current) throw new Error('data.sql ended inside a COPY block.');
            return Object.fromEntries(Object.entries(counts).sort(([a], [b]) => a.localeCompare(b)));
          }

          function dumpSemanticFingerprint(file) {
            // Preserve SQL semantics exactly. Ignore only PostgreSQL 17 pg_dump's random
            // \restrict/\unrestrict guard lines; never collapse whitespace/comments/literals.
            const text = fs.readFileSync(file, 'utf8').replace(/\r\n/g, '\n');
            const canonical = text.split('\n')
              .filter(line => !/^\s*\\(?:un)?restrict\b/i.test(line))
              .join('\n');
            return crypto.createHash('sha256').update(canonical, 'utf8').digest('hex');
          }

          function schemaFingerprint(file) {
            return dumpSemanticFingerprint(file);
          }

          async function collectManagedSignatures(dbUrl) {
            const tr = await psql(dbUrl, `
              SELECT event_object_schema || '.' || event_object_table || '|' || trigger_name || '|' || event_manipulation || '|' || action_timing || '|' || action_orientation || '|' || coalesce(action_statement,'')
              FROM information_schema.triggers
              WHERE event_object_schema IN ('auth','storage','realtime') ORDER BY 1;`, '\x1f');
            const po = await psql(dbUrl, `
              SELECT schemaname || '.' || tablename || '|' || policyname || '|' || cmd || '|' || permissive || '|' || coalesce(array_to_string(roles,','),'') || '|' || coalesce(qual,'') || '|' || coalesce(with_check,'')
              FROM pg_policies WHERE schemaname IN ('auth','storage','realtime') ORDER BY 1;`, '\x1f');
            return {
              triggers: tr ? tr.split(/\r?\n/).filter(Boolean) : [],
              policies: po ? po.split(/\r?\n/).filter(Boolean) : []
            };
          }

          async function collectExtensions(dbUrl) {
            const out = await psql(dbUrl, `SELECT extname || '|' || extversion FROM pg_extension ORDER BY extname;`, '\x1f');
            return out ? out.split(/\r?\n/).filter(Boolean).map(line => {
              const i = line.indexOf('|');
              return { name: line.slice(0, i), version: line.slice(i + 1) };
            }) : [];
          }

          async function collectExtensionNames(dbUrl) {
            return (await collectExtensions(dbUrl)).map(x => x.name);
          }

          async function collectRealtimeTables(dbUrl) {
            const exists = (await psql(dbUrl, `SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_publication WHERE pubname='supabase_realtime') THEN '1' ELSE '0' END;`)) === '1';
            if (!exists) return [];
            const out = await psql(dbUrl, `SELECT schemaname || '.' || tablename FROM pg_publication_tables WHERE pubname='supabase_realtime' ORDER BY schemaname, tablename;`, '\x1f');
            return out ? out.split(/\r?\n/).filter(Boolean) : [];
          }

          async function inspectTarget(dbUrl) {
            const appRelations = Number(await psql(dbUrl, `
              SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE c.relkind IN ('r','p','v','m','S')
                AND n.nspname NOT IN ('auth','storage','realtime','graphql','graphql_public','extensions','pgbouncer','pgsodium','pgsodium_masks','vault','cron','supabase_functions','supabase_migrations','net','_realtime','_analytics','_supabase_backup_restore_internal','information_schema')
                AND n.nspname NOT LIKE 'pg_%'
                AND NOT EXISTS (SELECT 1 FROM pg_depend d WHERE d.objid=c.oid AND d.deptype='e');`));
            const appFunctions = Number(await psql(dbUrl, `
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname NOT IN ('auth','storage','realtime','graphql','graphql_public','extensions','pgbouncer','pgsodium','pgsodium_masks','vault','cron','supabase_functions','supabase_migrations','net','_realtime','_analytics','_supabase_backup_restore_internal','information_schema')
                AND n.nspname NOT LIKE 'pg_%'
                AND NOT EXISTS (SELECT 1 FROM pg_depend d WHERE d.objid=p.oid AND d.deptype='e');`));
            const authUsers = await countTable(dbUrl, 'auth.users');
            const authIdentities = await countTable(dbUrl, 'auth.identities');
            const storageObjects = await countTable(dbUrl, 'storage.objects');
            const storageBuckets = await countTable(dbUrl, 'storage.buckets');
            const dirty = [];
            if (appRelations > 0) dirty.push(`application relations=${appRelations}`);
            if (appFunctions > 0) dirty.push(`application functions=${appFunctions}`);
            if ((authUsers || 0) > 0) dirty.push(`auth.users=${authUsers}`);
            if ((authIdentities || 0) > 0) dirty.push(`auth.identities=${authIdentities}`);
            if ((storageObjects || 0) > 0) dirty.push(`storage.objects=${storageObjects}`);
            if ((storageBuckets || 0) > 0) dirty.push(`storage.buckets=${storageBuckets}`);
            return { clean: dirty.length === 0, dirty };
          }

          function normalizeBackupName(input) {
            let v = String(input || '').trim().replace(/^['"]|['"]$/g, '');
            if (!v || v.toLowerCase() === 'latest') return 'latest';
            v = v.replace(/\\/g, '/');
            try { if (/^https?:\/\//i.test(v)) v = new URL(v).pathname; } catch (_) {}
            v = v.split('/').filter(Boolean).pop() || '';
            if (v.endsWith('.tar.gz.sha256')) v = v.slice(0, -'.sha256'.length);
            if (v.endsWith('.tar.gz.manifest.json')) v = v.slice(0, -'.manifest.json'.length);
            if (!/^[A-Za-z0-9_.-]+\.tar\.gz$/.test(v)) throw new Error('backup_file must be blank/latest or a safe .tar.gz/.sha256/.manifest.json name.');
            return v;
          }

          async function listRemoteDir(remoteDir) {
            try {
              const { stdout } = await run('rclone', ['lsjson', remoteDir, '--files-only', '--s3-no-check-bucket', '--retries', '5', '--low-level-retries', '10', '--contimeout', '30s', '--timeout', '10m'], { echoStderr: false });
              return JSON.parse(stdout || '[]');
            } catch (e) {
              const msg = String(e && (e.stderr || e.message || e) || '');
              if (/directory not found|object not found|not found|404/i.test(msg)) return [];
              throw e;
            }
          }

          function validVietnamStampToEpoch(stamp) {
            // Accept both v12 millisecond stamps and v11 second-only stamps.
            const m = String(stamp || '').match(/^(\d{2})-(\d{2})-(\d{2})(?:-(\d{3}))?_(\d{2})-(\d{2})-(\d{4})$/);
            if (!m) return null;
            const hh = Number(m[1]), mm = Number(m[2]), ss = Number(m[3]);
            const millis = m[4] ? Number(m[4]) : 0;
            const dd = Number(m[5]), mo = Number(m[6]), yyyy = Number(m[7]);
            if (hh > 23 || mm > 59 || ss > 59 || millis > 999 || mo < 1 || mo > 12 || dd < 1 || dd > 31) return null;
            const epochMs = Date.UTC(yyyy, mo - 1, dd, hh - 7, mm, ss, millis);
            const check = new Date(epochMs + 7 * 3600 * 1000);
            if (check.getUTCFullYear() !== yyyy || check.getUTCMonth() + 1 !== mo || check.getUTCDate() !== dd ||
                check.getUTCHours() !== hh || check.getUTCMinutes() !== mm || check.getUTCSeconds() !== ss ||
                check.getUTCMilliseconds() !== millis) return null;
            return epochMs;
          }

          function snapshotTimeForName(name) {
            const escSlug = suffix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            // v12 collision-safe family:
            // <slug>_<HH-MM-SS-mmm>_<DD-MM-YYYY>_<run-token>.tar.gz
            let m = String(name || '').match(new RegExp(`^${escSlug}_(\\d{2}-\\d{2}-\\d{2}-\\d{3}_\\d{2}-\\d{2}-\\d{4})_([A-Za-z0-9-]+)\\.tar\\.gz$`));
            if (m) {
              const epochMs = validVietnamStampToEpoch(m[1]);
              if (epochMs !== null) return epochMs;
            }

            // Backward compatibility with v11 second-only names:
            // <slug>_<HH-MM-SS>_<DD-MM-YYYY>.tar.gz
            m = String(name || '').match(new RegExp(`^${escSlug}_(\\d{2}-\\d{2}-\\d{2}_\\d{2}-\\d{2}-\\d{4})\\.tar\\.gz$`));
            if (m) {
              const epochMs = validVietnamStampToEpoch(m[1]);
              if (epochMs !== null) return epochMs;
            }

            // Backward compatibility with v7-and-earlier CLI backups already stored in R2.
            const escFormat = expectedFormat.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            m = String(name || '').match(new RegExp(`^${escSlug}_(\\d{8})T(\\d{2})(\\d{2})(\\d{2})Z_${escFormat}\\.tar\\.gz$`));
            if (!m) return null;
            const y = Number(m[1].slice(0, 4)), mo = Number(m[1].slice(4, 6)), d = Number(m[1].slice(6, 8));
            const hh = Number(m[2]), mm = Number(m[3]), ss = Number(m[4]);
            const epochMs = Date.UTC(y, mo - 1, d, hh, mm, ss);
            const check = new Date(epochMs);
            if (check.getUTCFullYear() !== y || check.getUTCMonth() + 1 !== mo || check.getUTCDate() !== d ||
                check.getUTCHours() !== hh || check.getUTCMinutes() !== mm || check.getUTCSeconds() !== ss) return null;
            return epochMs;
          }

          async function resolveBackupLocation() {
            const wanted = normalizeBackupName(requestedFile);
            const defaultDir = `r2:${bucket}/${prefix}/${suffix}`;
            const files = await listRemoteDir(defaultDir);
            const map = new Map(files.map(f => [f.Path, f]));
            if (wanted === 'latest') {
              const complete = files
                .map(f => ({ file: f, epochMs: snapshotTimeForName(f.Path) }))
                .filter(x => Number.isFinite(x.epochMs))
                .filter(x => map.has(`${x.file.Path}.sha256`) && map.has(`${x.file.Path}.manifest.json`))
                // Parsed snapshot time is authoritative; R2 ModTime can change after a re-upload.
                .sort((a, b) => b.epochMs - a.epochMs || String(b.file.Path).localeCompare(String(a.file.Path)));
              if (!complete.length) throw new Error(`No complete Supabase CLI backup set found for suffix [${suffix}].`);
              return { remoteDir: defaultDir, name: complete[0].file.Path };
            }
            if (map.has(wanted) && map.has(`${wanted}.sha256`) && map.has(`${wanted}.manifest.json`)) {
              return { remoteDir: defaultDir, name: wanted };
            }

            throw new Error(`Backup [${wanted}] was not found as a complete set inside the target school's folder [${prefix}/${suffix}]. Cross-school restore is intentionally disabled.`);
          }

          async function downloadAndVerifyBackup() {
            const loc = await resolveBackupLocation();
            fs.rmSync('restore_work', { recursive: true, force: true });
            fs.mkdirSync('restore_work', { recursive: true });
            const localBundle = path.join('restore_work', loc.name);
            const localSha = `${localBundle}.sha256`;
            const localManifest = `${localBundle}.manifest.json`;
            const transferFlags = ['--s3-no-check-bucket', '--retries', '5', '--low-level-retries', '10', '--contimeout', '30s', '--timeout', '10m'];
            await run('rclone', ['copyto', `${loc.remoteDir}/${loc.name}`, localBundle, ...transferFlags]);
            await run('rclone', ['copyto', `${loc.remoteDir}/${loc.name}.sha256`, localSha, ...transferFlags]);
            await run('rclone', ['copyto', `${loc.remoteDir}/${loc.name}.manifest.json`, localManifest, ...transferFlags]);

            const expected = fs.readFileSync(localSha, 'utf8').trim().split(/\s+/)[0];
            const actual = sha256File(localBundle);
            if (!/^[a-f0-9]{64}$/i.test(expected) || expected.toLowerCase() !== actual.toLowerCase()) throw new Error(`Backup SHA-256 mismatch for ${loc.name}.`);

            const outsideManifest = JSON.parse(fs.readFileSync(localManifest, 'utf8'));
            if (outsideManifest.format !== expectedFormat || outsideManifest.format_version !== 1) {
              throw new Error(`Unsupported backup format: ${outsideManifest.format} v${outsideManifest.format_version}`);
            }

            const { stdout: listOut } = await run('tar', ['-tzf', localBundle]);
            const entries = listOut.split(/\r?\n/).filter(Boolean);
            if (entries.length !== new Set(entries).size) throw new Error('Backup archive contains duplicate entries. Refusing extraction.');
            const allowed = new Set(['roles.sql','schema.sql','data.sql','manifest.json','history_schema.sql','history_data.sql']);
            for (const e of entries) {
              if (e.startsWith('/') || e.includes('..') || !allowed.has(e)) throw new Error(`Unsafe or unexpected archive entry: ${e}`);
            }
            for (const required of ['roles.sql','schema.sql','data.sql','manifest.json']) if (!entries.includes(required)) throw new Error(`Archive is missing ${required}.`);
            await run('tar', ['-xzf', localBundle, '--no-same-owner', '--no-same-permissions', '-C', 'restore_work']);
            const insideManifest = JSON.parse(fs.readFileSync(path.join('restore_work', 'manifest.json'), 'utf8'));
            if (JSON.stringify(insideManifest) !== JSON.stringify(outsideManifest)) throw new Error('Inside and sidecar manifests differ.');

            const allowedComponents = new Set(['roles.sql','schema.sql','data.sql','history_schema.sql','history_data.sql']);
            const components = insideManifest.components;
            if (!components || typeof components !== 'object' || Array.isArray(components)) throw new Error('Manifest components object is missing or invalid.');
            for (const required of ['roles.sql','schema.sql','data.sql']) {
              if (!Object.prototype.hasOwnProperty.call(components, required)) throw new Error(`Manifest is missing required component metadata: ${required}`);
            }
            const historyEntriesPresent = entries.includes('history_schema.sql') || entries.includes('history_data.sql');
            if (insideManifest.has_migration_history === true) {
              if (!entries.includes('history_schema.sql') || !entries.includes('history_data.sql') ||
                  !components['history_schema.sql'] || !components['history_data.sql']) {
                throw new Error('Manifest says migration history is present, but the archive/components are incomplete.');
              }
            } else if (historyEntriesPresent || components['history_schema.sql'] || components['history_data.sql']) {
              throw new Error('Archive contains migration-history files but manifest.has_migration_history is not true.');
            }

            for (const [file, meta] of Object.entries(components)) {
              if (!allowedComponents.has(file)) throw new Error(`Manifest contains unexpected component name: ${file}`);
              if (!meta || typeof meta !== 'object' || !/^[a-f0-9]{64}$/i.test(String(meta.sha256 || ''))) throw new Error(`Manifest has invalid SHA-256 metadata for ${file}`);
              if (!Number.isSafeInteger(Number(meta.bytes)) || Number(meta.bytes) < 0) throw new Error(`Manifest has invalid byte length for ${file}`);
              const f = path.join('restore_work', file);
              if (!fs.existsSync(f)) throw new Error(`Manifest component missing: ${file}`);
              if (fs.statSync(f).size !== Number(meta.bytes)) throw new Error(`Component byte-length mismatch: ${file}`);
              if (sha256File(f) !== String(meta.sha256).toLowerCase()) throw new Error(`Component SHA-256 mismatch: ${file}`);
            }

            // Cross-check manifest row counts against the exact extracted data.sql before touching
            // the target. This turns the already-streaming parser into an independent manifest/data
            // consistency gate and prevents a malformed manifest from driving destructive verification.
            const parsedDataCounts = await parseCopyCounts(path.join('restore_work', 'data.sql'));
            for (const [key, rawExpected] of Object.entries(insideManifest.verification?.copy_row_counts || {})) {
              const expectedCount = Number(rawExpected);
              if (!Number.isSafeInteger(expectedCount) || expectedCount < 0 || !Object.prototype.hasOwnProperty.call(parsedDataCounts, key) || Number(parsedDataCounts[key]) !== expectedCount) {
                throw new Error(`Manifest/data.sql row-count mismatch for ${key}.`);
              }
            }
            for (const [key, manifestKey] of [['auth.users','auth_users_count'],['auth.identities','auth_identities_count'],['storage.buckets','storage_buckets_count'],['storage.objects','storage_objects_count']]) {
              const expectedCount = Number(insideManifest.verification?.[manifestKey]);
              if (!Number.isSafeInteger(expectedCount) || expectedCount < 0 || !Object.prototype.hasOwnProperty.call(parsedDataCounts, key) || Number(parsedDataCounts[key]) !== expectedCount) {
                throw new Error(`Critical manifest/data.sql count mismatch for ${key}.`);
              }
            }
            console.log(`Selected backup: ${loc.name}`);
            console.log(`Backup source slug: ${insideManifest.source_slug || 'unknown'}; target suffix: ${suffix}`);
            if (!insideManifest.source_slug || insideManifest.source_slug !== suffix) {
              throw new Error(`Backup source slug [${insideManifest.source_slug || 'missing'}] does not match target suffix [${suffix}]. Cross-school restore is disabled.`);
            }
            // The compressed bundle and sidecars are no longer needed after extraction plus
            // component-hash verification. Free them early to reduce GitHub-runner disk pressure.
            for (const f of [localBundle, localSha, localManifest]) fs.rmSync(f, { force: true });
            return { name: loc.name, manifest: insideManifest };
          }

          function makeRealtimeSql(manifest, dbUrl, file) {
            return collectRealtimeTables(dbUrl).then(actual => {
              const expected = (manifest.verification?.realtime_publication_tables || []).slice().sort();
              const a = new Set(actual), e = new Set(expected);
              const lines = ['-- Restore supabase_realtime publication membership'];
              for (const key of actual) if (!e.has(key)) lines.push(`ALTER PUBLICATION "supabase_realtime" DROP TABLE ${quoteQualified(key)};`);
              for (const key of expected) if (!a.has(key)) lines.push(`ALTER PUBLICATION "supabase_realtime" ADD TABLE ${quoteQualified(key)};`);
              fs.writeFileSync(file, lines.join('\n') + '\n');
            });
          }

          async function ensureExtensions(dbUrl, manifest) {
            const target = new Set(await collectExtensionNames(dbUrl));
            const missing = (manifest.verification?.extensions || []).map(x => x.name).filter(x => !target.has(x) && x !== 'plpgsql');
            for (const ext of missing) {
              if (!/^[A-Za-z0-9_-]+$/.test(ext)) throw new Error(`Unsafe extension name: ${ext}`);
              console.log(`Target missing extension [${ext}]; attempting CREATE EXTENSION IF NOT EXISTS.`);
              await psql(dbUrl, `CREATE EXTENSION IF NOT EXISTS "${ext.replace(/"/g, '""')}";`);
            }
            const after = new Set(await collectExtensionNames(dbUrl));
            const stillMissing = (manifest.verification?.extensions || []).map(x => x.name).filter(x => !after.has(x));
            if (stillMissing.length) throw new Error(`Target is missing required extensions: ${stillMissing.join(', ')}`);
          }

          async function assertRequiredExtensionsPresent(dbUrl, manifest) {
            const target = new Set(await collectExtensionNames(dbUrl));
            const missing = (manifest.verification?.extensions || []).map(x => x.name).filter(x => !target.has(x));
            if (missing.length) {
              throw new Error(`Existing target is missing required extension(s): ${missing.join(', ')}. No target data was changed. Enable the extension(s) first or restore to a clean/new project.`);
            }
          }

          function makeTransactionalVerificationSql(manifest, file) {
            const checks = new Map();
            const expectedCounts = manifest.verification?.copy_row_counts || {};
            for (const [key, rawExpected] of Object.entries(expectedCounts)) {
              const idx = key.indexOf('.');
              const schema = idx > 0 ? key.slice(0, idx) : '';
              const isApp = !managedSchemas.has(schema) && !schema.startsWith('pg_') && schema !== 'information_schema';
              const isKeyManaged = ['auth.users','auth.identities','storage.buckets','storage.objects'].includes(key);
              if (!isApp && !isKeyManaged) continue;
              const expected = Number(rawExpected);
              if (!Number.isSafeInteger(expected) || expected < 0) throw new Error(`Invalid manifest row count for ${key}: ${rawExpected}`);
              checks.set(key, expected);
            }

            const critical = [
              ['auth.users', 'auth_users_count'],
              ['auth.identities', 'auth_identities_count'],
              ['storage.buckets', 'storage_buckets_count'],
              ['storage.objects', 'storage_objects_count']
            ];
            for (const [key, manifestKey] of critical) {
              const rawExpected = manifest.verification?.[manifestKey];
              if (rawExpected === undefined || rawExpected === null) throw new Error(`Manifest is missing critical verification field ${manifestKey}.`);
              const expected = Number(rawExpected);
              if (!Number.isSafeInteger(expected) || expected < 0) throw new Error(`Invalid manifest row count for ${key}: ${rawExpected}`);
              if (checks.has(key) && checks.get(key) !== expected) throw new Error(`Manifest row-count fields disagree for ${key}.`);
              checks.set(key, expected);
            }

            const lines = [
              '-- Hard verification executed inside the restore transaction before COMMIT.',
              'SET session_replication_role = origin;'
            ];
            for (const [key, expected] of [...checks.entries()].sort(([a],[b]) => a.localeCompare(b))) {
              const label = key.replace(/'/g, "''");
              lines.push(`DO $verify$ BEGIN IF (SELECT count(*)::bigint FROM ${quoteQualified(key)}) <> ${expected}::bigint THEN RAISE EXCEPTION USING MESSAGE = 'Transactional row-count verification failed for ${label}: expected ${expected}'; END IF; END $verify$;`);
            }
            fs.writeFileSync(file, lines.join('\n') + '\n');
            return checks.size;
          }

          function makePostLoadIntegritySql(tableKeys, file, options = {}) {
            const keys = [...new Set((tableKeys || []).map(String))].sort();
            if (!keys.length) throw new Error('Cannot prepare post-load integrity checks: no restored tables were found.');
            const restoredArray = `ARRAY[${keys.map(sqlLiteral).join(',')}]::text[]`;
            const managedArray = `ARRAY[${[...managedSchemas].sort().map(sqlLiteral).join(',')}]::text[]`;
            const repairSequences = options.repairSequences === true;
            const lines = [
              '-- Post-load integrity gate. Runs inside the same restore transaction.',
              'SET session_replication_role = origin;'
            ];

            // Validate all restored foreign keys BEFORE any sequence repair. Managed-sequence
            // fallback uses setval(), whose state change is not rolled back by PostgreSQL, so all
            // other hard integrity gates must run first.
            lines.push(`DO $fk_guard$
          DECLARE
            r record;
            v_all_nonnull text;
            v_all_null text;
            v_join text;
            v_where text;
            v_bad boolean;
          BEGIN
            FOR r IN
              SELECT c.oid, c.conname, c.conrelid, c.confrelid, c.conkey, c.confkey, c.confmatchtype,
           cn.nspname AS child_schema, cc.relname AS child_table,
           pn.nspname AS parent_schema, pc.relname AS parent_table
              FROM pg_constraint c
              JOIN pg_class cc ON cc.oid = c.conrelid
              JOIN pg_namespace cn ON cn.oid = cc.relnamespace
              JOIN pg_class pc ON pc.oid = c.confrelid
              JOIN pg_namespace pn ON pn.oid = pc.relnamespace
              WHERE c.contype = 'f'
                AND c.convalidated
                AND (cn.nspname || '.' || cc.relname) = ANY (${restoredArray})
            LOOP
              IF r.confmatchtype = 'p' THEN
                RAISE EXCEPTION 'MATCH PARTIAL foreign key is not supported by integrity checker: %.% constraint %', r.child_schema, r.child_table, r.conname;
              END IF;

              SELECT string_agg(format('c.%I IS NOT NULL', ca.attname), ' AND ' ORDER BY ck.ord),
           string_agg(format('c.%I IS NULL', ca.attname), ' AND ' ORDER BY ck.ord),
           string_agg(format('p.%I = c.%I', pa.attname, ca.attname), ' AND ' ORDER BY ck.ord)
                INTO v_all_nonnull, v_all_null, v_join
              FROM unnest(r.conkey) WITH ORDINALITY AS ck(attnum, ord)
              JOIN unnest(r.confkey) WITH ORDINALITY AS pk(attnum, ord) USING (ord)
              JOIN pg_attribute ca ON ca.attrelid = r.conrelid AND ca.attnum = ck.attnum
              JOIN pg_attribute pa ON pa.attrelid = r.confrelid AND pa.attnum = pk.attnum;

              IF v_all_nonnull IS NULL OR v_join IS NULL THEN
                RAISE EXCEPTION 'Could not derive foreign-key columns for %.% constraint %', r.child_schema, r.child_table, r.conname;
              END IF;

              IF r.confmatchtype = 'f' THEN
                v_where := format('((NOT (%s) AND NOT (%s)) OR ((%s) AND NOT EXISTS (SELECT 1 FROM %I.%I p WHERE %s)))',
                        v_all_null, v_all_nonnull, v_all_nonnull, r.parent_schema, r.parent_table, v_join);
              ELSE
                v_where := format('((%s) AND NOT EXISTS (SELECT 1 FROM %I.%I p WHERE %s))',
                        v_all_nonnull, r.parent_schema, r.parent_table, v_join);
              END IF;

              EXECUTE format('SELECT EXISTS (SELECT 1 FROM %I.%I c WHERE %s LIMIT 1)', r.child_schema, r.child_table, v_where) INTO v_bad;
              IF v_bad THEN
                RAISE EXCEPTION 'Foreign-key integrity verification failed: %.% constraint % -> %.%',
                      r.child_schema, r.child_table, r.conname, r.parent_schema, r.parent_table;
              END IF;
            END LOOP;
          END $fk_guard$;`);

            if (repairSequences) {
              lines.push(`DO $seq_guard$
          DECLARE
            r record;
            v_extreme numeric;
            v_last numeric;
            v_called boolean;
            v_current_next numeric;
            v_step numeric;
            v_steps numeric;
            v_restart numeric;
            v_collision boolean;
            v_is_managed boolean;
            v_used_setval boolean;
          BEGIN
            FOR r IN
              SELECT s.oid AS seq_oid,
           pg_get_userbyid(s.relowner) AS seq_owner,
           sns.nspname AS seq_schema, s.relname AS seq_name,
           tns.nspname AS table_schema, t.relname AS table_name,
           a.attname AS column_name, ps.increment_by::numeric AS increment_by,
           ps.min_value::numeric AS min_value, ps.max_value::numeric AS max_value,
           ps.cycle AS cycle,
           has_sequence_privilege(current_user, s.oid, 'UPDATE') AS can_setval
              FROM pg_class s
              JOIN pg_namespace sns ON sns.oid = s.relnamespace
              JOIN pg_depend d ON d.classid = 'pg_class'::regclass AND d.objid = s.oid
                    AND d.refclassid = 'pg_class'::regclass AND d.deptype IN ('a','i')
              JOIN pg_class t ON t.oid = d.refobjid
              JOIN pg_namespace tns ON tns.oid = t.relnamespace
              JOIN pg_attribute a ON a.attrelid = t.oid AND a.attnum = d.refobjsubid
              JOIN pg_sequences ps ON ps.schemaname = sns.nspname AND ps.sequencename = s.relname
              WHERE s.relkind = 'S'
                AND (tns.nspname || '.' || t.relname) = ANY (${restoredArray})
                AND tns.nspname NOT LIKE 'pg_%' AND tns.nspname <> 'information_schema'
            LOOP
              IF r.increment_by = 0 THEN
                RAISE EXCEPTION 'Sequence %.% has zero increment', r.seq_schema, r.seq_name;
              END IF;
              v_step := abs(r.increment_by);

              IF r.increment_by > 0 THEN
                EXECUTE format('SELECT max(%I)::numeric FROM %I.%I', r.column_name, r.table_schema, r.table_name) INTO v_extreme;
              ELSE
                EXECUTE format('SELECT min(%I)::numeric FROM %I.%I', r.column_name, r.table_schema, r.table_name) INTO v_extreme;
              END IF;
              IF v_extreme IS NULL THEN CONTINUE; END IF;

              EXECUTE format('SELECT last_value::numeric, is_called FROM %I.%I', r.seq_schema, r.seq_name) INTO v_last, v_called;
              v_current_next := CASE WHEN v_called THEN v_last + r.increment_by ELSE v_last END;
              v_is_managed := (r.table_schema = ANY (${managedArray}) OR r.seq_schema = ANY (${managedArray}));

              -- A collision means the current sequence phase will eventually generate an ID that
              -- already exists in the restored rows. We do not merely test current_next itself;
              -- we test the whole arithmetic progression from current_next through the data range.
              IF r.increment_by > 0 THEN
                EXECUTE format('SELECT EXISTS (SELECT 1 FROM %I.%I WHERE %I IS NOT NULL AND %I::numeric >= $1 AND mod(%I::numeric - $1, $2) = 0)',
                               r.table_schema, r.table_name, r.column_name, r.column_name, r.column_name)
                  INTO v_collision USING v_current_next, v_step;
              ELSE
                EXECUTE format('SELECT EXISTS (SELECT 1 FROM %I.%I WHERE %I IS NOT NULL AND %I::numeric <= $1 AND mod($1 - %I::numeric, $2) = 0)',
                               r.table_schema, r.table_name, r.column_name, r.column_name, r.column_name)
                  INTO v_collision USING v_current_next, v_step;
              END IF;
              IF NOT v_collision THEN CONTINUE; END IF;

              -- Preserve the target sequence phase and ADVANCE ONLY. Never move a sequence backward.
              -- This is important because setval() is not transactional: if COMMIT later becomes
              -- ambiguous/aborts, the only possible leaked effect is a harmless forward gap.
              IF r.increment_by > 0 THEN
                v_steps := floor((v_extreme - v_current_next) / v_step) + 1;
                v_restart := v_current_next + (v_steps * v_step);
                IF v_restart > r.max_value THEN
                  RAISE EXCEPTION 'Sequence %.% has no collision-free restart value within max_value after restore', r.seq_schema, r.seq_name;
                END IF;
              ELSE
                v_steps := floor((v_current_next - v_extreme) / v_step) + 1;
                v_restart := v_current_next - (v_steps * v_step);
                IF v_restart < r.min_value THEN
                  RAISE EXCEPTION 'Sequence %.% has no collision-free restart value within min_value after restore', r.seq_schema, r.seq_name;
                END IF;
              END IF;

              IF r.can_setval IS NOT TRUE AND v_is_managed THEN
                RAISE EXCEPTION 'Managed sequence %.% must advance from % to % after restore, but current role % has no UPDATE privilege on the sequence (owner=%). Refusing COMMIT to prevent a future duplicate-key collision.',
                  r.seq_schema, r.seq_name, v_current_next, v_restart, current_user, r.seq_owner;
              END IF;

              v_used_setval := false;
              IF v_is_managed THEN
                -- Supabase-managed sequences are usually owned by a service role (for example
                -- supabase_auth_admin), so ALTER SEQUENCE can require ownership even though the
                -- postgres maintenance role has UPDATE privilege. setval() changes only runtime
                -- sequence state, not ownership/DDL. It is deliberately executed at the very end
                -- of all hard restore checks and only advances the sequence.
                PERFORM pg_catalog.setval(r.seq_oid::regclass, v_restart::bigint, false);
                v_used_setval := true;
              ELSE
                BEGIN
                  -- Prefer transactional RESTART for application-owned sequences when ownership permits.
                  EXECUTE format('ALTER SEQUENCE %I.%I RESTART WITH %s', r.seq_schema, r.seq_name, v_restart);
                EXCEPTION WHEN insufficient_privilege THEN
                  IF r.can_setval IS NOT TRUE THEN
                    RAISE EXCEPTION 'Sequence %.% must advance from % to % after restore, but current role % neither owns it nor has UPDATE privilege (owner=%).',
                      r.seq_schema, r.seq_name, v_current_next, v_restart, current_user, r.seq_owner;
                  END IF;
                  PERFORM pg_catalog.setval(r.seq_oid::regclass, v_restart::bigint, false);
                  v_used_setval := true;
                END;
              END IF;

              IF v_used_setval THEN
                RAISE NOTICE 'Sequence safety repair via setval: %.% next value advanced from % to % for %.%.',
                  r.seq_schema, r.seq_name, v_current_next, v_restart, r.table_schema, r.table_name;
              ELSE
                RAISE NOTICE 'Sequence safety repair via transactional RESTART: %.% next value advanced from % to % for %.%.',
                  r.seq_schema, r.seq_name, v_current_next, v_restart, r.table_schema, r.table_name;
              END IF;
            END LOOP;
          END $seq_guard$;`);
            }

            fs.writeFileSync(file, lines.join('\n') + '\n');
          }

          async function captureCurrentSchemaForPreflight(dbUrl) {
            // This is NOT a safety backup and is never uploaded to R2. It is a temporary
            // local schema snapshot used only to compare/preflight an existing target.
            const schema = path.resolve('restore_work/current_target_schema.sql');
            await dumpWithRetry(dbUrl, schema, [], `[${suffix}] current target schema preflight dump`);
            if (!fs.existsSync(schema) || fs.statSync(schema).size === 0) {
              throw new Error('Current target schema preflight dump is empty. No target data was changed.');
            }
            return schema;
          }

          async function terminateClientSessions(dbUrl) {
            try {
              const sql = `
                SELECT pg_terminate_backend(pid)
                FROM pg_stat_activity
                WHERE datname = current_database()
                  AND pid <> pg_backend_pid()
                  AND backend_type = 'client backend'
                  AND usename <> 'supabase_admin';`;
              await psql(dbUrl, sql);
            } catch (err) {
              console.warn(`Could not terminate all client sessions before restore: ${safeError(err).split('\n')[0]}`);
            }
          }

          async function restoreCleanTarget(dbUrl, manifest, backupName) {
            await ensureExtensions(dbUrl, manifest);
            const realtimeFile = path.resolve('restore_work/realtime.sql');
            await makeRealtimeSql(manifest, dbUrl, realtimeFile);
            const cleanLayouts = await parseCopyLayouts('restore_work/data.sql');
            const integrityFile = path.resolve('restore_work/integrity_before_commit.sql');
            makePostLoadIntegritySql([...cleanLayouts.keys()], integrityFile, { repairSequences: false });
            const transactionalVerifyFile = path.resolve('restore_work/verify_before_commit.sql');
            const transactionalChecks = makeTransactionalVerificationSql(manifest, transactionalVerifyFile);
            const commitMarkerFile = path.resolve('restore_work/commit_marker.sql');
            makeCommitMarkerSql(commitMarkerFile, backupName, manifest.source_slug);
            console.log(`Prepared validated-FK integrity checks plus ${transactionalChecks} hard row-count check(s) and a durable commit marker before COMMIT.`);
            const rolesPath = 'restore_work/roles.sql';
            const schemaPath = 'restore_work/schema.sql';

            const buildArgs = () => {
              const args = [
                '-X','--single-transaction','--variable','ON_ERROR_STOP=1',
                '--file',path.resolve(rolesPath),
                '--file',path.resolve(schemaPath),
                '--command','SET session_replication_role = replica',
                '--file',path.resolve('restore_work/data.sql')
              ];
              if (manifest.has_migration_history && fs.existsSync('restore_work/history_schema.sql') && fs.existsSync('restore_work/history_data.sql')) {
                args.push('--file',path.resolve('restore_work/history_schema.sql'),'--file',path.resolve('restore_work/history_data.sql'));
              }
              args.push('--file', realtimeFile, '--file', integrityFile, '--file', transactionalVerifyFile, '--file', commitMarkerFile);
              return args;
            };

            function commentMatchingLines(file, matcher, reason) {
              const before = fs.readFileSync(file, 'utf8');
              let changed = 0;
              const after = before.split(/\r?\n/).map(line => {
                if (!/^\s*--/.test(line) && matcher(line)) {
                  changed++;
                  return `-- v19 compatibility (${reason}): ${line}`;
                }
                return line;
              }).join('\n');
              if (changed) fs.writeFileSync(file, after);
              return changed;
            }

            function patchCompatibilityError(msg) {
              let changed = 0;
              const pm = msg.match(/permission denied for parameter\s+["']?([A-Za-z0-9_.-]+)["']?/i);
              if (pm) {
                const param = pm[1];
                const esc = param.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const rx = new RegExp(`^\\s*ALTER\\s+(?:ROLE|USER)\\b.*\\b(?:SET|RESET)\\s+"?${esc}"?(?:\\s|=|;|$)`, 'i');
                changed += commentMatchingLines(rolesPath, line => rx.test(line), `target forbids role parameter ${param}`);
              }
              if (/permission denied to grant role\s+"?postgres"?|cli_login_postgres/i.test(msg)) {
                changed += commentMatchingLines(rolesPath, line => /^\s*GRANT\s+"?postgres"?\s+TO\s+"?cli_login_postgres"?/i.test(line), 'reserved Supabase role grant');
              }
              if (/supabase_admin/i.test(msg) && /(owner|permission|must be owner)/i.test(msg)) {
                changed += commentMatchingLines(schemaPath, line => /^\s*ALTER\s+.+\s+OWNER\s+TO\s+"?supabase_admin"?\s*;/i.test(line), 'Supabase-managed owner');
              }
              return changed;
            }

            let lastErr;
            for (let attempt = 1; attempt <= 8; attempt++) {
              try {
                console.log(`Clean-target restore transaction attempt ${attempt}/8 ...`);
                await run('psql', buildArgs(), { env: pgEnvFromUrl(dbUrl), echoStdout: true, echoStderr: true });
                if (!(await commitMarkerExists(dbUrl, backupName))) throw new Error('psql returned success but the durable commit marker is missing. Refusing to report restore success.');
                console.log('Clean-target full logical restore COMMITTED successfully; durable commit marker confirmed.');
                return;
              } catch (err) {
                lastErr = err;
                const msg = safeError(err);

                if (isTransientPgConnectionError(msg)) {
                  const outcome = await resolveTransientRestoreOutcome(dbUrl, backupName, 'Clean-target restore');
                  if (outcome === 'committed') return;
                  if (attempt < 8) {
                    const wait = [5, 10, 20, 30, 30, 30, 30][attempt - 1] || 30;
                    console.warn(`Clean-target transaction is confirmed NOT committed. Retrying the full single-transaction restore in ${wait}s.`);
                    await sleep(wait * 1000);
                    continue;
                  }
                }

                const changed = patchCompatibilityError(msg);
                if (!changed || attempt === 8) throw err;
                console.warn(`Restore transaction rolled back. Applied ${changed} narrowly-scoped Supabase compatibility patch(es); retrying.`);
              }
            }
            throw lastErr;
          }

          async function restoreExistingCompatibleTarget(dbUrl, manifest, currentSchemaFile, backupName) {
            await assertRequiredExtensionsPresent(dbUrl, manifest);
            const backupFp = schemaFingerprint('restore_work/schema.sql');
            const currentFp = schemaFingerprint(currentSchemaFile);
            console.log(`Schema fingerprint backup=${backupFp}`);
            console.log(`Schema fingerprint target=${currentFp}`);
            if (backupFp !== currentFp) {
              console.warn('Schema dump fingerprints differ. v19 does NOT treat a raw schema.sql hash mismatch as proof of incompatibility because separate Supabase projects can produce different dump text for platform/environment details.');
              console.warn('v19 will instead run a structural COPY-column preflight, then let PostgreSQL validate the actual data load inside one transaction. Any incompatibility causes a full rollback.');
            } else {
              console.log('Schema dump fingerprints are identical.');
            }

            const historyData = manifest.has_migration_history && fs.existsSync('restore_work/history_data.sql')
              ? 'restore_work/history_data.sql' : null;
            const preflight = await preflightExistingDataCompatibility(dbUrl, ['restore_work/data.sql', historyData]);
            for (const w of preflight.warnings) console.warn(`COMPAT WARNING: ${w}`);
            if (preflight.errors.length) {
              for (const e of preflight.errors) console.error(`COMPAT ERROR: ${e}`);
              throw new Error(`Existing target is structurally incompatible with this backup (${preflight.errors.length} hard incompatibility error(s)). No target data was changed. Use a clean/new Supabase project for a full schema+data restore.`);
            }
            console.log(`Structural COPY preflight PASSED for ${preflight.layouts.size} table(s).`);

            const uniqueTables = [...preflight.layouts.keys()].sort();
            for (const key of uniqueTables) {
              if (!(await relationExists(dbUrl, key))) throw new Error(`Target schema is missing table required by backup data: ${key}`);
            }

            // Existing-target restore is intentionally DATA-ONLY. It preserves the
            // target schema and restores the selected snapshot's rows. If schema.sql
            // differs, the structural preflight plus single PostgreSQL transaction protect
            // against partial writes: COPY/constraints/types are validated by PostgreSQL itself.
            // For an exact schema rollback, restore to a clean/new Supabase project.
            const truncateSql = [
              "SET lock_timeout = '30s';",
              "SET statement_timeout = '0';",
              'SET session_replication_role = replica;',
              `TRUNCATE TABLE ${uniqueTables.map(quoteQualified).join(', ')} CONTINUE IDENTITY;`
            ].join('\n') + '\n';
            fs.writeFileSync('restore_work/truncate.sql', truncateSql);

            async function makeInPlaceDataFile(inputFile, outputFile) {
              const input = fs.createReadStream(inputFile, { encoding: 'utf8', highWaterMark: 1024 * 1024 });
              const rl = readline.createInterface({ input, crlfDelay: Infinity });
              const output = fs.createWriteStream(outputFile, { encoding: 'utf8', flags: 'w' });
              let removed = 0;
              try {
                for await (const line of rl) {
                  let outLine = line;
                  if (/^\s*SELECT\s+pg_catalog\.setval\s*\(/i.test(line)) {
                    removed++;
                    outLine = `-- in-place restore: preserved target sequence state; skipped: ${line}`;
                  }
                  if (!output.write(outLine + '\n')) await once(output, 'drain');
                }
                output.end();
                await once(output, 'finish');
                return removed;
              } catch (err) {
                output.destroy();
                throw err;
              } finally {
                rl.close();
              }
            }

            const inPlaceData = path.resolve('restore_work/data_inplace.sql');
            let skippedSetvals = await makeInPlaceDataFile('restore_work/data.sql', inPlaceData);
            let inPlaceHistoryData = null;
            if (historyData) {
              inPlaceHistoryData = path.resolve('restore_work/history_data_inplace.sql');
              skippedSetvals += await makeInPlaceDataFile(historyData, inPlaceHistoryData);
            }
            console.log(`In-place sequence protection: CONTINUE IDENTITY; skipped ${skippedSetvals} source pg_dump setval statement(s). v19 will preserve the target sequence phase and advance only sequences that would collide with restored rows.`);

            const realtimeFile = path.resolve('restore_work/realtime.sql');
            await makeRealtimeSql(manifest, dbUrl, realtimeFile);
            const integrityFile = path.resolve('restore_work/integrity_before_commit.sql');
            makePostLoadIntegritySql(uniqueTables, integrityFile, { repairSequences: true });
            const transactionalVerifyFile = path.resolve('restore_work/verify_before_commit.sql');
            const transactionalChecks = makeTransactionalVerificationSql(manifest, transactionalVerifyFile);
            const commitMarkerFile = path.resolve('restore_work/commit_marker.sql');
            makeCommitMarkerSql(commitMarkerFile, backupName, manifest.source_slug);
            console.log(`Prepared ${transactionalChecks} hard row-count check(s), validated-FK checks, a durable commit marker, and forward-only sequence collision repair as the final pre-COMMIT safety step.`);

            const args = [
              '-X','--single-transaction','--variable','ON_ERROR_STOP=1',
              '--command',"SET lock_timeout = '30s'",
              '--command',"SET statement_timeout = '0'",
              '--command','SET session_replication_role = replica',
              '--file',path.resolve('restore_work/truncate.sql'),
              '--file',inPlaceData
            ];
            if (inPlaceHistoryData) args.push('--file',inPlaceHistoryData);
            args.push('--file', realtimeFile, '--file', transactionalVerifyFile, '--file', commitMarkerFile, '--file', integrityFile);

            let lastErr;
            for (let attempt = 1; attempt <= 4; attempt++) {
              await terminateClientSessions(dbUrl);
              try {
                console.log(`In-place transactional data restore attempt ${attempt}/4 ...`);
                await run('psql', args, { env: pgEnvFromUrl(dbUrl), echoStdout: true, echoStderr: true });
                if (!(await commitMarkerExists(dbUrl, backupName))) throw new Error('psql returned success but the durable commit marker is missing. Refusing to report restore success.');
                console.log('In-place data restore COMMITTED successfully; durable commit marker confirmed.');
                if (backupFp !== currentFp) {
                  console.warn('IMPORTANT: data was restored successfully into the CURRENT target schema. The target schema itself was not rolled back to the backup schema. For exact schema+data restoration, use a clean/new target.');
                }
                return;
              } catch (err) {
                lastErr = err;
                const msg = safeError(err);

                if (isTransientPgConnectionError(msg)) {
                  const outcome = await resolveTransientRestoreOutcome(dbUrl, backupName, 'Existing-target restore');
                  if (outcome === 'committed') return;
                  if (attempt < 4) {
                    const wait = [5, 10, 20][attempt - 1] || 20;
                    console.warn(`Existing-target transaction is confirmed NOT committed. Retrying in ${wait}s.`);
                    await sleep(wait * 1000);
                    continue;
                  }
                }

                if (/(deadlock detected|lock timeout|could not obtain lock|canceling statement due to lock timeout)/i.test(msg) && attempt < 4) {
                  const wait = [5, 10, 20, 30][attempt - 1];
                  console.warn(`Lock contention detected; transaction rolled back. Retrying in ${wait}s.`);
                  await sleep(wait * 1000);
                  continue;
                }
                throw new Error(`Existing-target restore was rejected by PostgreSQL and fully rolled back. This normally means the current schema/data constraints are not compatible with the selected backup, or the database connection remained unavailable after retries. Original error: ${msg}`);
              }
            }
            throw lastErr;
          }

          async function verifyTarget(dbUrl, manifest, restoreMode, options = {}) {
            const errors = [], warnings = [];
            const mutableCountsAsWarnings = options.mutableCountsAsWarnings === true;
            const expectedCounts = manifest.verification?.copy_row_counts || {};
            for (const [key, expected] of Object.entries(expectedCounts)) {
              const idx = key.indexOf('.');
              const schema = idx > 0 ? key.slice(0, idx) : '';
              const isApp = !managedSchemas.has(schema) && !schema.startsWith('pg_') && schema !== 'information_schema';
              const isKeyManaged = ['auth.users','auth.identities','storage.buckets','storage.objects'].includes(key);
              if (!isApp && !isKeyManaged) continue;
              const actual = await countTable(dbUrl, key);
              if (actual === null) errors.push(`missing table ${key}`);
              else if (Number(actual) !== Number(expected)) {
                const msg = `row count ${key}: expected=${expected}, actual=${actual}`;
                (mutableCountsAsWarnings ? warnings : errors).push(msg);
              }
            }

            // Independent hard verification for critical Supabase data. Do not rely only on
            // copy_row_counts containing these keys: the manifest stores dedicated counts and a
            // missing/mismatched Auth or Storage metadata table must fail verification.
            const criticalChecks = [
              ['auth.users', 'auth_users_count'],
              ['auth.identities', 'auth_identities_count'],
              ['storage.buckets', 'storage_buckets_count'],
              ['storage.objects', 'storage_objects_count']
            ];
            for (const [key, manifestKey] of criticalChecks) {
              const expected = manifest.verification?.[manifestKey];
              if (expected === undefined || expected === null) {
                errors.push(`manifest is missing critical verification field ${manifestKey}`);
                continue;
              }
              const actual = await countTable(dbUrl, key);
              if (actual === null) errors.push(`missing critical table ${key}`);
              else if (Number(actual) !== Number(expected)) {
                const msg = `critical row count ${key}: expected=${expected}, actual=${actual}`;
                (mutableCountsAsWarnings ? warnings : errors).push(msg);
              }
            }

            // auth/storage/realtime are Supabase-managed schemas. A normal logical dump/restore
            // does not guarantee byte-for-byte identity of all platform-managed triggers/policies,
            // and Supabase documents custom auth/storage schema changes as a separate migration step.
            // Therefore signature drift here is diagnostic, not a hard restore failure.
            const expectedManaged = manifest.verification?.managed_schema_signatures || { triggers: [], policies: [] };
            const actualManaged = await collectManagedSignatures(dbUrl);
            const expectedTriggers = (expectedManaged.triggers || []).slice().sort();
            const actualTriggers = (actualManaged.triggers || []).slice().sort();
            const expectedPolicies = (expectedManaged.policies || []).slice().sort();
            const actualPolicies = (actualManaged.policies || []).slice().sort();

            function signatureDiff(expected, actual) {
              const e = new Set(expected), a = new Set(actual);
              return {
                missing: expected.filter(x => !a.has(x)),
                extra: actual.filter(x => !e.has(x))
              };
            }

            if (JSON.stringify(actualTriggers) !== JSON.stringify(expectedTriggers)) {
              const d = signatureDiff(expectedTriggers, actualTriggers);
              warnings.push(`managed-schema trigger signatures differ (source=${expectedTriggers.length}, target=${actualTriggers.length}, source-only=${d.missing.length}, target-only=${d.extra.length}). ${restoreMode === 'existing' ? 'This is expected to be possible in in-place DATA-ONLY mode because the current target managed schema is intentionally preserved.' : 'Supabase-managed platform objects can differ between projects/versions; custom auth/storage trigger changes must be migrated separately.'}`);
              if (d.missing.length) warnings.push(`managed trigger source-only sample: ${d.missing.slice(0, 3).join(' || ')}`);
              if (d.extra.length) warnings.push(`managed trigger target-only sample: ${d.extra.slice(0, 3).join(' || ')}`);
            }
            if (JSON.stringify(actualPolicies) !== JSON.stringify(expectedPolicies)) {
              const d = signatureDiff(expectedPolicies, actualPolicies);
              warnings.push(`managed-schema policy signatures differ (source=${expectedPolicies.length}, target=${actualPolicies.length}, source-only=${d.missing.length}, target-only=${d.extra.length}). ${restoreMode === 'existing' ? 'This is expected to be possible in in-place DATA-ONLY mode because the current target managed schema is intentionally preserved.' : 'Supabase-managed platform objects can differ between projects/versions; custom auth/storage RLS changes must be migrated separately.'}`);
              if (d.missing.length) warnings.push(`managed policy source-only sample: ${d.missing.slice(0, 3).join(' || ')}`);
              if (d.extra.length) warnings.push(`managed policy target-only sample: ${d.extra.slice(0, 3).join(' || ')}`);
            }

            const expectedRealtime = (manifest.verification?.realtime_publication_tables || []).slice().sort();
            const actualRealtime = (await collectRealtimeTables(dbUrl)).slice().sort();
            if (JSON.stringify(expectedRealtime) !== JSON.stringify(actualRealtime)) errors.push('supabase_realtime publication membership differs');

            const actualExtensions = await collectExtensions(dbUrl);
            const targetExt = new Set(actualExtensions.map(x => x.name));
            const missingExt = (manifest.verification?.extensions || []).map(x => x.name).filter(x => !targetExt.has(x));
            if (missingExt.length) errors.push(`missing extensions: ${missingExt.join(', ')}`);
            const actualExtByName = new Map(actualExtensions.map(x => [x.name, x.version]));
            for (const ext of (manifest.verification?.extensions || [])) {
              const actualVersion = actualExtByName.get(ext.name);
              if (actualVersion && ext.version && actualVersion !== ext.version) {
                warnings.push(`extension version differs for ${ext.name}: backup=${ext.version}, target=${actualVersion}`);
              }
            }

            const storageObjects = Number(manifest.verification?.storage_objects_count || 0);
            const vaultSecrets = Number(manifest.verification?.vault_secrets_count || 0);
            const customLoginRoles = manifest.verification?.custom_login_roles || [];
            if (storageObjects > 0) warnings.push(`backup contains ${storageObjects} storage.objects metadata rows; actual Storage files are outside logical DB backup`);
            if (vaultSecrets > 0) warnings.push(`backup contains ${vaultSecrets} Vault secret rows; a newly created project has a different root encryption key unless migrated separately`);
            if (customLoginRoles.length) warnings.push(`backup contains ${customLoginRoles.length} custom LOGIN role(s); Supabase logical role dumps do not preserve custom role passwords, so passwords must be set separately after a clean/new-project restore`);
            warnings.push('Auth settings/API keys/Edge Functions and other project-level settings are outside this logical database restore.');

            for (const w of warnings) console.warn(`WARNING: ${w}`);
            if (errors.length) {
              for (const e of errors) console.error(`VERIFY ERROR: ${e}`);
              throw new Error(`Post-restore verification failed with ${errors.length} error(s).`);
            }
            console.log('Post-restore database verification PASSED.');
          }

          async function main() {
            console.log(`RESTORE suffix: [${suffix}]`);
            console.log(`Requested backup file: [${requestedFile || 'LATEST COMPLETE'}]`);
            console.log('Mode is AUTO: same D1 suffix is the restore destination. No shadow/green suffix is required.');

            const target = await loadTarget();
            await psql(target.dbUrl, 'SELECT 1;');
            await cleanupOwnedRestoreGuard(target.dbUrl);
            const { name, manifest } = await downloadAndVerifyBackup();
            const state = await inspectTarget(target.dbUrl);

            let restoreMode;
            if (state.clean) {
              restoreMode = 'clean';
              console.log('Target is CLEAN/NEW. Running full official Supabase logical restore (roles + schema + data).');
              await restoreCleanTarget(target.dbUrl, manifest, name);
            } else {
              restoreMode = 'existing';
              console.log(`Target already contains data: ${state.dirty.join(', ')}`);
              console.log('Existing-target mode: local schema preflight -> structural COPY compatibility preflight -> transactional data restore.');
              console.warn('PRE-RESTORE SAFETY SNAPSHOT IS DISABLED: after a successful COMMIT, this workflow has no automatic copy of the immediately previous target state.');
              const currentSchemaFile = await captureCurrentSchemaForPreflight(target.dbUrl);
              await restoreExistingCompatibleTarget(target.dbUrl, manifest, currentSchemaFile, name);
            }

            // All mutable row counts were already hard-checked inside the transaction before
            // COMMIT. After COMMIT, application traffic may legitimately change counts immediately,
            // so post-commit count drift is diagnostic rather than proof of restore failure.
            await verifyTarget(target.dbUrl, manifest, restoreMode, { mutableCountsAsWarnings: true });
            try {
              await cleanupOwnedRestoreGuard(target.dbUrl);
            } catch (e) {
              // The restore is already durably committed and verified. Marker cleanup is housekeeping;
              // failing it must not turn a successful restore into a false operational failure.
              console.warn(`WARNING: restore succeeded but internal commit-marker cleanup could not complete: ${safeError(e)}`);
            }
            console.log('RESTORE SUCCESS: durable COMMIT confirmation and post-restore verification completed.');
            console.log(`Target D1 suffix: [${suffix}] | Backup: [${name}] | Backup source: [${manifest.source_slug || 'unknown'}]`);
          }

          main().catch(err => {
            console.error(`ERROR: ${safeError(err)}`);
            process.exit(1);
          });
          NODE
          node restore_direct_v19.js

      - name: Cleanup local credentials and work files
        if: always()
        run: |
          set +e
          rm -f ~/.config/rclone/rclone.conf
          rm -rf restore_work restore_direct_v19.js
